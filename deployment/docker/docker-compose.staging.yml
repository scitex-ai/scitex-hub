# ============================================
# SciTeX Hub - Staging Override
# ============================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#   Or: make ENV=staging up
#
# Features:
#   - Production-like setup (daphne, copied code)
#   - Different ports from prod (no conflicts)
#   - No Cloudflare tunnel (direct access)
#   - Separate database

name: scitex-hub-staging

services:
  # ============================================
  # Django Application (Staging)
  # ============================================
  django:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.prod
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: scitex-hub-staging-django:latest
    # tini FIRST — an `entrypoint:` override REPLACES the image's ENTRYPOINT
    # wholesale, silently dropping the tini Dockerfile.prod installs as PID 1.
    # Measured on the running container 2026-08-03: PID 1 was `daphne`.
    # `root-init.sh` ends in `exec gosu scitex "$@"`, replacing itself, which is
    # why nothing was left to reap. Same fix and same reason as docker_prod.
    entrypoint: ["/usr/bin/tini", "--", "/root-init.sh", "/entrypoint.sh"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "--access-log", "-", "--verbosity", "1", "config.asgi:application"]
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - scitex_config_volume:/app/.scitex
      # Sibling dev-install checkouts (scitex-ui, figrecipe, scitex-writer,
      # scitex-todo — see .scitex-apps.json). Previously missing here
      # entirely, so a staging rebuild (which recreates this container)
      # wiped .apps/ every time and install_apps.sh re-cloned + reinstalled
      # + npm-installed every sibling from scratch — the 10+ minute
      # pre-daphne window observed live on 2026-07-09
      # (hub-postboot-warmup-window).
      - apps_volume:/app/.apps
      # uv/npm download caches — reused even when a (re)install genuinely
      # is needed, so it doesn't re-fetch from the network every time.
      - uv_cache_volume:/app/.cache/uv
      - npm_cache_volume:/app/.cache/npm
      # User workspace
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users
      # Singularity container
      - ../../deployment/singularity:/app/singularity:ro
      # Docker socket
      # Docker socket REMOVED 2026-08-25 (security): staging shares the
      # host daemon with prod, so holding it here is the same hole.
      # SLURM access (optional - can be disabled for staging)
      - /etc/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - /run/munge:/run/munge
      - /var/log/slurm:/var/log/slurm
      - /var/spool/slurmctld:/var/spool/slurmctld:ro
      - /etc/passwd:/host/etc/passwd:ro
      # Local databases (read-only)
      - ${CROSSREF_LOCAL_DB:-/home/ywatanabe/proj/crossref-local/data/crossref.db}:/data/crossref/crossref.db:ro
      - ${OPENALEX_LOCAL_DB:-/home/ywatanabe/proj/openalex-local/data/openalex.db}:/data/openalex/openalex.db:ro
      # scitex-container (host-mounted, not on PyPI)
      - /home/ywatanabe/proj/scitex-container/src/scitex_container:/usr/local/lib/python3.11/site-packages/scitex_container:ro
      # TypeScript output
      - /app/.jsbuild
    ports:
      - "${SCITEX_HUB_HTTP_PORT:-31294}:8000"   # Staging port (3129X scheme)
      - "${SCITEX_HUB_SSH_PORT:-2213}:2200"     # Staging SSH
    env_file:
      - ./envs/.env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.settings_staging
      SCITEX_HUB_DJANGO_SETTINGS_MODULE: config.settings.settings_staging
      SCITEX_HUB_ENV: staging
      PYTHONPATH: /home/scitex/.local/lib/python3.11/site-packages:/app
      SCITEX_DIR: /app/.scitex
      # install_apps.sh sibling dev-installs: reuse downloaded packages
      # across boots instead of re-fetching from the network every time.
      UV_CACHE_DIR: /app/.cache/uv
      NPM_CONFIG_CACHE: /app/.cache/npm
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${SCITEX_HUB_SLURM_HOST:-DXP480TPLUS-994}:host-gateway"
    # Apptainer here runs ROOTLESS -- there is no setuid starter in the image
    # (/usr/libexec/apptainer/bin/starter-suid is absent, /usr/bin/apptainer is
    # not setuid), so it creates a user namespace rather than escalating. What
    # it needs is the two LSM profiles out of the way, NOT privileged.
    #
    # MEASURED 2026-08-26, throwaway containers from this image, A/B with a
    # positive control:
    #     seccomp=unconfined alone   FAIL  "Failed to set mount propagation"
    #     apparmor=unconfined alone  FAIL  "Failed to create user namespace"
    #     BOTH                       PASS
    #     cap-add SYS_ADMIN alone    FAIL  mount propagation denied
    #     SYS_ADMIN + apparmor       FAIL  "/dev/loop0: operation not permitted"
    #     privileged (control)       PASS
    # Each profile alone fails for a DIFFERENT reason, so the pair is minimal.
    #
    # What this stops granting, relative to privileged: every capability, and
    # every host device. The container keeps the default capability set and
    # sees only /dev/fuse below -- which closes the shortest escape there is,
    # mounting the host block device. Apptainer takes the FUSE path instead,
    # which is why the SYS_ADMIN arm above died on a loop device and this one
    # does not. NOT equivalent to a default container: seccomp and AppArmor
    # off is still weaker, so this reduces blast radius rather than containing.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/fuse:/dev/fuse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 180s
    networks:
      - scitex-network

  # ============================================
  # PostgreSQL (Staging overrides)
  # ============================================
  postgres:
    ports:
      - "127.0.0.1:5434:5432"   # Staging postgres port — loopback only; never reachable off-host
    command: postgres -c max_connections=100 -c shared_buffers=64MB
    restart: unless-stopped

  # ============================================
  # Redis (Staging overrides)
  # ============================================
  redis:
    ports:
      - "127.0.0.1:6380:6379"   # Staging redis port — loopback only; never reachable off-host
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ============================================
  # Celery Worker (Staging)
  # ============================================
  celery_worker:
    image: scitex-hub-staging-django:latest
    # tini FIRST — see the django service above. Measured 2026-08-03: PID 1 was
    # `celery`, while the equivalent PROD worker correctly ran tini.
    entrypoint: ["/usr/bin/tini", "--", "/entrypoint.sh"]
    # POOL=THREADS, NOT PREFORK. The prefork pool wedges on this host: after
    # one boot burst the parent stops acknowledging completed tasks, its QoS
    # window jams full of reservations with worker_pid=None / time_start=None
    # / acknowledged=false, `inspect active` is empty, the control channel
    # still answers ping, and nothing is logged. Five fixes failed against it
    # (tini #379, -O fair + --max-tasks-per-child #381, the celery<5.6 pin
    # with --without-gossip/mingle/heartbeat #384). The differential
    # experiment that settled it: same container, same code, same broker,
    # differing ONLY by --pool=threads, drained 48 tasks in 200s where
    # prefork never exceeded 6. See docker_prod/docker-compose.yml for the
    # full history and tests/develop/test_celery_worker_pool.py for the gate.
    #
    # The prefork-only flags are dropped deliberately: -O fair is a prefork
    # child-dispatch strategy and --max-tasks-per-child / --max-memory-per-child
    # recycle fork children, of which a threads pool has none. Celery ignores
    # them under --pool=threads, so leaving them in place is dead config that
    # reads as an active mitigation for the very wedge they failed to fix.
    command: >
      celery -A config --broker=redis://redis:6379/1 worker
      --loglevel=info
      --queues=celery,ai_queue,search_queue,compute_queue,vis_queue
      --pool=threads
      --concurrency=4
      --prefetch-multiplier=1
      --without-gossip
      --without-mingle
      --without-heartbeat
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - apps_volume:/app/.apps
      - uv_cache_volume:/app/.cache/uv
      - npm_cache_volume:/app/.cache/npm
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users
      - ../../deployment/singularity:/app/singularity:ro
      - /etc/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - /run/munge:/run/munge
      - /var/log/slurm:/var/log/slurm
      - /var/spool/slurmctld:/var/spool/slurmctld:ro
      - /etc/passwd:/host/etc/passwd:ro
      # Local databases (read-only)
      - ${CROSSREF_LOCAL_DB:-/home/ywatanabe/proj/crossref-local/data/crossref.db}:/data/crossref/crossref.db:ro
      - ${OPENALEX_LOCAL_DB:-/home/ywatanabe/proj/openalex-local/data/openalex.db}:/data/openalex/openalex.db:ro
      # scitex-container (host-mounted, not on PyPI)
      - /home/ywatanabe/proj/scitex-container/src/scitex_container:/usr/local/lib/python3.11/site-packages/scitex_container:ro
    env_file:
      - ./envs/.env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.settings_staging
      SCITEX_HUB_DJANGO_SETTINGS_MODULE: config.settings.settings_staging
      SCITEX_HUB_ENV: staging
      PYTHONUNBUFFERED: 1
      SCITEX_DIR: /app/.scitex
      UV_CACHE_DIR: /app/.cache/uv
      NPM_CONFIG_CACHE: /app/.cache/npm
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${SCITEX_HUB_SLURM_HOST:-DXP480TPLUS-994}:host-gateway"
    restart: unless-stopped
    # Healthcheck asserts EXECUTION, not connectivity.
    #
    # This worker serves both `celery` and `vis_queue`, so both beacon stamps
    # are checked: a worker that drains one queue while starving the other is
    # unhealthy, and the visitor-slot re-clean rides on vis_queue.
    #
    # It previously pinged redis, which stays green through a total dispatch
    # wedge -- measured on dev 2026-09-05, where the worker had executed
    # nothing for 12.9h while docker reported "healthy" and the visitor pool
    # sat quarantined. The same wedge was measured on prod 2026-07-14/17 and
    # is why check_queue_liveness.sh exists; only the non-prod compose files
    # were left behind on the ping.
    #
    # retries 10 x interval 60s: ~10 min of consecutive staleness before
    # docker marks unhealthy, so a busy-but-draining worker is never flagged.
    healthcheck:
      test: ["CMD", "bash", "-c", "/app/deployment/docker/common/scripts/check_queue_liveness.sh celery 600 && /app/deployment/docker/common/scripts/check_queue_liveness.sh vis_queue 600"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - scitex-network

  # ============================================
  # Celery Beat (Staging)
  # ============================================
  celery_beat:
    image: scitex-hub-staging-django:latest
    # tini FIRST — see the django service above. Measured 2026-08-03: PID 1 was
    # `celery`, while the equivalent PROD beat correctly ran tini.
    entrypoint: ["/usr/bin/tini", "--", "/entrypoint.sh"]
    command: celery -A config --broker=redis://redis:6379/1 beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - apps_volume:/app/.apps
      - uv_cache_volume:/app/.cache/uv
      - npm_cache_volume:/app/.cache/npm
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users
    env_file:
      - ./envs/.env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.settings_staging
      SCITEX_HUB_DJANGO_SETTINGS_MODULE: config.settings.settings_staging
      SCITEX_HUB_ENV: staging
      PYTHONUNBUFFERED: 1
      SCITEX_DIR: /app/.scitex
      UV_CACHE_DIR: /app/.cache/uv
      NPM_CONFIG_CACHE: /app/.cache/npm
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.Redis(host='redis', port=6379); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - scitex-network

  # Flower removed — run on-demand: docker compose run --rm django celery -A config flower

  # ============================================
  # Gitea (Staging overrides)
  # ============================================
  gitea:
    ports:
      - "${SCITEX_HUB_GITEA_HTTP_PORT:-3013}:3000"   # Staging gitea HTTP
      - "${SCITEX_HUB_GITEA_SSH_PORT:-2232}:22"      # Staging gitea SSH
    restart: unless-stopped

  # ============================================
  # Umami (Staging overrides)
  # ============================================
  umami:
    ports:
      - "${SCITEX_HUB_UMAMI_PORT:-3313}:3000"   # Staging umami port
    restart: unless-stopped

# ============================================
# Additional Staging Volumes
# ============================================
volumes:
  scitex_config_volume:
    driver: local
  # New volumes (2026-07-10, hub-postboot-warmup-window). apps_volume
  # persists sibling dev-install checkouts (scitex-ui, figrecipe,
  # scitex-writer, scitex-todo) across a rebuild/recreate — without it,
  # install_apps.sh's skip-logic can only ever help across simple
  # restarts of the SAME container, not a real rebuild (which is exactly
  # what was observed taking 10+ minutes on 2026-07-09). uv/npm cache
  # volumes speed up the cases where a (re)install genuinely is needed.
  apps_volume:
    driver: local
  uv_cache_volume:
    driver: local
  npm_cache_volume:
    driver: local
