# ============================================
# SciTeX Hub - Development Override
# ============================================
# Automatically loaded with docker-compose.yml when running:
#   docker compose up
#
# Features:
#   - Django runserver with hot reload
#   - Live code mounts (no rebuild for Python/JS changes)
#   - Debug ports (debugpy, Vite HMR)
#   - Verbose logging
#   - FigRecipe editor

name: scitex-hub-dev

services:
  # ============================================
  # Django Application (Development)
  # ============================================
  django:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
        SLURM_VERSION: ${SCITEX_HUB_SLURM_VERSION:-24.05.5}
    image: scitex-hub-dev-django:latest
    volumes:
      # Live code reload
      - ../..:/app:cached
      # SciTeX ecosystem packages (editable mode)
      - ../../../scitex-python:/scitex-python:cached
      - ../../../scitex-tunnel:/scitex-tunnel:cached
      - ../../../figrecipe:/figrecipe:cached
      - ../../../scitex-writer:/scitex-writer:cached
      - ../../../crossref-local:/crossref-local:cached
      - ../../../socialia:/socialia:cached
      - ../../../scitex-io:/scitex-io:cached
      - ../../../scitex-stats:/scitex-stats:cached
      - ../../../scitex-app:/scitex-app:cached
      - ../../../scitex-dev:/scitex-dev:cached
      - ../../../scitex-dataset:/scitex-dataset:cached
      - ../../../scitex-linter:/scitex-linter:cached
      - ../../../openalex-local:/openalex-local:cached
      - ../../../scitex-scholar:/scitex-scholar:cached
      - ../../../scitex-container:/scitex-container:cached
      - ../../../scitex-clew:/scitex-clew:cached
      - ../../../scitex-plt:/scitex-plt:cached
      - ../../../scitex-audio:/scitex-audio:cached
      - ../../../scitex-ui:/scitex-ui:cached
      # Logs
      - ../../logs:/app/logs
      # Persistent data
      - static_volume:/app/staticfiles
      - ../../media:/app/media:cached
      # Cache volumes
      - uv_cache:/root/.cache/uv
      - playwright_cache:/root/.cache/ms-playwright
      - ../../.cache/containers:/app/.cache/containers
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # User workspace
      - ../../data/users:/app/data/users
      # Singularity container images
      - ../../deployment/singularity:/app/singularity:ro
      # SLURM access
      - /etc/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - /etc/munge:/etc/munge:ro
      - /run/munge:/run/munge
      - /var/log/slurm:/var/log/slurm
      - /etc/passwd:/host/etc/passwd:ro
      # Exclude generated files
      - /app/staticfiles
      - /app/.cache
      - /app/.jsbuild
    # Loopback-only, like docker-compose.preview.yml: this stack runs
    # settings_dev, whose DEBUG defaults to True, so an unhandled 500 would
    # serve settings, SQL, locals and the environment to anyone who can reach
    # the host. The debugpy port is worse still -- a remote debugger on a
    # public interface is arbitrary code execution in the Django process.
    # Reach these over an SSH tunnel. Enforced by
    # tests/config/test_compose_keeps_debug_stacks_off_public_interfaces.py
    ports:
      - "127.0.0.1:${SCITEX_HUB_HTTP_PORT:-8000}:8000"
      - "127.0.0.1:${SCITEX_HUB_SSH_PORT:-2200}:2200"
      - "127.0.0.1:${SCITEX_HUB_DEBUGPY_PORT:-5678}:5678"   # debugpy
      - "127.0.0.1:${SCITEX_HUB_VITE_PORT:-5173}:5173"      # Host Vite HMR (platform)
      - "127.0.0.1:5174:5174"                               # Container Vite HMR (dev apps)
    env_file:
      - ./envs/.env.dev
    environment:
      SCITEX_HUB_DJANGO_SETTINGS_MODULE: config.settings.settings_dev
      SCITEX_HUB_ENV: dev
      DEBUG: "True"
      DJANGO_DEBUG: "True"
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      WATCHFILES_FORCE_POLLING: "true"
      SCITEX_WRITER_CACHE_DIR: /app/.cache
      SCITEX_UI_STATIC: /scitex-ui/src/scitex_ui/static/scitex_ui
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/app/deployment/docker/common/scripts/entrypoint-dev.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000", "from_docker"]
    privileged: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${SCITEX_HUB_SLURM_HOST:-localhost}:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    networks:
      - scitex-network

  # ============================================
  # PostgreSQL (Dev overrides)
  # ============================================
  postgres:
    ports:
      - "${SCITEX_HUB_POSTGRES_PORT:-5433}:5432"
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off

  # ============================================
  # Redis (Dev overrides)
  # ============================================
  redis:
    ports:
      - "${SCITEX_HUB_REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --loglevel debug

  # ============================================
  # Celery Worker (Development)
  # ============================================
  celery_worker:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SLURM_VERSION: ${SCITEX_HUB_SLURM_VERSION:-24.05.5}
    image: scitex-hub-dev-django:latest
    volumes:
      - ../..:/app:cached
      - ../../../scitex-python:/scitex-python:cached
      - ../../../scitex-tunnel:/scitex-tunnel:cached
      - ../../../figrecipe:/figrecipe:cached
      - ../../../scitex-writer:/scitex-writer:cached
      - ../../../crossref-local:/crossref-local:cached
      - ../../../socialia:/socialia:cached
      - ../../../scitex-io:/scitex-io:cached
      - ../../../scitex-stats:/scitex-stats:cached
      - ../../../scitex-app:/scitex-app:cached
      - ../../../scitex-dev:/scitex-dev:cached
      - ../../../scitex-dataset:/scitex-dataset:cached
      - ../../../scitex-linter:/scitex-linter:cached
      - ../../../openalex-local:/openalex-local:cached
      - ../../../scitex-scholar:/scitex-scholar:cached
      - ../../../scitex-container:/scitex-container:cached
      - ../../../scitex-clew:/scitex-clew:cached
      - ../../../scitex-plt:/scitex-plt:cached
      - ../../../scitex-audio:/scitex-audio:cached
      - ../../../scitex-ui:/scitex-ui:cached
      - ../../logs:/app/logs
    env_file:
      - ./envs/.env.dev
    environment:
      SCITEX_HUB_DJANGO_SETTINGS_MODULE: config.settings.settings_dev
      SCITEX_HUB_ENV: dev
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/app/deployment/docker/common/scripts/entrypoint-dev.sh"]
    command: >
      celery -A config --broker=redis://redis:6379/1 worker
      --loglevel=info
      --queues=celery,ai_queue,search_queue,compute_queue,vis_queue
      --concurrency=4
      --prefetch-multiplier=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.Redis(host='redis', port=6379); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - scitex-network

  # ============================================
  # Celery Beat (Development)
  # ============================================
  celery_beat:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SLURM_VERSION: ${SCITEX_HUB_SLURM_VERSION:-24.05.5}
    image: scitex-hub-dev-django:latest
    volumes:
      - ../..:/app:cached
      - ../../../scitex-python:/scitex-python:cached
      - ../../../scitex-tunnel:/scitex-tunnel:cached
      - ../../../figrecipe:/figrecipe:cached
      - ../../../scitex-writer:/scitex-writer:cached
      - ../../../crossref-local:/crossref-local:cached
      - ../../../socialia:/socialia:cached
      - ../../../scitex-io:/scitex-io:cached
      - ../../../scitex-stats:/scitex-stats:cached
      - ../../../scitex-app:/scitex-app:cached
      - ../../../scitex-dev:/scitex-dev:cached
      - ../../../scitex-dataset:/scitex-dataset:cached
      - ../../../scitex-linter:/scitex-linter:cached
      - ../../../openalex-local:/openalex-local:cached
      - ../../../scitex-scholar:/scitex-scholar:cached
      - ../../../scitex-container:/scitex-container:cached
      - ../../../scitex-clew:/scitex-clew:cached
      - ../../../scitex-plt:/scitex-plt:cached
      - ../../../scitex-audio:/scitex-audio:cached
      - ../../../scitex-ui:/scitex-ui:cached
      - ../../logs:/app/logs
    env_file:
      - ./envs/.env.dev
    environment:
      SCITEX_HUB_DJANGO_SETTINGS_MODULE: config.settings.settings_dev
      SCITEX_HUB_ENV: dev
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/app/deployment/docker/common/scripts/entrypoint-dev.sh"]
    command: celery -A config --broker=redis://redis:6379/1 beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.Redis(host='redis', port=6379); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - scitex-network

  # Flower removed — run on-demand: docker compose run --rm django celery -A config flower

  # ============================================
  # Gitea (Dev overrides)
  # ============================================
  gitea:
    ports:
      - "${SCITEX_HUB_GITEA_HTTP_PORT:-3001}:3000"
      - "${SCITEX_HUB_GITEA_SSH_PORT:-2222}:22"
    environment:
      GITEA__server__DOMAIN: gitea
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__HTTP_PORT: 3000
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__log__LEVEL: Debug

  # ============================================
  # Umami (Dev overrides)
  # ============================================
  umami:
    ports:
      - "${SCITEX_HUB_UMAMI_PORT:-3300}:3000"

  # ============================================
  # FigRecipe Editor (Dev only)
  # ============================================
  figrecipe-editor:
    image: python:3.11-slim
    volumes:
      - ../../../figrecipe:/figrecipe:cached
    working_dir: /figrecipe
    command: ["bash", "-c", "find /figrecipe -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; pip install --no-cache-dir -q -e /figrecipe[editor] && python -c 'import figrecipe as fr; fr.edit(source=None, port=5500, host=\"0.0.0.0\", open_browser=False)'"]
    ports:
      - "${SCITEX_HUB_FIGRECIPE_PORT:-5500}:5500"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5500/ping', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - scitex-network

# ============================================
# Additional Dev Volumes
# ============================================
volumes:
  uv_cache:
    driver: local
  playwright_cache:
    driver: local
