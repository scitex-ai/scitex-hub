# Production Deployment with Cloudflare Tunnel
# For: UGREEN DXP480T Plus (Home Server)
# No router access or port forwarding needed!
#
# ALWAYS run this file with `--env-file ../envs/.env.prod` (make ENV=prod does
# it for you). `env_file:` below only populates variables INSIDE a container —
# it does not feed the ${...} substitutions in this file, which compose resolves
# at parse time from the shell. Run compose without --env-file and every ${...}
# below silently becomes an empty string, so `docker compose up` cheerfully
# builds a container with a BLANK database password. Postgres survives that
# (its password lives in the data volume) and Django survives it (it talks to
# pgbouncer), so the only thing that breaks is gitea — which crash-loops on
# `password authentication failed`, taking the visitor-slot rescue path down
# with it and leaving every visitor read-only. That cost hours to diagnose on
# 2026-07-13.
#
# Hence the `:?` guards on every secret and required port below: compose now
# ABORTS with a named variable and a fix, instead of quietly wiring up a broken
# stack. Do not "simplify" them away.

# Set project name with environment for clear identification
name: scitex-hub-prod

services:
  django:
    build:
      context: ../../..
      dockerfile: deployment/docker/docker_prod/Dockerfile.prod
      cache_from:
        - scitex-hub-prod-django:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: scitex-hub-prod-django:latest
    entrypoint: ["/root-init.sh", "/entrypoint.sh"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "--access-log", "-", "--verbosity", "1", "config.asgi:application"]
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - scitex_config_volume:/app/.scitex

      # Sibling dev-install checkouts (scitex-ui, figrecipe, scitex-writer,
      # scitex-todo — see .scitex-apps.json). Persisting this across a
      # rebuild/recreate lets install_apps.sh skip re-cloning when nothing
      # changed (hub-postboot-warmup-window, 2026-07-10). Previously
      # missing here entirely, so every container recreate re-cloned all
      # siblings from GitHub regardless of whether anything changed.
      - apps_volume:/app/.apps
      # uv/npm download caches — reused even when a (re)install genuinely
      # is needed, so it doesn't re-fetch from the network every time.
      - uv_cache_volume:/app/.cache/uv
      - npm_cache_volume:/app/.cache/npm

      # scitex-code for citation_graph module (until published to PyPI)
      - /home/ywatanabe/proj/scitex-code/src/scitex/scholar/citation_graph:/usr/local/lib/python3.11/site-packages/scitex/scholar/citation_graph:ro

      # scitex-container for terminal command building (until published to PyPI)
      - /home/ywatanabe/proj/scitex-container/src/scitex_container:/usr/local/lib/python3.11/site-packages/scitex_container:ro

      # User workspace data directory (must match SCITEX_SLURM_USER_DATA_ROOT for terminal passwd files)
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users

      # Singularity/Apptainer container for secure user code execution
      - ../../../deployment/singularity:/app/singularity:ro

      # Docker socket for container status monitoring on server-status page
      - /var/run/docker.sock:/var/run/docker.sock

      # SLURM access (connects to host SLURM for job scheduling)
      - /etc/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - /etc/munge:/etc/munge:ro
      - /run/munge:/run/munge
      - /var/log/slurm:/var/log/slurm
      - /var/spool/slurmctld:/var/spool/slurmctld:ro
      # Mount host passwd for SLURM UID synchronization (prevents "Security violation" errors)
      - /etc/passwd:/host/etc/passwd:ro

      # TypeScript compiled JS output - Docker only, never syncs to host
      - /app/.jsbuild

      # CrossRef database for citation graph service (read-only)
      - /home/ywatanabe/proj/crossref-local/data:/data/crossref:ro

      # OpenAlex database for local search (read-only)
      - /home/ywatanabe/proj/openalex-local/data:/data/openalex:ro

      # Live-editable announcement banner (no rebuild needed)
      - ../../../apps/infra/public_app/templates/public_app/landing_partials/landing_announcement.html:/app/apps/infra/public_app/templates/public_app/landing_partials/landing_announcement.html:ro

      # Orochi agent v3 YAML definitions (read-only) — for A2A AgentCard projection
      - /home/ywatanabe/.scitex/orochi/shared/agents:/app/agents-orochi:ro

    ports:
      - "${SCITEX_HUB_SSH_PORT_PROD:-2200}:2200"  # SSH gateway for user workspaces

    expose:
      - "8000"
    env_file:
      - ../envs/.env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.settings_prod
      - SCITEX_OROCHI_AGENTS_DIR=/app/agents-orochi
      - SCITEX_HUB_DJANGO_SETTINGS_MODULE=config.settings.settings_prod
      - SCITEX_HUB_ENV=prod
      - PYTHONPATH=/home/scitex/.local/lib/python3.11/site-packages:/app
      - CROSSREF_LOCAL_DB=/data/crossref/crossref.db
      - CROSSREF_LOCAL_MODE=db
      - OPENALEX_LOCAL_DB=/data/openalex/openalex.db
      - OPENALEX_LOCAL_MODE=db
      - SCITEX_DIR=/app/.scitex
      - SCITEX_HUB_BUILD_ID=b0a2a30c
      # install_apps.sh sibling dev-installs: reuse downloaded packages
      # across boots instead of re-fetching from the network every time.
      - UV_CACHE_DIR=/app/.cache/uv
      - NPM_CONFIG_CACHE=/app/.cache/npm
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started

    # Allow access to host SLURM
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${SCITEX_HUB_SLURM_HOST:-DXP480TPLUS-994}:host-gateway"

    # Security settings for Apptainer (nested containers)
    # Privileged mode required for mounting proc/sys inside nested containers
    privileged: true
    devices:
      - /dev/fuse:/dev/fuse

    restart: always
    networks:
      - scitex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # Production needs 4-5min for npm install

  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run on first startup (creates umami database)
      - ./init-umami-db.sql:/docker-entrypoint-initdb.d/init-umami-db.sql:ro

    # Shared memory for Postgres performance
    shm_size: 256mb

    env_file:
      - ../envs/.env.prod
    environment:
      # PostgreSQL expects POSTGRES_* variables (not SCITEX_HUB_POSTGRES_*)
      - POSTGRES_DB=${SCITEX_HUB_POSTGRES_DB:?required — pass --env-file ../envs/.env.prod}
      - POSTGRES_USER=${SCITEX_HUB_POSTGRES_USER:?required — pass --env-file ../envs/.env.prod}
      - POSTGRES_PASSWORD=${SCITEX_HUB_POSTGRES_PASSWORD:?required — pass --env-file ../envs/.env.prod}
    # Increase max_connections to handle django, celery workers, gitea, etc.
    command: postgres -c max_connections=200 -c shared_buffers=128MB
    restart: always
    networks:
      - scitex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SCITEX_HUB_POSTGRES_USER:?required — pass --env-file ../envs/.env.prod} -d ${SCITEX_HUB_POSTGRES_DB:?required — pass --env-file ../envs/.env.prod}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PgBouncer connection pooler - prevents "too many clients" errors
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    volumes:
      - ../common/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../common/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    env_file:
      - ../envs/.env.prod
    environment:
      - DATABASE_URL=postgresql://${SCITEX_HUB_POSTGRES_USER:?required — pass --env-file ../envs/.env.prod}:${SCITEX_HUB_POSTGRES_PASSWORD:?required — pass --env-file ../envs/.env.prod}@postgres:5432/${SCITEX_HUB_POSTGRES_DB:?required — pass --env-file ../envs/.env.prod}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - scitex-network
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always
    networks:
      - scitex-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Celery Worker (Async Task Processing)
  celery_worker:
    image: scitex-hub-prod-django:latest
    # tini, exactly as Dockerfile.prod's ENTRYPOINT intends ("tini as PID 1:
    # ensures proper signal forwarding and zombie reaping"). Overriding
    # `entrypoint:` REPLACES the image's ENTRYPOINT wholesale, so every service
    # that overrides it silently drops tini — which left celery running as PID 1
    # with no init and no reaper. See the header note above `celery_worker_vis`.
    entrypoint: ["/usr/bin/tini", "--", "/entrypoint.sh"]
    # NOTE: vis_queue is deliberately NOT here — it has its own worker below.
    # This worker's `celery` queue is a firehose (generate_status_charts alone
    # fans out 48 subtasks every 60s on a 4-core N100), and it starved the
    # visitor-slot re-cleans out of existence: vis_queue sat at 16-36 messages,
    # untouched for hours, while this queue drained. Slot re-cleans are a
    # SECURITY gate — a slot is not distributable until it is wiped and
    # verified — so they must never wait behind chart rendering.
    # -O fair + --max-tasks-per-child: measured wedge signature on prod
    # (2026-07-14 and again 2026-07-17, after tini was restored, so it is
    # NOT an init/reaping problem): each worker processes roughly one
    # prefetch window and then dispatch dies — `inspect reserved` shows a
    # FULL window (time_start=None, worker_pid=None), `inspect active` is
    # empty, the fork children exist and idle, the control channel still
    # answers, and a container restart reproduces the wedge after the next
    # burst. Default (non-fair) scheduling writes reserved tasks into a
    # specific child's pipe; a task parked in a dead/replaced child's pipe
    # is never re-dispatched, which matches exactly. `-O fair` hands a task
    # only to a child that is actually free; max-tasks-per-child recycles
    # children so a slow leak cannot accumulate.
    command: >
      celery -A config --broker=redis://redis:6379/1 worker
      --loglevel=info
      --queues=celery,ai_queue,search_queue,compute_queue
      --concurrency=8
      --prefetch-multiplier=1
      -O fair
      --max-tasks-per-child=50

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - apps_volume:/app/.apps
      - uv_cache_volume:/app/.cache/uv
      - npm_cache_volume:/app/.cache/npm
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users
      - ../../../deployment/singularity:/app/singularity:ro
      - /etc/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - /etc/munge:/etc/munge:ro
      - /run/munge:/run/munge
      - /var/log/slurm:/var/log/slurm
      # Mount host passwd for SLURM UID synchronization
      - /etc/passwd:/host/etc/passwd:ro
      # scitex-code for citation_graph module (until published to PyPI)
      - /home/ywatanabe/proj/scitex-code/src/scitex/scholar/citation_graph:/usr/local/lib/python3.11/site-packages/scitex/scholar/citation_graph:ro

    env_file:
      - ../envs/.env.prod

    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.settings_prod
      - SCITEX_HUB_DJANGO_SETTINGS_MODULE=config.settings.settings_prod
      - SCITEX_HUB_ENV=prod
      - PYTHONUNBUFFERED=1
      - SCITEX_DIR=/app/.scitex
      - SCITEX_HUB_BUILD_ID=b0a2a30c
      - UV_CACHE_DIR=/app/.cache/uv
      - NPM_CONFIG_CACHE=/app/.cache/npm

    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started

    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${SCITEX_HUB_SLURM_HOST:-DXP480TPLUS-994}:host-gateway"

    restart: always
    networks:
      - scitex-network

    # END-TO-END liveness, not a broker ping. The old redis-ping check
    # stayed green through every measured wedge (see -O fair note above):
    # dispatch dies while redis, the control channel and the children all
    # answer. Beat enqueues queue_liveness_beacon("celery") onto THIS
    # worker's `celery` queue every 120s; the task stamps
    # scitex:liveness:celery at EXECUTION time; the check fails LOUD when
    # the stamp is missing or older than 600s — i.e. the worker has not
    # actually run anything from the queue for 10 minutes.
    # start_period 300s: after a deploy the stamp usually survives in the
    # long-running redis container (fresh enough), but on a cold/flushed
    # redis it exists only once beat's next 120s tick fires AND this worker
    # executes it — give the whole beat→broker→worker chain 5 minutes
    # before failures count. retries 10 × interval 60s: ~10 more minutes of
    # consecutive staleness before docker marks unhealthy, so a busy-but-
    # draining worker is never flagged. Docker only MARKS unhealthy; the
    # host's autoheal container is what restarts unhealthy containers.
    healthcheck:
      test: ["CMD", "bash", "/app/deployment/docker/common/scripts/check_queue_liveness.sh", "celery", "600"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 300s

  # Celery worker DEDICATED to the visitor-slot re-clean queue.
  #
  # INCIDENT 2026-07-13/14: the boot path runs `reconcile_visitor_slots --async`,
  # which enqueues the per-slot wipe+verify onto vis_queue. Sharing a worker with
  # the `celery` queue meant those tasks never ran — vis_queue sat static at
  # 16/27/33/36 messages for HOURS while the shared worker chewed through the
  # chart/metrics firehose. So after a restart the pool stayed quarantined and
  # EVERY visitor silently fell back to the read-only user until a human ran the
  # re-clean by hand. Its own queue means it cannot be starved.
  #
  # Concurrency 3, not 8: each reset is ~35s of disk I/O (wipe + re-clone +
  # verify) on a 4-core N100, and 3 clears all 16 slots in ~3 min without
  # fighting the web container for CPU.
  #
  # It needs the SAME mounts as celery_worker: the wipe rewrites the visitor's
  # workspace under /app/data/users, and container_teardown shells out to
  # squeue/scancel (slurm.conf + munge) to cancel the visitor's SLURM job and
  # VERIFY their apptainer instance is gone before the slot may be reused.
  # WHY tini (2026-07-14): Dockerfile.prod sets
  #   ENTRYPOINT ["/usr/bin/tini", "--", "/root-init.sh", "/entrypoint.sh"]
  #   # tini as PID 1: ensures proper signal forwarding and zombie reaping
  # but a compose `entrypoint:` override REPLACES the image ENTRYPOINT outright,
  # so every service here was silently discarding it. celery therefore ran as
  # PID 1 with no init: no zombie reaping, and non-default signal semantics.
  #
  # CORRECTION (2026-07-17): the "children VANISHED" claim that originally
  # motivated tini was a measurement artifact — /proc inside this container
  # shows all 3 ForkPoolWorker children alive while `ps`/`docker top` render
  # none. tini stays (the image installs it deliberately and PID-1-without-
  # init is a real defect), but it did NOT fix the wedge: with tini as PID 1
  # the worker still stalled. The REAL signature (measured 2026-07-14 and
  # re-measured post-tini 2026-07-17): the worker processes ~one prefetch
  # window, then dispatch dies — `inspect reserved` shows a FULL window
  # (time_start=None, worker_pid=None), `inspect active` is empty, children
  # idle, control channel answers, and a restart re-wedges after the next
  # burst. See -O fair rationale on celery_worker above.
  celery_worker_vis:
    image: scitex-hub-prod-django:latest
    entrypoint: ["/usr/bin/tini", "--", "/entrypoint.sh"]
    command: >
      celery -A config --broker=redis://redis:6379/1 worker
      --loglevel=info
      --queues=vis_queue
      --hostname=vis@%h
      --concurrency=3
      --prefetch-multiplier=1
      -O fair
      --max-tasks-per-child=8

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - apps_volume:/app/.apps
      - uv_cache_volume:/app/.cache/uv
      - npm_cache_volume:/app/.cache/npm
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users
      - ../../../deployment/singularity:/app/singularity:ro
      - /etc/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - /etc/munge:/etc/munge:ro
      - /run/munge:/run/munge
      - /var/log/slurm:/var/log/slurm
      - /etc/passwd:/host/etc/passwd:ro

    env_file:
      - ../envs/.env.prod

    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.settings_prod
      - SCITEX_HUB_DJANGO_SETTINGS_MODULE=config.settings.settings_prod
      - SCITEX_HUB_ENV=prod
      - PYTHONUNBUFFERED=1
      - SCITEX_DIR=/app/.scitex
      - UV_CACHE_DIR=/app/.cache/uv
      - NPM_CONFIG_CACHE=/app/.cache/npm

    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started

    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${SCITEX_HUB_SLURM_HOST:-DXP480TPLUS-994}:host-gateway"

    restart: always
    networks:
      - scitex-network

    # END-TO-END liveness for vis_queue — the queue whose silent stall
    # quarantined the whole visitor pool. Same design as celery_worker's
    # check above: beat routes queue_liveness_beacon("vis_queue") onto
    # vis_queue every 120s, the beacon stamps scitex:liveness:vis_queue at
    # EXECUTION time, and this fails LOUD when the stamp is missing or
    # older than 600s. A redis ping cannot see the measured wedge
    # (reserved-full / active-empty / control channel answering). Docker
    # only MARKS unhealthy; the host's autoheal container does the restart.
    healthcheck:
      test: ["CMD", "bash", "/app/deployment/docker/common/scripts/check_queue_liveness.sh", "vis_queue", "600"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 300s

  # Celery Beat (Periodic Task Scheduler)
  celery_beat:
    image: scitex-hub-prod-django:latest
    # tini — same reason as the workers above (the compose entrypoint override
    # otherwise discards the image's tini and leaves celery as PID 1).
    entrypoint: ["/usr/bin/tini", "--", "/entrypoint.sh"]
    command: celery -A config --broker=redis://redis:6379/1 beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler

    volumes:
      - apps_volume:/app/.apps
      - uv_cache_volume:/app/.cache/uv
      - npm_cache_volume:/app/.cache/npm
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users

    env_file:
      - ../envs/.env.prod

    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.settings_prod
      - SCITEX_HUB_DJANGO_SETTINGS_MODULE=config.settings.settings_prod
      - SCITEX_HUB_ENV=prod
      - PYTHONUNBUFFERED=1
      - SCITEX_DIR=/app/.scitex
      - SCITEX_HUB_BUILD_ID=b0a2a30c
      - UV_CACHE_DIR=/app/.cache/uv
      - NPM_CONFIG_CACHE=/app/.cache/npm

    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started

    restart: always
    networks:
      - scitex-network

    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.Redis(host='redis', port=6379); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Flower removed — run on-demand: docker compose run --rm django celery -A config flower

  # Umami - Privacy-focused web analytics
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "${SCITEX_HUB_UMAMI_PORT_PROD:-3300}:3000"
    environment:
      - DATABASE_URL=postgresql://${SCITEX_HUB_POSTGRES_USER:?required — pass --env-file ../envs/.env.prod}:${SCITEX_HUB_POSTGRES_PASSWORD:?required — pass --env-file ../envs/.env.prod}@postgres:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${SCITEX_HUB_UMAMI_APP_SECRET:-scitex-umami-secret-2026}
      - DISABLE_TELEMETRY=1
      - CLIENT_IP_HEADER=X-Forwarded-For
      - IGNORE_IP=${SCITEX_HUB_UMAMI_IGNORE_IP:-}
      - SKIP_LOCATION_HEADERS=1
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - scitex-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # WebSocket to SSH Proxy - Enables SSH access via Cloudflare Tunnel
  # Users connect with: ssh -o ProxyCommand='websocat wss://scitex.ai/ws/ssh/' user@localhost
  ws_ssh_proxy:
    build:
      context: ../ws_ssh_proxy
      dockerfile: Dockerfile
    image: scitex-ws-ssh-proxy:latest
    expose:
      - "8022"
    depends_on:
      - django
    restart: always
    networks:
      - scitex-network
    healthcheck:
      test: ["CMD", "websocat", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Gitea - Git server (core feature)
  gitea:
    image: gitea/gitea:latest
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${SCITEX_HUB_GITEA_HTTP_PORT_PROD:-3000}:3000"  # HTTP (configurable via .env)
      - "${SCITEX_HUB_GITEA_SSH_PORT_PROD:?required — pass --env-file ../envs/.env.prod}:22"
    env_file:
      - ../envs/.env.prod
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${SCITEX_HUB_POSTGRES_DB:?required — pass --env-file ../envs/.env.prod}
      - GITEA__database__USER=${SCITEX_HUB_POSTGRES_USER:?required — pass --env-file ../envs/.env.prod}
      - GITEA__database__PASSWD=${SCITEX_HUB_POSTGRES_PASSWORD:?required — pass --env-file ../envs/.env.prod}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - scitex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Internal Nginx (not exposed to internet - Cloudflare Tunnel handles that)
  nginx:
    image: nginx:alpine
    volumes:
      - ../common/nginx/nginx_prod.conf:/etc/nginx/nginx.conf:ro
      - ../common/nginx/bots.conf:/etc/nginx/bots.conf:ro
      - ../common/nginx/error-pages:/etc/nginx/error-pages:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - django
      - gitea
      - ws_ssh_proxy
    restart: always
    networks:
      - scitex-network
    healthcheck:
      # Check nginx is running (accepts 200/301/302/502/503 — redirects are normal in prod)
      test: ["CMD", "sh", "-c", "curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ | grep -qE '^(200|301|302|502|503)$'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Cloudflare Tunnel (replaces traditional port forwarding!)
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${SCITEX_HUB_CLOUDFLARE_TUNNEL_TOKEN_PROD:?required — pass --env-file ../envs/.env.prod}
    env_file:
      - ../envs/.env.prod
    restart: always
    networks:
      - scitex-network
    depends_on:
      - nginx
    healthcheck:
      # Check if cloudflared is running by testing internal metrics endpoint
      test: ["CMD", "cloudflared", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  # ============================================
  # OpenAlex Local API (Prod only)
  # ============================================
  # Build context is ../openalex_local because THIS file lives in docker_prod/.
  # (docker-compose.prod.yml used ./openalex_local -- it sits one level up.
  # That file is NOT the one prod runs; see the Makefile prod target.)
  openalex:
    build:
      context: ../openalex_local
      dockerfile: Dockerfile
    image: scitex-openalex-prod:latest
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    ports:
      - "${SCITEX_HUB_OPENALEX_PORT_PROD:-31292}:31292"
    volumes:
      # data/openalex.db in the repo is a SYMLINK into openalex-local.bak/data and
      # does not resolve inside the container -- mount the REAL directory (the live
      # ~1.43 TB DB + WAL sidecars). READ-ONLY: this DB must never be container-writable.
      # The entrypoint additionally REFUSES to start on a non-empty -wal, because a
      # read-only reader cannot apply pending frames and would serve stale data silently.
      - ${OPENALEX_LOCAL_DB_DIR:-/home/ywatanabe/proj/openalex-local.bak/data}:/data:ro
    environment:
      - OPENALEX_LOCAL_DB=/data/openalex.db
      - OPENALEX_LOCAL_PORT=31292
      - OPENALEX_LOCAL_HOST=0.0.0.0
      - LOG_LEVEL=info
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "25", "http://localhost:31292/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks:
      - scitex-network

volumes:
  # Use existing nas volumes to preserve all data (including Umami analytics)
  # This migrates data from scitex-hub-nas to scitex-hub-prod containers
  postgres_data:
    external: true
    name: scitex-hub-nas_postgres_data
  redis_data:
    external: true
    name: scitex-hub-nas_redis_data
  static_volume:
    external: true
    name: scitex-hub-nas_static_volume
  media_volume:
    external: true
    name: scitex-hub-nas_media_volume
  gitea_data:
    external: true
    name: scitex-hub-nas_gitea_data
  scitex_config_volume:
    external: true
    name: scitex-hub-nas_scitex_config_volume
  # New volumes (2026-07-10, hub-postboot-warmup-window) — brand new, no
  # prior data to migrate, so plain auto-created volumes rather than
  # `external: true` (which would require them to be pre-created by hand
  # before the next `up`, hard-failing the deploy otherwise).
  apps_volume:
    driver: local
  uv_cache_volume:
    driver: local
  npm_cache_volume:
    driver: local

networks:
  scitex-network:
    driver: bridge
