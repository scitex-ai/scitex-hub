# File: ./deployment/docker/docker_dev/docker-compose.yml
# ============================================
# SciTeX Cloud - Development Environment
# ============================================

# Set project name with environment for clear identification
name: scitex-cloud-dev

services:
  # ============================================
  # Django Application
  # ============================================
  django:
    build:
      context: ../../..
      dockerfile: deployment/docker/docker_dev/Dockerfile
      cache_from:
        - scitex-cloud-dev-django:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
        SLURM_VERSION: ${SCITEX_CLOUD_SLURM_VERSION:-24.05.5}
    image: scitex-cloud-dev-django:latest

    # Volumes - Live code reload
    volumes:
      # Main application code (hot reload with cached mode for performance)
      - ../../..:/app:cached

      # SciTeX ecosystem packages (editable mode) - must exist in ~/proj/
      - ../../../../scitex-python:/scitex-python:cached
      - ../../../../scitex-io:/scitex-io:cached
      - ../../../../scitex-stats:/scitex-stats:cached
      - ../../../../scitex-clew:/scitex-clew:cached
      - ../../../../scitex-tunnel:/scitex-tunnel:cached
      - ../../../../scitex-container:/scitex-container:cached
      - ../../../../scitex-dataset:/scitex-dataset:cached
      - ../../../../scitex-linter:/scitex-linter:cached
      - ../../../../scitex-scholar:/scitex-scholar:cached
      - ../../../../figrecipe:/figrecipe:cached
      - ../../../../scitex-writer:/scitex-writer:cached
      - ../../../../crossref-local:/crossref-local:cached
      - ../../../../openalex-local:/openalex-local:cached
      - ../../../../socialia:/socialia:cached
      - ../../../../scitex-ui:/scitex-ui:cached
      - ../../../../scitex-app:/scitex-app:cached
      - ../../../../scitex-plt:/scitex-plt:cached
      - ../../../../scitex-audio:/scitex-audio:cached
      - ../../../../scitex-dev:/scitex-dev:cached

      # Centralized logging - all container logs go here
      - ../../../logs:/app/logs

      # Persistent data
      - static_volume:/app/staticfiles
      - ../../../media:/app/media:cached

      # Cache volumes (speed up rebuilds) - exclude from host mount
      - uv_cache:/root/.cache/uv
      - playwright_cache:/root/.cache/ms-playwright

      # scitex.writer container cache (optional but recommended)
      - ../../../.cache/containers:/app/.cache/containers

      # Docker socket for user workspace management
      - /var/run/docker.sock:/var/run/docker.sock

      # User workspace data directory (also serves as user home via symlink)
      - ../../../data/users:/app/data/users

      # Singularity/Apptainer container images for secure PTY terminal
      - ../../../deployment/singularity:/app/singularity:ro

      # SLURM access (connects to host SLURM for job scheduling)
      # Mount host's actual slurm.conf for consistency with munge auth
      - /etc/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - /etc/munge:/etc/munge:ro
      - /run/munge:/run/munge
      - /var/log/slurm:/var/log/slurm
      # Mount host passwd for SLURM UID synchronization (prevents "Security violation" errors)
      - /etc/passwd:/host/etc/passwd:ro

      # Explicitly exclude generated files from host mount (performance)
      - /app/staticfiles
      - /app/.cache
      # TypeScript compiled JS output - Docker only, never syncs to host
      - /app/.jsbuild

    # Port mapping
    ports:
      - "${SCITEX_CLOUD_HTTP_PORT_DEV:-8000}:8000"
      - "${SCITEX_CLOUD_SSH_PORT_DEV:-2200}:2200"  # SSH gateway for user workspaces
      - "${SCITEX_CLOUD_DEBUGPY_PORT_DEV:-5678}:5678"  # debugpy/pdb port for remote debugging
      - "${SCITEX_CLOUD_VITE_PORT_DEV:-5173}:5173"  # Vite dev server (HMR)

    # Environment
    env_file:
      - .env

    environment:
      - SCITEX_CLOUD_DJANGO_SETTINGS_MODULE=config.settings.settings_dev
      - DEBUG=True
      - DJANGO_DEBUG=True
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - WATCHFILES_FORCE_POLLING=true  # For NFS/network filesystems
      # scitex.writer specific
      - SCITEX_WRITER_CACHE_DIR=/app/.cache
      # scitex-ui static dir for Vite alias resolution (avoids python3 discovery)
      - SCITEX_UI_STATIC=/scitex-ui/src/scitex_ui/static/scitex_ui

    # Service dependencies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    # Use mounted entrypoint (picks up changes without rebuild)
    entrypoint: ["/app/deployment/docker/docker_dev/entrypoint.sh"]

    # Use Django's runserver with Daphne integration (see settings_dev.py)
    # Daphne in INSTALLED_APPS makes runserver use ASGI automatically
    # Hot reload works natively with Django's autoreload + django-browser-reload
    # "from_docker" argument bypasses the manage.py wrapper safety check
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000", "from_docker"]

    # Allow access to host hardware for monitoring
    privileged: true

    # Allow access to host services (SSH, SLURM, etc.)
    # SCITEX_CLOUD_SLURM_HOST should be set in .env to match /etc/slurm/slurm.conf SlurmctldHost
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${SCITEX_CLOUD_SLURM_HOST:-localhost}:host-gateway"

    # Restart policy
    restart: unless-stopped

    # Health check (faster intervals for dev)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

    # Network
    networks:
      - scitex-dev

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run on first startup (creates umami database)
      - ./init-umami-db.sql:/docker-entrypoint-initdb.d/init-umami-db.sql:ro

    # Shared memory for Postgres performance (prevents "out of shared memory" errors)
    shm_size: 256mb

    # Port mapping (avoid conflict with host postgres)
    ports:
      - "${SCITEX_CLOUD_POSTGRES_PORT_DEV:-5433}:5432"

    env_file:
      - .env

    environment:
      # PostgreSQL expects POSTGRES_* variables (not SCITEX_CLOUD_POSTGRES_*)
      - POSTGRES_DB=${SCITEX_CLOUD_POSTGRES_DB:-scitex_cloud_dev}
      - POSTGRES_USER=${SCITEX_CLOUD_POSTGRES_USER:-scitex_dev}
      - POSTGRES_PASSWORD=${SCITEX_CLOUD_POSTGRES_PASSWORD:-scitex_dev_2025}

    # Enable query logging in development
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SCITEX_CLOUD_POSTGRES_USER:-scitex_dev} -d ${SCITEX_CLOUD_POSTGRES_DB:-scitex_cloud_dev}"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - scitex-dev

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine

    volumes:
      - redis_data:/data

    ports:
      - "${SCITEX_CLOUD_REDIS_PORT_DEV:-6379}:6379"

    # More verbose logging in development
    command: redis-server --appendonly yes --loglevel debug

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - scitex-dev

  # ============================================
  # Celery Worker (Async Task Processing)
  # ============================================
  celery_worker:
    build:
      context: ../../..
      dockerfile: deployment/docker/docker_dev/Dockerfile
      cache_from:
        - scitex-cloud-dev-django:latest
      args:
        SLURM_VERSION: ${SCITEX_CLOUD_SLURM_VERSION:-24.05.5}
    image: scitex-cloud-dev-django:latest

    volumes:
      - ../../..:/app:cached
      - ../../../../scitex-python:/scitex-python:cached
      - ../../../../scitex-io:/scitex-io:cached
      - ../../../../scitex-stats:/scitex-stats:cached
      - ../../../../scitex-clew:/scitex-clew:cached
      - ../../../../scitex-tunnel:/scitex-tunnel:cached
      - ../../../../scitex-container:/scitex-container:cached
      - ../../../../scitex-dataset:/scitex-dataset:cached
      - ../../../../scitex-linter:/scitex-linter:cached
      - ../../../../scitex-scholar:/scitex-scholar:cached
      - ../../../../figrecipe:/figrecipe:cached
      - ../../../../scitex-writer:/scitex-writer:cached
      - ../../../../crossref-local:/crossref-local:cached
      - ../../../../openalex-local:/openalex-local:cached
      - ../../../../socialia:/socialia:cached
      - ../../../../scitex-ui:/scitex-ui:cached
      - ../../../../scitex-app:/scitex-app:cached
      - ../../../../scitex-plt:/scitex-plt:cached
      - ../../../../scitex-audio:/scitex-audio:cached
      - ../../../../scitex-dev:/scitex-dev:cached
      - ../../../logs:/app/logs

    env_file:
      - .env

    environment:
      - SCITEX_CLOUD_DJANGO_SETTINGS_MODULE=config.settings.settings_dev
      - PYTHONUNBUFFERED=1

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    # Use mounted entrypoint (picks up changes without rebuild)
    entrypoint: ["/app/deployment/docker/docker_dev/entrypoint.sh"]

    # Run Celery worker with all queues
    # --max-tasks-per-child: auto-restart worker after N tasks (prevents memory leaks)
    # --max-memory-per-child: auto-restart if worker exceeds 500MB (KB units)
    command: >
      celery -A config --broker=redis://redis:6379/1 worker
      --loglevel=info
      --queues=celery,ai_queue,search_queue,compute_queue,vis_queue
      --concurrency=4
      --prefetch-multiplier=1
      --max-tasks-per-child=100
      --max-memory-per-child=500000

    restart: unless-stopped

    # Override Dockerfile healthcheck (worker doesn't serve HTTP, check redis connectivity)
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.Redis(host='redis', port=6379); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    networks:
      - scitex-dev

  # ============================================
  # Celery Beat (Periodic Task Scheduler)
  # ============================================
  celery_beat:
    build:
      context: ../../..
      dockerfile: deployment/docker/docker_dev/Dockerfile
      cache_from:
        - scitex-cloud-dev-django:latest
      args:
        SLURM_VERSION: ${SCITEX_CLOUD_SLURM_VERSION:-24.05.5}
    image: scitex-cloud-dev-django:latest

    volumes:
      - ../../..:/app:cached
      - ../../../../scitex-python:/scitex-python:cached
      - ../../../../scitex-io:/scitex-io:cached
      - ../../../../scitex-stats:/scitex-stats:cached
      - ../../../../scitex-clew:/scitex-clew:cached
      - ../../../../scitex-tunnel:/scitex-tunnel:cached
      - ../../../../scitex-container:/scitex-container:cached
      - ../../../../scitex-dataset:/scitex-dataset:cached
      - ../../../../scitex-linter:/scitex-linter:cached
      - ../../../../scitex-scholar:/scitex-scholar:cached
      - ../../../../figrecipe:/figrecipe:cached
      - ../../../../scitex-writer:/scitex-writer:cached
      - ../../../../crossref-local:/crossref-local:cached
      - ../../../../openalex-local:/openalex-local:cached
      - ../../../../socialia:/socialia:cached
      - ../../../../scitex-ui:/scitex-ui:cached
      - ../../../../scitex-app:/scitex-app:cached
      - ../../../../scitex-plt:/scitex-plt:cached
      - ../../../../scitex-audio:/scitex-audio:cached
      - ../../../../scitex-dev:/scitex-dev:cached
      - ../../../logs:/app/logs

    env_file:
      - .env

    environment:
      - SCITEX_CLOUD_DJANGO_SETTINGS_MODULE=config.settings.settings_dev
      - PYTHONUNBUFFERED=1

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    # Use mounted entrypoint (picks up changes without rebuild)
    entrypoint: ["/app/deployment/docker/docker_dev/entrypoint.sh"]

    # Run Celery beat scheduler
    command: celery -A config --broker=redis://redis:6379/1 beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler

    restart: unless-stopped

    # Override Dockerfile healthcheck (beat doesn't serve HTTP, check redis connectivity via python)
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.Redis(host='redis', port=6379); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    networks:
      - scitex-dev

  # Flower removed — run on-demand: docker compose run --rm django celery -A config flower

  # ============================================
  # Gitea Git Server
  # ============================================
  gitea:
    image: gitea/gitea:latest

    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    ports:
      - "${SCITEX_CLOUD_GITEA_HTTP_PORT_DEV:-3001}:3000"
      - "${SCITEX_CLOUD_GITEA_SSH_PORT_DEV}:22"

    env_file:
      - .env

    environment:
      # User/Group
      - USER_UID=1000
      - USER_GID=1000

      # Admin account (auto-created)
      - GITEA_ADMIN_USER=${SCITEX_CLOUD_GITEA_ADMIN_USERNAME:-scitex_admin}
      - GITEA_ADMIN_PASSWD=${SCITEX_CLOUD_GITEA_ADMIN_PASSWORD:-scitex_admin_2025}
      - GITEA_ADMIN_EMAIL=${SCITEX_CLOUD_GITEA_ADMIN_EMAIL:-admin@scitex.local}

      # Database connection
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${SCITEX_CLOUD_POSTGRES_DB:-scitex_cloud_dev}
      - GITEA__database__USER=${SCITEX_CLOUD_POSTGRES_USER:-scitex_dev}
      - GITEA__database__PASSWD=${SCITEX_CLOUD_POSTGRES_PASSWORD:-scitex_dev_2025}

      # Server configuration
      - GITEA__server__DOMAIN=gitea
      - GITEA__server__ROOT_URL=http://gitea:3000/
      - GITEA__server__HTTP_PORT=3000

      # Security
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=false

      # Development - Debug logging
      - GITEA__log__LEVEL=Debug

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

    networks:
      - scitex-dev

  # ============================================
  # Umami Analytics (Privacy-focused)
  # ============================================
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest

    ports:
      - "${SCITEX_CLOUD_UMAMI_PORT_DEV:-3300}:3000"

    environment:
      - DATABASE_URL=postgresql://${SCITEX_CLOUD_POSTGRES_USER:-scitex_dev}:${SCITEX_CLOUD_POSTGRES_PASSWORD:-scitex_dev_2025}@postgres:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${SCITEX_CLOUD_UMAMI_APP_SECRET:-scitex-umami-secret-2026}
      - DISABLE_TELEMETRY=1
      - CLIENT_IP_HEADER=X-Forwarded-For
      - IGNORE_IP=${SCITEX_CLOUD_UMAMI_IGNORE_IP:-}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - scitex-dev

  # ============================================
  # FigRecipe Editor (Standalone Demo) - DISABLED
  # ============================================
  # Interactive figure editing will be integrated into /vis/ page instead.
  # The standalone fr.edit() remains available in figrecipe/scitex.plt.
  # figrecipe-editor:
  #   image: python:3.11-slim
  #   volumes:
  #     - ../../../../figrecipe:/figrecipe:cached
  #   working_dir: /figrecipe
  #   command: ["bash", "-c", "pip install -e /figrecipe[editor] && python -c 'import figrecipe as fr; fr.edit(port=5500, host=\"0.0.0.0\", open_browser=False)'"]
  #   ports:
  #     - "5500:5500"
  #   networks:
  #     - scitex-dev

# ============================================
# Volumes
# ============================================
volumes:
  # Persistent data
  postgres_data:
    driver: local

  redis_data:
    driver: local

  gitea_data:
    driver: local

  # Application data
  static_volume:
    driver: local

  # media now uses host mount (../../../media:/app/media)

  # Cache volumes (can be deleted safely)
  uv_cache:
    driver: local

  playwright_cache:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  scitex-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
