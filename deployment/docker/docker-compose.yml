# ============================================
# SciTeX Hub - Base Docker Compose
# ============================================
# Common services shared across all environments
#
# Usage:
#   Dev:     docker compose up                    (auto-loads docker-compose.override.yml)
#   Staging: docker compose -f docker-compose.yml -f docker-compose.staging.yml up
#   Prod:    docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Or use: make ENV=dev|staging|prod up

# ============================================
# YAML Anchors for shared configurations
# ============================================
x-common-env: &common-env
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1

x-healthcheck-redis: &healthcheck-redis
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 3s
  retries: 5

x-healthcheck-postgres: &healthcheck-postgres
  test: ["CMD-SHELL", "pg_isready -U ${SCITEX_HUB_POSTGRES_USER} -d ${SCITEX_HUB_POSTGRES_DB}"]
  interval: 10s
  timeout: 3s
  retries: 5

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./common/postgres/init-umami-db.sql:/docker-entrypoint-initdb.d/init-umami-db.sql:ro
    shm_size: 256mb
    env_file:
      - ./envs/.env.${SCITEX_ENV:-dev}
    environment:
      POSTGRES_DB: ${SCITEX_HUB_POSTGRES_DB:-scitex_hub}
      POSTGRES_USER: ${SCITEX_HUB_POSTGRES_USER:-scitex}
      POSTGRES_PASSWORD: ${SCITEX_HUB_POSTGRES_PASSWORD:-scitex_2025}
    restart: unless-stopped
    healthcheck: *healthcheck-postgres
    networks:
      - scitex-network

  # ============================================
  # PgBouncer Connection Pooler
  # ============================================
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    volumes:
      - ./common/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./common/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    env_file:
      - ./envs/.env.${SCITEX_ENV:-dev}
    environment:
      DATABASE_URL: postgresql://${SCITEX_HUB_POSTGRES_USER:-scitex}:${SCITEX_HUB_POSTGRES_PASSWORD:-scitex_2025}@postgres:5432/${SCITEX_HUB_POSTGRES_DB:-scitex_hub}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Asserts a client can CONNECT, AUTHENTICATE and QUERY -- not merely that
      # the port answers.
      #
      # `pg_isready` is libpq's PQping, which returns OK whenever the server
      # RESPONDS, including when it responds with a REJECTION. Measured
      # 2026-09-06 on the staging pooler (same image), exit codes:
      #
      #                        psql -c 'select 1'      pg_isready
      #   good credentials             0                    0
      #   wrong password               2                    0
      #   unreachable port             2                    0
      #
      # So -U/-d would NOT have deepened the old check; only completing a
      # connection does. This pooler reported `healthy` throughout a
      # 2026-09-06 production outage in which it refused EVERY client
      # connection for ~6 minutes, and that green is why the outage was
      # diagnosed from a log grep instead of from an alarm.
      #
      # PGOPTIONS carries the SAME startup parameter Django sends
      # (config/settings/settings_prod.py `options: -c statement_timeout=...`).
      # That parameter is what the outage tripped on, and pg_isready never
      # sends `options` at all -- so without this the probe could not
      # reproduce the one failure it exists to catch. The gate
      # tests/config/test_pgbouncer_healthcheck_proves_a_client_can_connect.py
      # keeps this list equal to what the settings actually send.
      #
      # Credentials are read from the container environment (env_file above)
      # rather than interpolated here, so the password stays out of
      # `docker inspect` output.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$SCITEX_HUB_POSTGRES_PASSWORD\" PGOPTIONS='-c statement_timeout=30000' PGCONNECT_TIMEOUT=3 psql -h 127.0.0.1 -p 6432 -U \"$$SCITEX_HUB_POSTGRES_USER\" -d \"$$SCITEX_HUB_POSTGRES_DB\" -tAc 'select 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scitex-network

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck: *healthcheck-redis
    networks:
      - scitex-network

  # ============================================
  # Gitea Git Server
  # ============================================
  gitea:
    image: gitea/gitea:latest
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ./envs/.env.${SCITEX_ENV:-dev}
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${SCITEX_HUB_POSTGRES_DB:-scitex_hub}
      GITEA__database__USER: ${SCITEX_HUB_POSTGRES_USER:-scitex}
      GITEA__database__PASSWD: ${SCITEX_HUB_POSTGRES_PASSWORD:-scitex_2025}
      GITEA__security__INSTALL_LOCK: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - scitex-network

  # ============================================
  # Umami Analytics (Privacy-focused)
  # ============================================
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    env_file:
      - ./envs/.env.${SCITEX_ENV:-dev}
    environment:
      DATABASE_URL: postgresql://${SCITEX_HUB_POSTGRES_USER:-scitex}:${SCITEX_HUB_POSTGRES_PASSWORD:-scitex_2025}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${SCITEX_HUB_UMAMI_APP_SECRET:-scitex-umami-secret-2026}
      DISABLE_TELEMETRY: 1
      CLIENT_IP_HEADER: X-Forwarded-For
      IGNORE_IP: ${SCITEX_HUB_UMAMI_IGNORE_IP:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - scitex-network

# ============================================
# Volumes (base definitions)
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  gitea_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  scitex-network:
    driver: bridge
