# ============================================
# SciTeX Hub - Production Override
# ============================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Or: make ENV=prod up
#
# Features:
#   - Daphne ASGI server
#   - Code COPIED into image (no hot reload)
#   - Nginx reverse proxy
#   - Cloudflare tunnel
#   - No debug ports

name: scitex-hub-prod

services:
  # ============================================
  # Autoheal - Restarts unhealthy containers
  # ============================================
  autoheal:
    image: willfarrell/autoheal:latest
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 300
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    networks:
      - scitex-network

  # ============================================
  # Django Application (Production)
  # ============================================
  django:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.prod
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: scitex-hub-prod-django:latest
    entrypoint: ["/usr/bin/tini", "--", "/root-init.sh", "/entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 2G
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "--access-log", "-", "--verbosity", "1", "config.asgi:application"]
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - scitex_config_volume:/app/.scitex
      - apps_volume:/app/.apps
      # scitex-code for citation_graph module (until published to PyPI)
      - /home/ywatanabe/proj/scitex-code/src/scitex/scholar/citation_graph:/usr/local/lib/python3.11/site-packages/scitex/scholar/citation_graph:ro
      # scitex-container (host-mounted, not on PyPI)
      - /home/ywatanabe/proj/scitex-container/src/scitex_container:/usr/local/lib/python3.11/site-packages/scitex_container:ro
      # User workspace
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users
      # Singularity container
      - ../../deployment/singularity:/app/singularity:ro
      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # SLURM access
      - /etc/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - /etc/munge:/etc/munge:ro
      - /run/munge:/run/munge
      - /var/log/slurm:/var/log/slurm
      - /var/spool/slurmctld:/var/spool/slurmctld:ro
      - /etc/passwd:/host/etc/passwd:ro
      # TypeScript output
      - /app/.jsbuild
      # CrossRef database
      - /home/ywatanabe/proj/crossref_local/data:/data/crossref:ro
      # Live-editable announcement banner
      - ../../apps/infra/public_app/templates/public_app/landing_partials/landing_announcement.html:/app/apps/infra/public_app/templates/public_app/landing_partials/landing_announcement.html:ro
    ports:
      - "${SCITEX_CLOUD_SSH_PORT:-2200}:2200"
    expose:
      - "8000"
    env_file:
      - ./envs/.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.settings_prod
      SCITEX_CLOUD_DJANGO_SETTINGS_MODULE: config.settings.settings_prod
      SCITEX_CLOUD_ENV: prod
      PYTHONPATH: /home/scitex/.local/lib/python3.11/site-packages:/app
      CROSSREF_DB_PATH: /data/crossref/crossref.db
      SCITEX_DIR: /app/.scitex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${SCITEX_CLOUD_SLURM_HOST:-DXP480TPLUS-994}:host-gateway"
    privileged: true
    devices:
      - /dev/fuse:/dev/fuse
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "10", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 300s
    labels:
      - "autoheal=true"
    networks:
      - scitex-network

  # ============================================
  # PostgreSQL (Prod overrides)
  # ============================================
  postgres:
    command: postgres -c max_connections=200 -c shared_buffers=128MB
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    restart: always

  # ============================================
  # Redis (Prod overrides)
  # ============================================
  redis:
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: always

  # ============================================
  # Celery Worker (Production)
  # ============================================
  celery_worker:
    image: scitex-hub-prod-django:latest
    entrypoint: ["/entrypoint.sh"]
    command: >
      celery -A config --broker=redis://redis:6379/1 worker
      --loglevel=info
      --queues=celery,ai_queue,search_queue,compute_queue,vis_queue
      --concurrency=8
      --prefetch-multiplier=1
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
        reservations:
          memory: 1G
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - apps_volume:/app/.apps
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users
      - ../../deployment/singularity:/app/singularity:ro
      - /etc/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - /etc/munge:/etc/munge:ro
      - /run/munge:/run/munge
      - /var/log/slurm:/var/log/slurm
      - /etc/passwd:/host/etc/passwd:ro
      - /home/ywatanabe/proj/scitex-code/src/scitex/scholar/citation_graph:/usr/local/lib/python3.11/site-packages/scitex/scholar/citation_graph:ro
      # scitex-container (host-mounted, not on PyPI)
      - /home/ywatanabe/proj/scitex-container/src/scitex_container:/usr/local/lib/python3.11/site-packages/scitex_container:ro
    env_file:
      - ./envs/.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.settings_prod
      SCITEX_CLOUD_DJANGO_SETTINGS_MODULE: config.settings.settings_prod
      SCITEX_CLOUD_ENV: prod
      PYTHONUNBUFFERED: 1
      SCITEX_DIR: /app/.scitex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${SCITEX_CLOUD_SLURM_HOST:-DXP480TPLUS-994}:host-gateway"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.Redis(host='redis', port=6379); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - scitex-network

  # ============================================
  # Celery Beat (Production)
  # ============================================
  celery_beat:
    image: scitex-hub-prod-django:latest
    entrypoint: ["/entrypoint.sh"]
    command: celery -A config --broker=redis://redis:6379/1 beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    volumes:
      - apps_volume:/app/.apps
      - ${SCITEX_SLURM_USER_DATA_ROOT:-/opt/scitex/data/users}:/app/data/users
    env_file:
      - ./envs/.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.settings_prod
      SCITEX_CLOUD_DJANGO_SETTINGS_MODULE: config.settings.settings_prod
      SCITEX_CLOUD_ENV: prod
      PYTHONUNBUFFERED: 1
      SCITEX_DIR: /app/.scitex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.Redis(host='redis', port=6379); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - scitex-network

  # Flower removed — run on-demand: docker compose run --rm django celery -A config flower

  # ============================================
  # Gitea (Prod overrides)
  # ============================================
  gitea:
    ports:
      - "${SCITEX_CLOUD_GITEA_HTTP_PORT:-3000}:3000"
      - "${SCITEX_CLOUD_GITEA_SSH_PORT}:22"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    restart: always

  # ============================================
  # Umami (Prod overrides)
  # ============================================
  umami:
    ports:
      - "${SCITEX_CLOUD_UMAMI_PORT:-3300}:3000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: always

  # ============================================
  # CrossRef API (Prod only)
  # ============================================
  crossref:
    build:
      context: ./crossref_local
      dockerfile: Dockerfile
    image: scitex-crossref-prod:latest
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    ports:
      - "31291:31291"
    volumes:
      - /home/ywatanabe/proj/crossref-local/data:/data:ro
    environment:
      CROSSREF_DB_PATH: /data/crossref.db
      LOG_LEVEL: info
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "25", "http://localhost:31291/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks:
      - scitex-network

  # ============================================
  # WebSocket SSH Proxy (Prod only)
  # ============================================
  ws_ssh_proxy:
    build:
      context: ./ws_ssh_proxy
      dockerfile: Dockerfile
    image: scitex-ws-ssh-proxy:latest
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    expose:
      - "8022"
    depends_on:
      - django
    restart: always
    healthcheck:
      test: ["CMD", "websocat", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scitex-network

  # ============================================
  # Nginx Reverse Proxy (Prod only)
  # ============================================
  nginx:
    image: nginx:alpine
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    volumes:
      - ./common/nginx/nginx_prod.conf:/etc/nginx/nginx.conf:ro
      - ./common/nginx/bots.conf:/etc/nginx/bots.conf:ro
      - ./common/nginx/error-pages:/etc/nginx/error-pages:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - django
      - gitea
      - crossref
      - ws_ssh_proxy
    restart: always
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ | grep -qE '^(200|502|503)$'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - scitex-network

  # ============================================
  # Cloudflare Tunnel (Prod only)
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    command: tunnel --no-autoupdate run --token ${SCITEX_CLOUD_CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - ./envs/.env.prod
    restart: always
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "cloudflared", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - scitex-network

# ============================================
# Additional Prod Volumes
# ============================================
volumes:
  scitex_config_volume:
    driver: local
  apps_volume:
    driver: local
