user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use Docker's internal DNS resolver with short TTL
    # Prevents stale IP after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Cloudflare provides SSL termination, so we listen on HTTP internally
    # Cloudflare Tunnel handles HTTPS

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zones to prevent flood attacks
    # API health endpoints: 10 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=health_limit:10m rate=10r/m;
    # General API: 60 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=a2a_limit:10m rate=60r/m;
    # Burst limit for general requests
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Bot UA denylist + SciTeX-Agent bypass (issue #149).
    # Defines $bot_block == 1 for bots without X-SciTeX-Agent header.
    include /etc/nginx/bots.conf;

    # All upstreams use variable-based proxy_pass (no upstream blocks).
    # This forces nginx to re-resolve via Docker DNS (127.0.0.11) on every request,
    # preventing stale IPs after container restarts (e.g., NAS reboot).

    # Main server (scitex.ai)
    server {
        listen 80;
        server_name scitex.ai www.scitex.ai localhost _;
        # NOTE (2026-08-17): two `return 403` tourniquets stood here from
        # 2026-07-24 — `location /apps/figrecipe/figrecipe/` and `location
        # /writer/`. Both are REMOVED because the code fixes they were waiting
        # on shipped (card sec-working-dir-passthrough-family), and because an
        # edge rule is a mitigation, not a guard: it protects exactly this one
        # deployment, leaves dev and staging (no nginx) unguarded, and stops
        # guarding the moment someone edits this file with nothing going red.
        # The figrecipe half of this was already retired on develop ahead of
        # this branch (#646); this merge additionally drops the /writer/ one.
        #
        # The properties they covered are now asserted IN DJANGO, where they
        # fail the build if they regress:
        #   figrecipe  -> tests/security/test_figrecipe_wrapper_authorization.py
        #                 (@login_required + the path jail across all three of
        #                 figrecipe's injection channels, driven through the
        #                 real routed URLs)
        #   /writer/   -> tests/config/test_writer_mount.py (the raw upstream
        #                 urlconf is not mounted anywhere, and /writer/ 301s to
        #                 the login-gated /apps/writer/)
        #
        # Do NOT re-add a blanket 403 here without also deleting the tests that
        # claim the routes work: the figrecipe block was, on its own, the reason
        # FigRecipe's gallery rendered blank in production, and the /writer/
        # block intercepted the legacy 301 so every old /writer/ link 403'd
        # instead of reaching the working app.

        # SECURITY 2026-08-18: the repo browser renders .git INTERNALS to anonymous
        # clients. Measured live on prod, anonymous, at 2026-08-18T04:27:40Z, with a
        # negative control so the finding is not a 200-shaped guess:
        #   GET /ywatanabe/test2/blob/.git/HEAD           -> 200, and the body carries
        #        <pre><code id="code-content">ref: refs/heads/main
        #   GET /ywatanabe/test2/blob/.git/NOSUCHFILE-xyz -> no ref in the body
        # The control is what makes it a disclosure rather than a coincidence: a bogus
        # path under .git leaks nothing, so the ref above is real file content being
        # rendered, not template text.
        # A walkable object store is a full source-disclosure primitive -- it
        # reconstructs history, including files committed and later removed, which is
        # exactly where credentials leak. Two different IPs were logged fetching the
        # SAME object 7 seconds apart (181.189.16.159 03:28:55Z, 78.124.193.137
        # 03:29:02Z), so this is a coordinated crawl, not an accident.
        # 404 rather than 403 ON PURPOSE: a 403 confirms the path exists.
        # EDGE TOURNIQUET ONLY. The root cause is in the repo browser view, carded as
        # hub-repo-browser-serves-git-internals-20260817. REMOVE this block only after
        # that code fix is deployed AND these paths are re-probed anonymously -- the
        # same discipline the FigRecipe tourniquet above was retired under.

        # SECURITY 2026-08-18, SECOND ROUTE. The block above covers the repo
        # browser; it does NOT cover the workspace API, which serves the same
        # files through a different prefix and was still open after that fix.
        # Found by a read-only code audit (handyman-c03-04) and then MEASURED
        # anonymously on live prod, with controls, at 2026-08-18T05:36Z:
        #   /api/workspace/file-content/.git/HEAD?project_id=<public>
        #        -> 200 {"success": true, "content": "ref: refs/heads/main\n"}
        #   /api/workspace/file-content/.git/config?project_id=<public>
        #        -> 200 with the real [core] stanza
        #   control README.md -> 200  (the route works normally)
        #   control .env      -> 404  (a genuine not-found, so the 200s above
        #                              are real content and not a catch-all)
        # Reproduced on TWO different public projects. The view requires only
        # project_id and visibility == "public"; its path guard is CONTAINMENT
        # ONLY, and .git lives inside the project root, so it passes.
        # .env is blocked too: it did not exist in the projects probed, but the
        # same handler would serve it to an anonymous reader if it did.
        # EDGE TOURNIQUET. Root cause is a missing dotfile-component rule at the
        # serving chokepoints (get_file_context, api_get_file_content, and the
        # TRIP backend's _full_path). Remove only after that lands AND these
        # paths are re-probed anonymously.
        location ~ ^/api/workspace/file-content/(.*/)?\.git(/|$) { return 404; }
        location ~ ^/api/workspace/file-content/(.*/)?\.env$ { return 404; }

        location ~ ^/[^/]+/[^/]+/(blob|raw)/(.*/)?\.git(/|$) { return 404; }

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        # Custom error pages - return 503 to bypass Cloudflare's error page
        # Cloudflare intercepts 502 but typically passes 503 through
        error_page 502 =503 /502.html;
        error_page 503 504 /502.html;
        location = /502.html {
            root /etc/nginx/error-pages;
            internal;
            # Ensure our error page is sent, not Cloudflare's
            add_header Retry-After 30 always;
        }

        # Static files — no-cache to force revalidation on deploy
        # (previously "public, immutable" which caused stale CSS after deploys)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header X-Content-Type-Options "nosniff";
        }

        # WebSocket SSH Proxy - Enables SSH access via WebSocket
        # Users connect with: ssh -o ProxyCommand='websocat wss://scitex.ai/ws/ssh/' user@localhost
        location /ws/ssh/ {
            set $ws_ssh_upstream http://ws_ssh_proxy:8022;
            proxy_pass $ws_ssh_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # CrossRef API (available at /api/crossref/)
        location /api/crossref/ {
            set $crossref_upstream http://crossref:31291;
            proxy_pass $crossref_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Rate-limited health check endpoints (prevent flood attacks)
        location /api/scholar/citation-graph/health/ {
            limit_req zone=health_limit burst=5 nodelay;
            limit_req_status 429;

            set $django_upstream http://django:8000;
            proxy_pass $django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Rate-limited API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $django_upstream http://django:8000;
            proxy_pass $django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Dev App Vite HMR Proxy — TypeScript for developmentally-installed apps
        # Vite dev server runs in Django container on port 5174 (on-demand)
        # Only active when users have dev apps with TypeScript files
        location /_vite_dev_app/ {
            set $vite_dev_app http://django:5174;
            proxy_pass $vite_dev_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Django application
        location / {
            # Block known crawlers unless they set X-SciTeX-Agent
            # (dev agents / MCP tools identify themselves via that header).
            # See deployment/docker/common/nginx/bots.conf and issue #149.
            if ($bot_block) {
                return 429;
            }

            set $django_upstream http://django:8000;
            proxy_pass $django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # Force HTTPS scheme (Cloudflare provides SSL)
            proxy_redirect off;
            proxy_buffering off;

            # WebSocket support (for real-time collaboration)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }

    # Gitea subdomain (gitea.scitex.ai)
    server {
        listen 80;
        server_name gitea.scitex.ai git.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            set $gitea_upstream http://gitea:3000;
            proxy_pass $gitea_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            client_max_body_size 512M;  # Large repo uploads
        }
    }

    # A2A protocol surface subdomain (a2a.scitex.ai) — fleet-wide
    # AgentCard discovery + JSON-RPC. Mirrors the gitea pattern.
    server {
        listen 80;
        server_name a2a.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            limit_req zone=a2a_limit burst=30 nodelay;
            limit_req_status 429;

            set $django_upstream http://django:8000;
            proxy_pass $django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }
    }

    # CrossRef API subdomain (crossref.scitex.ai)
    server {
        listen 80;
        server_name crossref.scitex.ai api.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            set $crossref_upstream http://crossref:31291;
            proxy_pass $crossref_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Umami Analytics subdomain (analytics.scitex.ai)
    server {
        listen 80;
        server_name analytics.scitex.ai umami.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            set $umami_upstream http://umami:3000;
            proxy_pass $umami_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
