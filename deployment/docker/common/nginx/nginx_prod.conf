user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use Docker's internal DNS resolver with short TTL
    # Prevents stale IP after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Cloudflare provides SSL termination, so we listen on HTTP internally
    # Cloudflare Tunnel handles HTTPS

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream django {
        server django:8000;
    }

    upstream gitea {
        server gitea:3000;
    }

    # CrossRef upstream resolved at request time (allows nginx to start without crossref)
    # Uses variable-based proxy_pass in location blocks instead of upstream block

    upstream ws_ssh_proxy {
        server ws_ssh_proxy:8022;
    }

    upstream umami {
        server umami:3000;
    }

    # Main server (scitex.ai)
    server {
        listen 80;
        server_name scitex.ai www.scitex.ai localhost _;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        # Custom error pages - return 503 to bypass Cloudflare's error page
        # Cloudflare intercepts 502 but typically passes 503 through
        error_page 502 =503 /502.html;
        error_page 503 504 /502.html;
        location = /502.html {
            root /etc/nginx/error-pages;
            internal;
            # Ensure our error page is sent, not Cloudflare's
            add_header Retry-After 30 always;
        }

        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header X-Content-Type-Options "nosniff";
        }

        # WebSocket SSH Proxy - Enables SSH access via WebSocket
        # Users connect with: ssh -o ProxyCommand='websocat wss://scitex.ai/ws/ssh/' user@localhost
        location /ws/ssh/ {
            proxy_pass http://ws_ssh_proxy/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # CrossRef API (available at /api/crossref/)
        location /api/crossref/ {
            set $crossref_upstream http://crossref:31291;
            proxy_pass $crossref_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Django application
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # Force HTTPS scheme (Cloudflare provides SSL)
            proxy_redirect off;
            proxy_buffering off;

            # WebSocket support (for real-time collaboration)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }

    # Gitea subdomain (gitea.scitex.ai)
    server {
        listen 80;
        server_name gitea.scitex.ai git.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            proxy_pass http://gitea;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            client_max_body_size 512M;  # Large repo uploads
        }
    }

    # CrossRef API subdomain (crossref.scitex.ai)
    server {
        listen 80;
        server_name crossref.scitex.ai api.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            set $crossref_upstream http://crossref:31291;
            proxy_pass $crossref_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Umami Analytics subdomain (analytics.scitex.ai)
    server {
        listen 80;
        server_name analytics.scitex.ai umami.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            proxy_pass http://umami;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
