user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use Docker's internal DNS resolver with short TTL
    # Prevents stale IP after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Cloudflare provides SSL termination, so we listen on HTTP internally
    # Cloudflare Tunnel handles HTTPS

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zones to prevent flood attacks
    # API health endpoints: 10 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=health_limit:10m rate=10r/m;
    # General API: 60 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=a2a_limit:10m rate=60r/m;
    # Burst limit for general requests
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Bot UA denylist + SciTeX-Agent bypass (issue #149).
    # Defines $bot_block == 1 for bots without X-SciTeX-Agent header.
    include /etc/nginx/bots.conf;

    # All upstreams use variable-based proxy_pass (no upstream blocks).
    # This forces nginx to re-resolve via Docker DNS (127.0.0.11) on every request,
    # preventing stale IPs after container restarts (e.g., NAS reboot).

    # Main server (scitex.ai)
    server {
        listen 80;
        server_name scitex.ai www.scitex.ai localhost _;
        # SECURITY P0 2026-07-24: the figrecipe wrapper (apps/workspace/figrecipe_app/urls/figrecipe.py)
        # has NO @login_required AND honours a caller-supplied ?working_dir=, yielding an
        # UNAUTHENTICATED arbitrary-path directory listing. Verified live on prod before blocking:
        #   GET /apps/figrecipe/figrecipe/api/tree?working_dir=/tmp -> 200 (listed /tmp)
        #   GET /apps/figrecipe/figrecipe/api/files                 -> 200 (listed the tenant data root)
        # Edge tourniquet until the code fix lands (branch security/working-dir-passthrough-family).
        # The legitimate login-guarded pages live one segment up at /apps/figrecipe/ and are NOT blocked.
        # REMOVE THIS BLOCK only after the code fix is deployed AND the routes are re-probed.
        location /apps/figrecipe/figrecipe/ { return 403; }
        # SECURITY P0 2026-07-24: raw upstream scitex_writer mount (config/urls.py:146) — no auth,
        # no CSRF, honours ?working_dir= -> UNAUTHENTICATED arbitrary-path read. Verified live:
        #   GET /writer/api/files?working_dir=/tmp -> 200 (directory listing).
        # The legitimate writer is /apps/writer/ (login-gated). Tourniquet until the code fix.
        location /writer/ { return 403; }

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        # Custom error pages - return 503 to bypass Cloudflare's error page
        # Cloudflare intercepts 502 but typically passes 503 through
        error_page 502 =503 /502.html;
        error_page 503 504 /502.html;
        location = /502.html {
            root /etc/nginx/error-pages;
            internal;
            # Ensure our error page is sent, not Cloudflare's
            add_header Retry-After 30 always;
        }

        # Static files — no-cache to force revalidation on deploy
        # (previously "public, immutable" which caused stale CSS after deploys)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header X-Content-Type-Options "nosniff";
        }

        # WebSocket SSH Proxy - Enables SSH access via WebSocket
        # Users connect with: ssh -o ProxyCommand='websocat wss://scitex.ai/ws/ssh/' user@localhost
        location /ws/ssh/ {
            set $ws_ssh_upstream http://ws_ssh_proxy:8022;
            proxy_pass $ws_ssh_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # CrossRef API (available at /api/crossref/)
        location /api/crossref/ {
            set $crossref_upstream http://crossref:31291;
            proxy_pass $crossref_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Rate-limited health check endpoints (prevent flood attacks)
        location /api/scholar/citation-graph/health/ {
            limit_req zone=health_limit burst=5 nodelay;
            limit_req_status 429;

            set $django_upstream http://django:8000;
            proxy_pass $django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Rate-limited API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            set $django_upstream http://django:8000;
            proxy_pass $django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Dev App Vite HMR Proxy — TypeScript for developmentally-installed apps
        # Vite dev server runs in Django container on port 5174 (on-demand)
        # Only active when users have dev apps with TypeScript files
        location /_vite_dev_app/ {
            set $vite_dev_app http://django:5174;
            proxy_pass $vite_dev_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Django application
        location / {
            # Block known crawlers unless they set X-SciTeX-Agent
            # (dev agents / MCP tools identify themselves via that header).
            # See deployment/docker/common/nginx/bots.conf and issue #149.
            if ($bot_block) {
                return 429;
            }

            set $django_upstream http://django:8000;
            proxy_pass $django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # Force HTTPS scheme (Cloudflare provides SSL)
            proxy_redirect off;
            proxy_buffering off;

            # WebSocket support (for real-time collaboration)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }

    # Gitea subdomain (gitea.scitex.ai)
    server {
        listen 80;
        server_name gitea.scitex.ai git.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            set $gitea_upstream http://gitea:3000;
            proxy_pass $gitea_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            client_max_body_size 512M;  # Large repo uploads
        }
    }

    # A2A protocol surface subdomain (a2a.scitex.ai) — fleet-wide
    # AgentCard discovery + JSON-RPC. Mirrors the gitea pattern.
    server {
        listen 80;
        server_name a2a.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            limit_req zone=a2a_limit burst=30 nodelay;
            limit_req_status 429;

            set $django_upstream http://django:8000;
            proxy_pass $django_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }
    }

    # CrossRef API subdomain (crossref.scitex.ai)
    server {
        listen 80;
        server_name crossref.scitex.ai api.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            set $crossref_upstream http://crossref:31291;
            proxy_pass $crossref_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Umami Analytics subdomain (analytics.scitex.ai)
    server {
        listen 80;
        server_name analytics.scitex.ai umami.scitex.ai;

        # Trust Cloudflare proxy headers
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;

        location / {
            set $umami_upstream http://umami:3000;
            proxy_pass $umami_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
