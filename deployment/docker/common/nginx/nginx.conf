user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Private media handed off by Django (X-Accel-Redirect) loses Django's
    # own response headers except Content-Type/Disposition/Cache-Control, so
    # the internal location re-adds the sandbox policy. PDFs are exempt
    # because browser PDF viewers do not render under a sandbox CSP.
    map $uri $protected_media_csp {
        ~*\.pdf$ "";
        default "sandbox; default-src 'none'";
    }

    upstream django {
        server django:8000;
    }

    # status.scitex.ai → redirect to /status/ on main site
    server {
        listen 80;
        server_name status.scitex.ai;

        location / {
            return 301 https://scitex.ai/status/;
        }
    }

    server {
        listen 80;
        server_name localhost;

        # Show friendly "Starting up" page when Django is unavailable
        error_page 502 503 504 /502.html;
        location = /502.html {
            root /etc/nginx/error-pages;
            internal;
        }

        # Static files — no-cache to force revalidation on deploy
        # (previously "public, immutable" which caused stale CSS after deploys)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Public media assets only; private media is authorised by Django
        # and handed back via X-Accel-Redirect (see nginx_prod.conf).
        location ^~ /media/avatars/ {
            alias /app/media/avatars/;
            expires 7d;
        }
        location ^~ /media/organization_avatars/ {
            alias /app/media/organization_avatars/;
            expires 7d;
        }
        location ^~ /media/videos/ {
            alias /app/media/videos/;
            expires 7d;
        }
        location ^~ /media/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Media-Accel-Prefix /_protected_media/;
            proxy_redirect off;
        }
        location ^~ /_protected_media/ {
            internal;
            alias /app/media/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy $protected_media_csp always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
        }
    }
}
