# gitea_front — reverse proxy in front of prod gitea (git.scitex.ai).
#
# Runs in gitea's own network namespace (compose: network_mode "service:gitea")
# and listens on :3000, the port the Cloudflare tunnel route (gitea:3000), the
# host port mapping and Django's GITEA URL already use. Gitea itself moves to
# 127.0.0.1:3001 inside the same namespace, so every HTTP request reaches gitea
# through this file. No tunnel-route or nginx change is needed.
#
# Policy (author's decision 2026-11-26, "sign-in for heavy pages only"):
#   - anonymous visitors still see repository pages (home, src, raw, issues,
#     pulls, releases, wiki);
#   - compare, blame, commit history (commit, commits, graph) and archives
#     need sign-in: anonymous requests get 303 -> /user/login, the same
#     answer gitea's own REQUIRE_SIGNIN_VIEW=expensive gives, before any git
#     work is done;
#   - per-client rate limit on web pages (client = CF-Connecting-IP).
#
# Why not gitea's own REQUIRE_SIGNIN_VIEW=expensive: in 1.25.2 its route list
# (routers/common/blockexpensive.go) does NOT contain /compare/ (74 % of the
# crawler traffic), and it also closes src, raw, media, issues, pulls, wiki and
# activity to anonymous visitors, which the decision keeps open.
#
# Signed-in detection: gitea sets its session cookie (i_like_gitea) for
# anonymous visitors too, so the cookie alone proves nothing. A request
# without it is anonymous for certain and is redirected here, at no cost to
# gitea. A request with it is checked by an auth subrequest to
# /notifications/new (sign-in required, one count query): 200 for a signed-in
# user, 303 to the login page for anyone else.

worker_processes auto;
error_log /dev/stderr error;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # One line per request was the 2.9 GB/day problem in gitea; do not move it
    # here. Log every 5xx, and a 1 % sample of everything else: enough to see
    # the crawl rate (x100), what it asks for and how it is answered, at about
    # 1/100 of the old volume. $sampled is in the line so the two are separable.
    split_clients "${request_id}" $sampled {
        1%  1;
        *   0;
    }
    map $status $is_5xx {
        ~^5     1;
        default 0;
    }
    map "$is_5xx$sampled" $front_log {
        "00"    0;
        default 1;
    }
    log_format front '$time_iso8601 $status s=$sampled $request_method "$uri" $request_time';
    access_log /dev/stdout front if=$front_log;

    # Location: /user/login, not http://<host>:3000/user/login (the public
    # URL has no port; the browser resolves the relative path itself).
    absolute_redirect off;

    # Large pushes, long clones and the /user/events stream go straight through.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # The tunnel connects from the cloudflared container; the visitor's address
    # is in CF-Connecting-IP. Internal callers (Django) send no such header.
    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # Web pages: 5 r/s per client with a burst of 40, enough for a person
    # clicking through a repository, not for a crawler.
    limit_req_zone $client_ip zone=gitea_web:20m rate=5r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";

    server {
        listen 3000 default_server;

        # Liveness of this proxy AND its path to gitea (used by the healthcheck).
        location = /-/front-health {
            access_log off;
            proxy_pass http://127.0.0.1:3001/api/v1/version;
        }

        # Heavy pages: sign-in required.
        location ~ ^/(?!api/|user/|-/|assets/)[^/]+/[^/]+/(compare|blame|commit|commits|graph|archive)(/|$) {
            if ($cookie_i_like_gitea = "") {
                return 303 /user/login;
            }
            auth_request /-/front-signed-in;
            error_page 401 = @login;
            limit_req zone=gitea_web burst=40 nodelay;
            proxy_pass http://127.0.0.1:3001;
        }

        location = /-/front-signed-in {
            internal;
            proxy_pass http://127.0.0.1:3001/notifications/new;
            proxy_method GET;
            proxy_pass_request_body off;
            # A location with its own proxy_set_header inherits none from http{}.
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header Connection "";
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 = @not_signed_in;
        }

        location @not_signed_in {
            return 401;
        }

        location @login {
            return 303 /user/login;
        }

        # Not rate limited: the API (Django), static assets, avatars, the
        # event stream and git smart HTTP / LFS.
        location /api/ {
            proxy_pass http://127.0.0.1:3001;
        }
        location ~ ^/(assets|avatars|repo-avatars)/ {
            proxy_pass http://127.0.0.1:3001;
        }
        location = /user/events {
            proxy_pass http://127.0.0.1:3001;
        }
        location ~ ^/[^/]+/[^/]+/(info/refs|git-upload-pack|git-receive-pack|info/lfs/|objects/|HEAD$) {
            proxy_pass http://127.0.0.1:3001;
        }

        # Everything else (repository pages): rate limited.
        location / {
            limit_req zone=gitea_web burst=40 nodelay;
            proxy_pass http://127.0.0.1:3001;
        }
    }
}
