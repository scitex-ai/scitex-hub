;; PgBouncer configuration for SciTeX Hub
;; Documentation: https://www.pgbouncer.org/config.html

[databases]
;; Main application database - connects to PostgreSQL
;; Format: dbname = host=... port=... dbname=...
scitex_hub = host=postgres port=5432 dbname=scitex_hub
scitex_hub_dev = host=postgres port=5432 dbname=scitex_hub_dev
scitex_hub_staging = host=postgres port=5432 dbname=scitex_hub_staging
scitex_hub_nas = host=postgres port=5432 dbname=scitex_hub_nas
scitex_hub_prod = host=postgres port=5432 dbname=scitex_hub_prod

;; Umami analytics database
umami = host=postgres port=5432 dbname=umami

;; Wildcard for any database (fallback)
* = host=postgres port=5432

[pgbouncer]
;; Connection settings
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool mode:
;; - session: connection assigned for entire session (like no pooling)
;; - transaction: connection returned after each transaction (best for Django)
;; - statement: connection returned after each statement (not for Django)
pool_mode = transaction

;; Pool size settings
;; max_client_conn: Total client connections allowed
;; default_pool_size: Connections per user/database pair
;; min_pool_size: Minimum connections to keep open
;; reserve_pool_size: Extra connections for spikes
max_client_conn = 400
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 10

;; Timeout settings (in seconds)
;; server_idle_timeout: Close unused server connections after this time
;; client_idle_timeout: Disconnect idle clients (0 = disabled)
;; query_timeout: Cancel queries taking longer than this (0 = disabled)
;; server_connect_timeout: Time to wait for connection to PostgreSQL
server_idle_timeout = 60
client_idle_timeout = 0
query_timeout = 0
server_connect_timeout = 15

;; Connection lifetime
;; server_lifetime: Close server connections after this time (0 = unlimited)
;; server_check_delay: Time between server health checks
server_lifetime = 3600
server_check_delay = 30

;; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

;; Admin access
admin_users = scitex,scitex_dev,scitex_staging,scitex_nas,scitex_prod
stats_users = scitex,scitex_dev,scitex_staging,scitex_nas,scitex_prod

;; Ignore the one startup parameter Django sends that we genuinely do not care
;; about. NOT `options` — see below.
ignore_startup_parameters = extra_float_digits

;; APPLY -csearch_path RATHER THAN DISCARDING IT.
;;
;; `options` used to sit in the line above, and that is not a milder form of
;; this setting — it made pgbouncer ACCEPT a client's `options=-c...` and throw
;; the whole thing away. Silently: no error, no warning, no log line. A client
;; connecting with `options=-csearch_path=my_schema` believed it was scoped to
;; its own schema and was on the default one.
;;
;; It was not a decision anyone made. The comment above the old line read
;; "Ignore startup parameters that Django might send" — the intent was Django's
;; extra_float_digits chatter, and `options` was swept into the same list. A
;; broad silence written to quieten a narrow noise.
;;
;; MEASURED, 2026-09-05: scitex-agent-container copied this template into the
;; fleet cards pooler (scitex-primary:55432) that morning, where it DID have a
;; consumer — scitex_cards scopes each tenant with -csearch_path — so every
;; tenant silently read the shared board instead of its own schema. Their probe:
;;     options=-csearch_path=cards_probe_nonexistent  ->  SHOW search_path
;;                                                        = '"$user", public'
;; and the same DSN straight to Postgres (bypassing the pooler) answered
;; 'cards_probe_nonexistent'. Same client, same role, same server; only the
;; pooler differed. Card: cards-pgbouncer-drops-the-options-search-path-startup-
;; parameter-so-per-schema-dsns-silently-land-on-public-20260905.
;;
;; HUB HAD NO SUCH CONSUMER — no hub client sends a DSN `options`, and hub's
;; code contains no Postgres search_path at all — so nothing of ours was being
;; dropped. This file is fixed because it is the TEMPLATE the broken one was
;; copied from, not because hub was bitten.
;;
;; With `options` out of the ignore list, pgbouncer >= 1.22 parses it and
;; applies the -c settings named here; search_path is GUC_REPORT from
;; PostgreSQL 14, so 1.25.1 (our image: edoburu/pgbouncer:v1.25.1-p0) can track
;; it. Any -c setting NOT named here is now REFUSED with "unsupported startup
;; parameter in options" — loud, which is the whole point. If a future client
;; needs another -c setting, ADD IT HERE; do not put `options` back.
;;
;; RESTART-ONLY. A SIGHUP APPLIES HALF OF THIS AND BREAKS THE POOLER.
;;
;; `track_extra_parameters` is read ONCE, at startup: pgbouncer builds its
;; tracked-variable table when the process starts and a reload does not rebuild
;; it. `ignore_startup_parameters` IS re-read on reload. So a SIGHUP against a
;; changed file lands in the worst of both states — `options` is no longer
;; discarded, but search_path is still untracked, so every client sending
;; `options=-csearch_path=...` is REFUSED:
;;
;;     FATAL: unsupported startup parameter in options: search_path
;;
;; A pooler that was silently wrong becomes loudly broken, and the file on disk
;; looks correct while you debug it.
;;
;; SO: change this file, then RECREATE OR RESTART the container. Never
;; `pgbouncer -R` / `kill -HUP` / `docker kill -s HUP`. hub gets this right by
;; construction — our compose starts a fresh container and we have no reload
;; path — but the warning is here because THIS FILE IS COPIED (see above), and
;; the copy may live somewhere a reload is the normal way to apply config.
;;
;; MEASURED, 2026-09-05, scitex-agent-container, throwaway pgbouncer on port
;; 55440, same image, same userlist, same auth_query — three arms:
;;   A  cold start, OLD ini              -> `options` silently dropped
;;   B  same container, NEW ini + SIGHUP -> FATAL unsupported startup parameter
;;                                          (reproduced a live misfire on the
;;                                          fleet cards pooler 20 minutes earlier)
;;   C  cold start, NEW ini              -> options=-csearch_path=probe_sac_x
;;                                          -> SHOW search_path = 'probe_sac_x';
;;                                          -cwork_mem refused by name;
;;                                          no options -> '"$user", public'
;; Arm C also confirmed per-client tracking survives POOLING: a second scoped
;; client got its own schema while a concurrent plain client still saw the
;; default. That is the property that matters in transaction mode, where server
;; connections are shared.
track_extra_parameters = search_path
