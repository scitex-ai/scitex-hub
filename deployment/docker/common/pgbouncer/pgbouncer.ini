;; PgBouncer configuration for SciTeX Cloud
;; Documentation: https://www.pgbouncer.org/config.html

[databases]
;; Main application database - connects to PostgreSQL
;; Format: dbname = host=... port=... dbname=...
scitex_hub = host=postgres port=5432 dbname=scitex_hub
scitex_hub_dev = host=postgres port=5432 dbname=scitex_hub_dev
scitex_hub_staging = host=postgres port=5432 dbname=scitex_hub_staging
scitex_hub_nas = host=postgres port=5432 dbname=scitex_hub_nas
scitex_hub_prod = host=postgres port=5432 dbname=scitex_hub_prod

;; Umami analytics database
umami = host=postgres port=5432 dbname=umami

;; Wildcard for any database (fallback)
* = host=postgres port=5432

[pgbouncer]
;; Connection settings
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool mode:
;; - session: connection assigned for entire session (like no pooling)
;; - transaction: connection returned after each transaction (best for Django)
;; - statement: connection returned after each statement (not for Django)
pool_mode = transaction

;; Pool size settings
;; max_client_conn: Total client connections allowed
;; default_pool_size: Connections per user/database pair
;; min_pool_size: Minimum connections to keep open
;; reserve_pool_size: Extra connections for spikes
max_client_conn = 400
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 10

;; Timeout settings (in seconds)
;; server_idle_timeout: Close unused server connections after this time
;; client_idle_timeout: Disconnect idle clients (0 = disabled)
;; query_timeout: Cancel queries taking longer than this (0 = disabled)
;; server_connect_timeout: Time to wait for connection to PostgreSQL
server_idle_timeout = 60
client_idle_timeout = 0
query_timeout = 0
server_connect_timeout = 15

;; Connection lifetime
;; server_lifetime: Close server connections after this time (0 = unlimited)
;; server_check_delay: Time between server health checks
server_lifetime = 3600
server_check_delay = 30

;; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

;; Admin access
admin_users = scitex,scitex_dev,scitex_staging,scitex_nas,scitex_prod
stats_users = scitex,scitex_dev,scitex_staging,scitex_nas,scitex_prod

;; Ignore startup parameters that Django might send
ignore_startup_parameters = extra_float_digits,options
