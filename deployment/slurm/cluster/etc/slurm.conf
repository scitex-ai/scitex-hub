# /etc/slurm/slurm.conf -- SciTeX cluster (configless: workers fetch this from scitex-compute-01)
# Managed by hand; runbook: /etc/scitex/slurm-README.md
ClusterName=scitex
SlurmctldHost=scitex-compute-01(192.168.11.171)
SlurmctldParameters=enable_configless
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
CredType=cred/munge
StateSaveLocation=/var/lib/slurm/slurmctld
SlurmdSpoolDir=/var/lib/slurm/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
MpiDefault=none
ReturnToService=2

# Process tracking / containment (cgroup v2)
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup

# Scheduling
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
GresTypes=gpu

# Accounting: slurmdbd on compute-01 (MariaDB slurm_acct_db). Every node, incl. compute-01, is billed.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=192.168.11.171
AccountingStoragePort=6819
AccountingStorageTRES=gres/gpu
JobAcctGatherFrequency=30
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/jobcomp.log

# Nodes (from `slurmd -C`; RealMemory rounded down ~2% so a node is not drained for Low RealMemory)
# compute-01 is also the login node: CoreSpecCount=2 (4 threads) + MemSpecLimit=8192 MB are reserved for interactive use. Weight=100 (vs 10) makes the scheduler fill 02-04 first.
NodeName=scitex-compute-01 NodeAddr=192.168.11.171 CPUs=12 Boards=1 SocketsPerBoard=1 CoresPerSocket=6 ThreadsPerCore=2 RealMemory=31000 CoreSpecCount=2 MemSpecLimit=8192 Weight=100 State=UNKNOWN
NodeName=scitex-compute-02 NodeAddr=192.168.11.172 CPUs=32 Boards=1 SocketsPerBoard=1 CoresPerSocket=16 ThreadsPerCore=2 RealMemory=39000 Weight=10 State=UNKNOWN
NodeName=scitex-compute-03 NodeAddr=192.168.11.173 CPUs=32 Boards=1 SocketsPerBoard=1 CoresPerSocket=16 ThreadsPerCore=2 RealMemory=63000 Gres=gpu:gtx1070:1 Weight=10 State=UNKNOWN
NodeName=scitex-compute-04 NodeAddr=192.168.11.174 CPUs=32 Boards=1 SocketsPerBoard=1 CoresPerSocket=16 ThreadsPerCore=2 RealMemory=94000 Gres=gpu:gtx1070:1 Weight=10 State=UNKNOWN

PartitionName=compute Nodes=scitex-compute-[01-04] Default=YES MaxTime=INFINITE State=UP DefMemPerCPU=2048

# Metering (2026-11-27): store --comment in the DB and track --wckey, so a job carries its project.
AccountingStoreFlags=job_comment
TrackWCKey=yes
