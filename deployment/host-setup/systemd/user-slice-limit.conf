# File: deployment/host-setup/systemd/user-slice-limit.conf
# ============================================
# Systemd slice override: cap ALL user processes to 90% CPU/memory
# ============================================
# This guarantees sshd, systemd, and system services always have
# at least 10% of resources — so SSH and kill always work,
# regardless of what user processes are doing.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/user-.slice.d/
#   sudo cp -f deployment/host-setup/systemd/user-slice-limit.conf \
#        /etc/systemd/system/user-.slice.d/limit.conf
#   sudo systemctl daemon-reload
#
# Verify:
#   systemctl show user-.slice | grep -E 'CPU|Memory'

[Slice]
CPUQuota=99%
MemoryMax=99%
