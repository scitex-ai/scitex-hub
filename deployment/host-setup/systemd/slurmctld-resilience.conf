# systemd drop-in: /etc/systemd/system/slurmctld.service.d/10-scitex-resilience.conf
#
# INCIDENT 2026-07-13 — a single boot race killed the visitor pool for 24+ hours.
#
# slurmctld binds its listening socket on SlurmctldHost (DXP480TPLUS-994). If it
# starts before that name resolves, it does not retry — it dies:
#
#   error: _xgetaddrinfo: getaddrinfo((null):6817) failed: Name or service not known
#   error: slurm_set_addr: Unable to resolve "(null)"
#   fatal: slurm_init_msg_engine_port: error Address family not supported by protocol
#
# The stock unit has no Restart= policy, so that one fatal left slurmctld `failed`
# and it stayed dead. Nothing restarted it. And the visitor-slot re-clean cannot
# verify a container teardown without a SLURM controller (container_teardown.py),
# so every slot quarantined and EVERY visitor on scitex.ai silently got a
# read-only workspace until a human noticed.
#
# Two changes, both about surviving a transient boot condition:
#   1. Order after the network and name resolution are actually up.
#   2. Restart on failure, so a lost race costs seconds, not a day.
#
# Install: sudo ./install-slurmctld-resilience.sh

[Unit]
Wants=network-online.target
After=network-online.target nss-lookup.target

[Service]
Restart=on-failure
RestartSec=10s
