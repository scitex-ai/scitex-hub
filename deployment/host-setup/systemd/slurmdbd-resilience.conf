# systemd drop-in: /etc/systemd/system/slurmdbd.service.d/10-scitex-resilience.conf
#
# INCIDENT 2026-10-02 (scitex-compute-01): slurmdbd started before the LAN address
# resolved, logged
#   fatal: slurm_init_msg_engine_port error Address family not supported by protocol
# and stayed `failed` for 8 weeks: the stock unit has no Restart= policy. With it
# down, sacct recorded 0 jobs, so nothing on the cluster could be metered.
#
# 1. Order after the network, name resolution and the local MariaDB.
# 2. Restart on failure, forever: a lost boot race costs seconds, not weeks.

[Unit]
Wants=network-online.target mariadb.service
After=network-online.target nss-lookup.target mariadb.service
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10s
