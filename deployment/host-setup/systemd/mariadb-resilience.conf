# systemd drop-in: /etc/systemd/system/mariadb.service.d/10-scitex-resilience.conf
#
# MariaDB holds slurm_acct_db (SLURM accounting) on the controller. INCIDENT
# 2026-10-23 (scitex-compute-01): mariadbd exited with an error code and stayed
# `failed` for 5 weeks. The vendor unit only restarts `on-abnormal` (signals,
# timeouts), never on a non-zero exit.

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10s
