# systemd drop-in: /etc/systemd/system/slurmd.service.d/10-scitex-resilience.conf
#
# INCIDENT 2026-10 (scitex-compute-02/03): configless workers fetch slurm.conf from
# the controller at start (`--conf-server`). When a worker booted while the
# controller was down, slurmd exited 1 and stayed `failed` — the stock unit has no
# Restart= policy — so the node never rejoined even after the controller came back.
#
# INCIDENT 2026-10-03 (scitex-compute-02): after a root-disk migration
# /var/lib/slurm and /var/log/slurm were gone, and slurmd died on
#   fatal: mkdir(/var/lib/slurm/slurmd): No such file or directory
#
# 1. Order after the network, name resolution and munge.
# 2. Recreate the spool and log directories on every start. `mkdir -p` never
#    changes an existing directory, so the controller's slurm-owned
#    /var/lib/slurm and /var/log/slurm are left alone (LogsDirectory= would chown
#    them to root and break slurmctld/slurmdbd logging).
# 3. Restart on failure, forever: the worker keeps retrying until the controller
#    answers.

[Unit]
Wants=network-online.target munge.service
After=network-online.target nss-lookup.target munge.service
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/bin/mkdir -p /var/lib/slurm/slurmd /var/log/slurm
Restart=on-failure
RestartSec=15s
