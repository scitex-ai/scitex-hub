# systemd drop-in: /etc/systemd/system/munge.service.d/10-scitex-resilience.conf
#
# INCIDENT 2026-10-03 (scitex-compute-02): /var/log/munge had disappeared, munged
# refused to start without its log directory, and the stock unit has no Restart=
# policy — so munge (and every SLURM daemon that authenticates through it) stayed
# down for 8 weeks.
#
# 1. Let systemd (re)create the log directory, owned by User=munge, on every
#    start instead of relying on the package's one-time postinst.
# 2. Restart on failure.

[Unit]
StartLimitIntervalSec=0

[Service]
LogsDirectory=munge
LogsDirectoryMode=0700
Restart=on-failure
RestartSec=10s
