# CodeQL workspace — lets a LOCAL, unpublished pack resolve by scope/name.
#
# Without this, `packs: scitex-hub/python-security-barriers` in
# .github/workflows/codeql-analysis.yml would be looked up in the package
# registry, where it does not exist. The workspace tells the CLI that the pack
# is a SOURCE dependency living in this repository, so it resolves from the
# filesystem instead.
#
# All glob patterns are relative to the directory containing this file, so this
# file must stay at the repository ROOT.
#
# Note the manifest name: our pack ships `codeql-pack.yml`, not the older
# `qlpack.yml` that most published examples use. The glob has to match the name
# we actually have, or the workspace provides nothing and the pack silently
# fails to resolve — the same silent-no-op that made #461 look installed for two
# weeks.
provide:
  - ".github/codeql/extensions/*/codeql-pack.yml"
