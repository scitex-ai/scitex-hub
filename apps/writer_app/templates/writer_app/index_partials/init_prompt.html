<!-- Writer Workspace Initialization Overlay -->
{% if not writer_initialized and project %}
<div id="writer-init-overlay" class="writer-init-overlay">
    <div class="writer-init-modal">
        <h2 class="writer-init-title">Initialize Manuscript</h2>
        <p class="writer-init-desc">
            Clone <a href="https://github.com/ywatanabe1989/scitex-writer" target="_blank" rel="noopener">scitex-writer</a> template into <strong>{{ project.name }}</strong>
        </p>
        <button id="init-writer-btn" class="writer-init-btn">
            Clone Template
        </button>
    </div>
</div>
{% endif %}
