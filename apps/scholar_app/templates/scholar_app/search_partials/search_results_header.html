<!-- Search Results Header - Compact -->
<div class="results-header">
    <div class="results-info">
        <span class="results-count" id="searchResultsText">{{ results|length }} result{{ results|length|pluralize }} for "{{ query }}"</span>
        {% if results %}<span class="results-source" id="sourceDisplay">· {{ sources_display|default:"selected sources" }}</span>{% endif %}
    </div>
    <div class="results-toolbar">
        <!-- Abstract Display Toggle -->
        <button type="button" class="toolbar-btn" id="abstractToggleBtn" data-mode="truncated" title="Toggle abstract display">
            Abstract: truncated
        </button>
        <!-- Save Selected -->
        <button type="button" class="toolbar-btn" id="saveSelectedBtn" title="Save selected to library">
            <i class="fas fa-save"></i> Save
        </button>
        <!-- Open URLs -->
        <button type="button" class="toolbar-btn" id="openUrlsBtn" title="Open selected in new tabs">
            <i class="fas fa-external-link-alt"></i> Open URLs
        </button>
        <!-- Export BibTeX -->
        <button type="button" class="toolbar-btn toolbar-btn--primary" id="exportSelectedBibtex" title="Download BibTeX for selected">
            <i class="fas fa-download"></i> BibTeX
        </button>
    </div>
</div>
<style>
.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--border-muted, #3a3a3a);
}
.results-info {
    font-size: 0.85rem;
    color: var(--text-secondary, #9ca3af);
}
.results-count {
    font-weight: 500;
}
.results-source {
    color: var(--text-muted, #6c8ba0);
}
.results-toolbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.toolbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.35rem 0.65rem;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-secondary, #9ca3af);
    background: var(--bg-secondary, #1a1a1a);
    border: 1px solid var(--border-color, #3a3a3a);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
}
.toolbar-btn:hover {
    color: var(--text-primary, #d4e1e8);
    border-color: var(--scitex-color-04, #6c8ba0);
    background: var(--bg-tertiary, #252525);
}
.toolbar-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.toolbar-btn--primary {
    color: var(--workspace-icon-primary, #059669);
    border-color: var(--workspace-icon-primary, #059669);
}
.toolbar-btn--primary:hover {
    background: rgba(5, 150, 105, 0.15);
    color: var(--workspace-icon-primary, #059669);
}
.toolbar-btn i {
    font-size: 0.7rem;
}
[data-theme="light"] .toolbar-btn {
    background: var(--bg-secondary, #f3f4f6);
    border-color: var(--border-color, #d0d7de);
    color: var(--text-secondary, #586069);
}
[data-theme="light"] .toolbar-btn:hover {
    background: var(--bg-tertiary, #e9ecef);
    color: var(--text-primary, #1a2a40);
}
</style>
<script>
// Abstract toggle button handler
document.getElementById('abstractToggleBtn')?.addEventListener('click', function() {
    const modes = ['truncated', 'full', 'none'];
    const currentMode = this.dataset.mode || 'truncated';
    const nextIndex = (modes.indexOf(currentMode) + 1) % modes.length;
    const nextMode = modes[nextIndex];
    this.dataset.mode = nextMode;
    this.textContent = 'Abstract: ' + (nextMode === 'none' ? 'no' : nextMode);

    // Apply to all result snippets
    document.querySelectorAll('.result-snippet').forEach(el => {
        if (nextMode === 'none') {
            el.style.display = 'none';
        } else if (nextMode === 'full') {
            el.style.display = 'block';
            el.classList.add('expanded');
            el.dataset.expanded = 'true';
        } else {
            el.style.display = 'block';
            el.classList.remove('expanded');
            el.dataset.expanded = 'false';
        }
    });
});

// Get selected papers data
function getSelectedPapers() {
    const selected = [];
    document.querySelectorAll('.result-card').forEach(card => {
        const checkbox = card.querySelector('.paper-select');
        if (checkbox && checkbox.checked) {
            const titleEl = card.querySelector('.result-title a');
            const metaEl = card.querySelector('.result-meta');
            const snippetEl = card.querySelector('.result-snippet');
            const yearEl = card.querySelector('.year-badge');

            selected.push({
                title: titleEl?.textContent?.trim() || 'Unknown',
                url: titleEl?.href || '',
                authors: metaEl?.querySelector('.authors')?.textContent?.trim() || '',
                journal: metaEl?.querySelector('.journal-badge')?.textContent?.trim() || '',
                year: yearEl?.textContent?.trim() || '',
                abstract: snippetEl?.dataset?.fullAbstract || snippetEl?.textContent?.trim() || '',
                doi: card.dataset?.doi || '',
                source: metaEl?.querySelector('.source-badge')?.textContent?.trim() || ''
            });
        }
    });
    return selected;
}

// Save Selected button
document.getElementById('saveSelectedBtn')?.addEventListener('click', function() {
    const papers = getSelectedPapers();
    if (papers.length === 0) {
        alert('No papers selected. Click on papers to select them.');
        return;
    }
    // For now, save to localStorage (future: save to user's library)
    const saved = JSON.parse(localStorage.getItem('scitex_saved_papers') || '[]');
    const newPapers = papers.filter(p => !saved.some(s => s.title === p.title));
    saved.push(...newPapers);
    localStorage.setItem('scitex_saved_papers', JSON.stringify(saved));
    alert(`Saved ${newPapers.length} paper(s) to library. (${papers.length - newPapers.length} already saved)`);
});

// Open URLs button
document.getElementById('openUrlsBtn')?.addEventListener('click', function() {
    const papers = getSelectedPapers();
    if (papers.length === 0) {
        alert('No papers selected. Click on papers to select them.');
        return;
    }
    if (papers.length > 10) {
        if (!confirm(`Open ${papers.length} URLs? This may be blocked by your browser.`)) return;
    }
    papers.forEach((paper, i) => {
        if (paper.url && paper.url !== '#') {
            setTimeout(() => window.open(paper.url, '_blank'), i * 100);
        }
    });
});

// BibTeX export button
document.getElementById('exportSelectedBibtex')?.addEventListener('click', function() {
    const papers = getSelectedPapers();
    if (papers.length === 0) {
        alert('No papers selected. Click on papers to select them.');
        return;
    }

    // Generate BibTeX entries
    const bibtexEntries = papers.map((paper, index) => {
        const key = generateBibtexKey(paper);
        const authors = paper.authors || 'Unknown';
        const title = paper.title || 'Unknown';
        const journal = paper.journal?.replace(/\s*\(IF.*\)/, '') || '';
        const year = paper.year || '';
        const doi = paper.doi || '';
        const abstract = paper.abstract || '';

        let entry = `@article{${key},\n`;
        entry += `  author = {${authors}},\n`;
        entry += `  title = {${title}},\n`;
        if (journal) entry += `  journal = {${journal}},\n`;
        if (year) entry += `  year = {${year}},\n`;
        if (doi) entry += `  doi = {${doi}},\n`;
        if (abstract) entry += `  abstract = {${abstract.substring(0, 500)}${abstract.length > 500 ? '...' : ''}},\n`;
        entry += `}`;
        return entry;
    });

    const bibtexContent = bibtexEntries.join('\n\n');

    // Download as file
    const blob = new Blob([bibtexContent], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `scitex_export_${new Date().toISOString().slice(0,10)}.bib`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
});

function generateBibtexKey(paper) {
    const firstAuthor = (paper.authors || 'unknown').split(',')[0].split(' ').pop() || 'unknown';
    const year = paper.year || 'XXXX';
    const titleWord = (paper.title || 'untitled').split(' ')[0].toLowerCase().replace(/[^a-z]/g, '');
    return `${firstAuthor.toLowerCase()}${year}${titleWord}`;
}

// Update button states based on selection
function updateToolbarState() {
    const selectedCount = document.querySelectorAll('.result-card .paper-select:checked').length;
    const buttons = ['saveSelectedBtn', 'openUrlsBtn', 'exportSelectedBibtex'];
    buttons.forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.disabled = selectedCount === 0;
    });
}

// Listen for selection changes
document.addEventListener('change', function(e) {
    if (e.target.classList.contains('paper-select')) {
        updateToolbarState();
    }
});

// Initial state
document.addEventListener('DOMContentLoaded', updateToolbarState);
</script>
