<!-- Search Results Header - Compact -->
<div class="results-header">
    <div class="results-info">
        <span class="results-count" id="searchResultsText">{{ results|length }} result{{ results|length|pluralize }} for "{{ query }}"</span>
        {% if results %}<span class="results-source" id="sourceDisplay">· {{ sources_display|default:"selected sources" }}</span>{% endif %}
    </div>
    <div class="results-toolbar">
        <!-- Abstract Display Dropdown -->
        <select class="form-select form-select-sm results-select" id="abstractModeSelect" title="Abstract display">
            <option value="none">Abstract: no</option>
            <option value="truncated" selected>Abstract: truncated</option>
            <option value="all">Abstract: full</option>
        </select>
        <!-- Export Button -->
        <button type="button" class="btn btn-sm btn-outline-success" id="exportSelectedBibtex" title="Export as BibTeX">
            <i class="fas fa-download"></i> BibTeX
        </button>
    </div>
</div>
<style>
.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid var(--border-muted);
}
.results-info {
    font-size: 0.85rem;
    color: var(--text-secondary);
}
.results-count {
    font-weight: 500;
}
.results-source {
    color: var(--text-muted);
}
.results-toolbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.results-select {
    width: auto;
    font-size: 0.8rem;
    padding: 0.25rem 0.5rem;
    height: auto;
}
</style>
<script>
// Abstract mode dropdown handler
document.getElementById('abstractModeSelect')?.addEventListener('change', function() {
    const mode = this.value;
    document.querySelectorAll('.result-abstract').forEach(el => {
        if (mode === 'none') {
            el.style.display = 'none';
        } else if (mode === 'all') {
            el.style.display = 'block';
            el.style.webkitLineClamp = 'unset';
        } else {
            el.style.display = 'block';
            el.style.webkitLineClamp = '2';
        }
    });
});
// Select all by default on page load
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.paper-select-checkbox').forEach(cb => cb.checked = true);
    updateSelectedCount();
});
function updateSelectedCount() {
    const total = document.querySelectorAll('.paper-select-checkbox').length;
    const selected = document.querySelectorAll('.paper-select-checkbox:checked').length;
    const countEl = document.getElementById('selectedCount');
    if (countEl) countEl.textContent = selected + ' of ' + total + ' selected';
    const exportBtn = document.getElementById('exportSelectedBibtex');
    if (exportBtn) exportBtn.disabled = selected === 0;
}
</script>
