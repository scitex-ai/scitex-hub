{% load static %}

<!-- Stats Bar -->
<div class="library-stats-bar" id="library-stats-bar">
    <div class="library-stat-item" data-status="to_read">
        <div class="library-stat-icon">
            <i class="fas fa-bookmark"></i>
        </div>
        <div class="library-stat-content">
            <div class="library-stat-label">To Read</div>
            <div class="library-stat-count" id="stat-to-read">0</div>
        </div>
    </div>
    <div class="library-stat-item" data-status="reading">
        <div class="library-stat-icon">
            <i class="fas fa-book-open"></i>
        </div>
        <div class="library-stat-content">
            <div class="library-stat-label">Reading</div>
            <div class="library-stat-count" id="stat-reading">0</div>
        </div>
    </div>
    <div class="library-stat-item" data-status="read">
        <div class="library-stat-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="library-stat-content">
            <div class="library-stat-label">Read</div>
            <div class="library-stat-count" id="stat-read">0</div>
        </div>
    </div>
    <div class="library-stat-item" data-status="referenced">
        <div class="library-stat-icon">
            <i class="fas fa-quote-right"></i>
        </div>
        <div class="library-stat-content">
            <div class="library-stat-label">Referenced</div>
            <div class="library-stat-count" id="stat-referenced">0</div>
        </div>
    </div>
    <div class="library-stat-item" data-status="favorite">
        <div class="library-stat-icon">
            <i class="fas fa-star"></i>
        </div>
        <div class="library-stat-content">
            <div class="library-stat-label">Favorite</div>
            <div class="library-stat-count" id="stat-favorite">0</div>
        </div>
    </div>
</div>
<!-- Action Bar -->
<div class="library-action-bar">
    <div class="library-actions-left">
        <button class="library-action-btn" id="library-import-btn">
            <i class="fas fa-file-upload"></i>
            <span>Import BibTeX</span>
        </button>
        <input type="file" id="bibtex-file-input" accept=".bib" hidden />
        <button class="library-action-btn" id="library-export-all-btn">
            <i class="fas fa-file-download"></i>
            <span>Export BibTeX</span>
        </button>
        <button class="library-action-btn" id="export-ris-button">
            <i class="fas fa-file-export"></i>
            <span>Export RIS</span>
        </button>
        <!-- Zotero import button — shown only when local Zotero DB is detected -->
        <button class="library-action-btn hidden" id="zotero-import-btn" title="">
            <i class="fas fa-z"></i>
            <span>Import from Zotero</span>
        </button>
    </div>
    <div class="library-actions-right">
        <button class="library-action-btn" id="library-refresh-btn">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>
</div>
<!-- Zotero Import Modal -->
<div id="zotero-import-modal" class="library-modal hidden">
    <div class="library-modal-content">
        <div class="library-modal-header">
            <h3>
                <i class="fas fa-database"></i> Import from Zotero
            </h3>
            <button class="library-modal-close" id="zotero-modal-close">&times;</button>
        </div>
        <div class="library-modal-body">
            <p class="zotero-db-info">
                Zotero database: <code id="zotero-db-path"></code>
            </p>
            <div class="zotero-import-options">
                <label class="zotero-option">
                    <input type="radio" name="zotero-mode" value="all" checked />
                    All papers
                </label>
                <label class="zotero-option">
                    <input type="radio" name="zotero-mode" value="collection" />
                    By collection
                    <select id="zotero-collection-select" class="zotero-select" disabled>
                        <option value="">Loading...</option>
                    </select>
                </label>
                <label class="zotero-option">
                    <input type="radio" name="zotero-mode" value="tags" />
                    By tags
                    <select id="zotero-tags-select" class="zotero-select" multiple disabled></select>
                </label>
            </div>
        </div>
        <div class="library-modal-footer">
            <button class="library-action-btn" id="zotero-import-confirm">
                <i class="fas fa-file-import"></i> Import
            </button>
            <button class="library-action-btn" id="zotero-modal-cancel">Cancel</button>
        </div>
    </div>
</div>
<script>
(function () {
    // Check Zotero availability on load
    fetch('/scholar/api/library/zotero/status/')
        .then(r => r.json())
        .then(data => {
            if (!data.available) return;
            const btn = document.getElementById('zotero-import-btn');
            btn.classList.remove('hidden');
            btn.title = 'Zotero DB: ' + data.db_path;
            document.getElementById('zotero-db-path').textContent = data.db_path;

            // Load collections and tags
            fetch('/scholar/api/library/zotero/collections/')
                .then(r => r.json())
                .then(d => {
                    const sel = document.getElementById('zotero-collection-select');
                    sel.innerHTML = (d.collections || [])
                        .map(c => `<option value="${c}">${c}</option>`).join('');
                });
            fetch('/scholar/api/library/zotero/tags/')
                .then(r => r.json())
                .then(d => {
                    const sel = document.getElementById('zotero-tags-select');
                    sel.innerHTML = (d.tags || [])
                        .map(t => `<option value="${t.name}">${t.name} (${t.count})</option>`).join('');
                });
        })
        .catch(() => {});

    // Open modal
    document.getElementById('zotero-import-btn').addEventListener('click', () => {
        document.getElementById('zotero-import-modal').classList.remove('hidden');
    });

    // Close modal
    ['zotero-modal-close', 'zotero-modal-cancel'].forEach(id => {
        document.getElementById(id).addEventListener('click', () => {
            document.getElementById('zotero-import-modal').classList.add('hidden');
        });
    });

    // Enable/disable selects based on mode
    document.querySelectorAll('input[name="zotero-mode"]').forEach(radio => {
        radio.addEventListener('change', () => {
            document.getElementById('zotero-collection-select').disabled = radio.value !== 'collection';
            document.getElementById('zotero-tags-select').disabled = radio.value !== 'tags';
        });
    });

    // Import
    document.getElementById('zotero-import-confirm').addEventListener('click', () => {
        const mode = document.querySelector('input[name="zotero-mode"]:checked').value;
        const body = { mode };
        if (mode === 'collection') {
            body.collection = document.getElementById('zotero-collection-select').value;
        } else if (mode === 'tags') {
            body.tags = Array.from(document.getElementById('zotero-tags-select').selectedOptions)
                .map(o => o.value);
        }

        const btn = document.getElementById('zotero-import-confirm');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Importing...';

        fetch('/scholar/api/library/zotero/import/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''
            },
            body: JSON.stringify(body)
        })
        .then(r => r.json())
        .then(data => {
            document.getElementById('zotero-import-modal').classList.add('hidden');
            const msg = data.error
                ? `Zotero import failed: ${data.error}`
                : `Imported ${data.imported} papers from Zotero (${data.skipped} skipped / already in library)`;
            alert(msg);
            if (!data.error && data.imported > 0) {
                document.getElementById('library-refresh-btn').click();
            }
        })
        .catch(err => alert('Import error: ' + err))
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-file-import"></i> Import';
        });
    });
})();
</script>
<!-- Collection Filter -->
<div class="library-collection-filter" id="library-collection-filter">
    <button class="library-collection-pill active" data-collection="all">All</button>
    <!-- Additional collections loaded via JS -->
</div>
<!-- Search/Filter Bar -->
<div class="library-search-bar">
    <div class="library-search-input-wrapper">
        <i class="fas fa-search library-search-icon"></i>
        <input type="text"
               class="library-search-input"
               id="library-search-input"
               placeholder="Search papers by title or author..." />
        <button class="library-search-clear" id="library-search-clear" hidden>
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="library-filter-controls">
        <select class="library-filter-select" id="library-sort-select">
            <option value="date_added_desc">Date Added (Newest)</option>
            <option value="date_added_asc">Date Added (Oldest)</option>
            <option value="importance_desc">Importance (High to Low)</option>
            <option value="importance_asc">Importance (Low to High)</option>
            <option value="year_desc">Publication Year (Newest)</option>
            <option value="year_asc">Publication Year (Oldest)</option>
            <option value="title_asc">Title (A-Z)</option>
            <option value="title_desc">Title (Z-A)</option>
        </select>
    </div>
</div>
<!-- Paper List -->
<div class="library-papers-container">
    <div class="library-papers-list" id="library-papers-list">
        <!-- Loading spinner -->
        <div class="library-loading" id="library-loading">
            <i class="fas fa-spinner fa-spin"></i>
            <div class="library-loading-text">Loading papers...</div>
        </div>
        <!-- Empty state -->
        <div class="library-empty-state" id="library-empty-state" hidden>
            <i class="fas fa-books"></i>
            <div class="library-empty-title">No papers in your library</div>
            <div class="library-empty-description">Import a BibTeX file or add papers from the Search tab to get started.</div>
        </div>
        <!-- Paper cards loaded via JS -->
    </div>
</div>
<!-- Paper Card Template (for JS cloning) -->
<template id="library-paper-card-template">
    <div class="library-paper-card" data-paper-id="">
        <div class="library-paper-header">
            <div class="library-paper-title-row">
                <h6 class="library-paper-title"></h6>
                <div class="library-paper-status-badge"></div>
            </div>
            <div class="library-paper-importance">
                <i class="far fa-star library-star" data-rating="1"></i>
                <i class="far fa-star library-star" data-rating="2"></i>
                <i class="far fa-star library-star" data-rating="3"></i>
                <i class="far fa-star library-star" data-rating="4"></i>
                <i class="far fa-star library-star" data-rating="5"></i>
            </div>
        </div>
        <div class="library-paper-meta">
            <div class="library-paper-authors"></div>
            <div class="library-paper-publication"></div>
        </div>
        <div class="library-paper-tags"></div>
        <div class="library-paper-actions">
            <button class="library-paper-action-btn" data-action="view-pdf" title="View PDF">
                <i class="fas fa-file-pdf"></i>
            </button>
            <button class="library-paper-action-btn" data-action="edit" title="Edit details">
                <i class="fas fa-edit"></i>
            </button>
            <button class="library-paper-action-btn"
                    data-action="remove"
                    title="Remove from library">
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>
    </div>
</template>
