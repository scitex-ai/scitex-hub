{% comment %}
Hub "Me" tab — User account overview and quick links.
Returned by /hub/api/me/ for inline navigation.
{% endcomment %}
<div class="hub-content">
    <div class="hub-header mb-4">
        <h1>{{ request.user.username }}</h1>
        <p class="text-muted">{{ request.user.email }}</p>
    </div>
    <div class="hub-section mb-4">
        <div class="hub-account-card">
            <div class="hub-account-card-header">
                <h3>
                    <i class="fas fa-cog"></i> Account
                </h3>
            </div>
            <div class="hub-account-links">
                <a href="{% url 'accounts_app:profile_edit' %}"><i class="fas fa-user"></i> Profile</a>
                <a href="{% url 'accounts_app:ssh_keys' %}"><i class="fas fa-key"></i> SSH Keys</a>
                <a href="{% url 'accounts_app:remote_credentials' %}"><i class="fas fa-server"></i> Remote Credentials</a>
                <a href="{% url 'accounts_app:api_keys' %}"><i class="fas fa-lock"></i> API Keys</a>
                <a href="{% url 'accounts_app:appearance' %}"><i class="fas fa-palette"></i> Appearance</a>
                <a href="{% url 'accounts_app:git_integrations' %}"><i class="fab fa-git-alt"></i> Integrations</a>
            </div>
        </div>
    </div>
</div>
