<svg xmlns="http://www.w3.org/2000/svg" width="2126" height="2835">
  <!-- Light mode background - warm white matching --workspace-bg-elevated -->
  <rect width="2126" height="2835" fill="#fdfcfa"/>
  <defs>
    <!-- 1mm minor grid pattern (300 DPI: 300/25.4 = 11.811023622047244) -->
    <!-- Use solid hex colors (not rgba) for reliable rasterization by Fabric.js -->
    <pattern id="minor-grid" width="11.811023622047244" height="11.811023622047244" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="11.811023622047244" stroke="#ccc8c4" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="11.811023622047244" y2="0" stroke="#ccc8c4" stroke-width="0.5"/>
    </pattern>

    <!-- 10mm major grid pattern (300 DPI: 10 * 300/25.4 = 118.11023622047244) -->
    <pattern id="major-grid" width="118.11023622047244" height="118.11023622047244" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="118.11023622047244" stroke="#aaa6a2" stroke-width="1"/>
      <line x1="0" y1="0" x2="118.11023622047244" y2="0" stroke="#aaa6a2" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Apply patterns -->
  <rect width="2126" height="2835" fill="url(#minor-grid)"/>
  <rect width="2126" height="2835" fill="url(#major-grid)"/>

  <!-- Column guide lines at 45mm, 90mm, 135mm, 180mm (0.5, 1.0, 1.5, 2.0 columns) -->
  <!-- Subtle but visible dashed lines for journal column widths -->
  <line x1="531.4960629921259" y1="0" x2="531.4960629921259" y2="2835" stroke="#4488aa" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="1062.992125984252" y1="0" x2="1062.992125984252" y2="2835" stroke="#4488aa" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="1594.4881889763779" y1="0" x2="1594.4881889763779" y2="2835" stroke="#4488aa" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="2125.984251968504" y1="0" x2="2125.984251968504" y2="2835" stroke="#4488aa" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
</svg>
