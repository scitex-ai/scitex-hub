{% load static vite %}
<!-- Project Data (for TypeScript modules - auto-read by file-tree.ts) -->
<div id="project-data"
     style="display: none"
     data-project-owner="{{ project.owner.username }}"
     data-project-slug="{{ project.slug }}"
     data-breadcrumb-path="{{ breadcrumb_path|default:'' }}"></div>
<!-- Load shared file-tree module via Vite (auto-initializes from project-data) -->
{% vite_script 'project_app/shared/file-tree' %}
<!-- Load browse toolbar functionality via Vite -->
{% vite_script 'project_app/repository/browse_toolbar' %}
