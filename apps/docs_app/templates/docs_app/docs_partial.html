{% load static vite %}

<!-- Docs workspace CSS -->
<link rel="stylesheet" href="{% static 'docs_app/css/docs-workspace.css' %}" />
<link rel="stylesheet" href="{% static 'shared/css/components/minimal-hero.css' %}" />
<link rel="stylesheet" href="{% static 'public_app/css/api-docs.css' %}" />
<div class="docs-workspace" data-mode="docs" data-active-doc="{{ active_doc }}">
    <!-- Sidebar: doc page navigation -->
    <aside class="docs-sidebar">
        <nav class="docs-nav">
            {% for page in docs_pages %}
                <a href="#"
                   class="docs-nav-item{% if page.slug == active_doc %} active{% endif %}"
                   data-slug="{{ page.slug }}">
                    <i class="{{ page.icon }}"></i>
                    <span>{{ page.label }}</span>
                    <span class="docs-badges">
                        {% for badge in page.badges %}<span class="docs-badge docs-badge--{{ badge }}">{{ badge }}</span>{% endfor %}
                    </span>
                </a>
            {% endfor %}
            <div class="docs-nav-footer">
                <a href="/docs/export/all/"
                   class="docs-export-btn"
                   title="Download all docs as Markdown">
                    <i class="fas fa-file-alt"></i> All .md
                </a>
                <button class="docs-export-btn" id="docs-export-all-pdf" title="Print all docs as PDF">
                    <i class="fas fa-file-pdf"></i> All .pdf
                </button>
            </div>
        </nav>
    </aside>
    <!-- Content area: loaded via AJAX -->
    <div class="docs-content" id="docs-content-area">
        <div class="docs-loading">
            <i class="fas fa-spinner fa-spin"></i> Loading documentation...
        </div>
    </div>
</div>
{% vite_script 'docs_app/docs-workspace' %}
