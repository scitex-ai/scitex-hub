{% load static %}

<!-- Docs workspace CSS -->
<link rel="stylesheet" href="{% static 'docs_app/css/docs-workspace.css' %}" />
<link rel="stylesheet" href="{% static 'shared/css/components/minimal-hero.css' %}" />
<link rel="stylesheet" href="{% static 'public_app/css/api-docs.css' %}" />
<div class="docs-workspace" data-mode="docs">
    <!-- Sidebar: doc page navigation -->
    <aside class="docs-sidebar">
        <nav class="docs-nav">
            <div class="docs-nav-header">Documentation</div>
            {% for page in docs_pages %}
                <a href="#"
                   class="docs-nav-item{% if page.slug == active_doc %} active{% endif %}"
                   data-slug="{{ page.slug }}">
                    <i class="{{ page.icon }}"></i>
                    <span>{{ page.label }}</span>
                    <span class="docs-badges">
                        {% for badge in page.badges %}<span class="docs-badge docs-badge--{{ badge }}">{{ badge }}</span>{% endfor %}
                    </span>
                </a>
            {% endfor %}
            <!-- Export buttons -->
            <div class="docs-nav-footer">
                <a href="{% url 'docs_app:download' fmt='md' %}"
                   class="docs-export-btn"
                   title="Download as Markdown">
                    <i class="fas fa-file-alt"></i> Markdown
                </a>
                <a href="{% url 'docs_app:download' fmt='pdf' %}"
                   class="docs-export-btn"
                   title="Download as PDF">
                    <i class="fas fa-file-pdf"></i> PDF
                </a>
            </div>
        </nav>
    </aside>
    <!-- Content area: loaded via AJAX -->
    <div class="docs-content" id="docs-content-area">
        <div class="docs-loading">
            <i class="fas fa-spinner fa-spin"></i> Loading documentation...
        </div>
    </div>
</div>
<script>
(function() {
    const sidebar = document.querySelector('.docs-sidebar');
    const contentArea = document.getElementById('docs-content-area');
    if (!sidebar || !contentArea) return;

    const navItems = sidebar.querySelectorAll('.docs-nav-item');
    let currentSlug = '{{ active_doc }}';

    // Convert api-sections into folded cards with toggle buttons
    function foldSections(anchorId) {
        const sections = contentArea.querySelectorAll('.api-section');
        sections.forEach(section => {
            if (section.querySelector('.api-section-toggle')) return;

            const h2 = section.querySelector('h2');
            if (!h2) return;

            // Collect all anchor IDs from preceding spans and section itself
            const anchorIds = [];
            if (section.id) anchorIds.push(section.id);
            let prev = section.previousElementSibling;
            while (prev && prev.tagName === 'SPAN' && prev.id) {
                anchorIds.push(prev.id);
                prev = prev.previousElementSibling;
            }

            // Pick the best anchor ID: first preceding span (closest to section)
            const linkAnchor = anchorIds[1] || anchorIds[0] || '';

            // Extract title text excluding .anchor-link elements
            const h2Clone = h2.cloneNode(true);
            h2Clone.querySelectorAll('.anchor-link').forEach(el => el.remove());
            const titleText = h2Clone.textContent.trim();

            const toggle = document.createElement('button');
            toggle.className = 'api-section-toggle';
            toggle.innerHTML = '<i class="fas fa-chevron-right fold-icon"></i> ' +
                '<span class="api-section-title">' + titleText + '</span>';

            // Add share link button (clip icon only)
            if (linkAnchor) {
                const linkBtn = document.createElement('a');
                linkBtn.className = 'api-section-link';
                linkBtn.href = '#' + currentSlug + '--' + linkAnchor;
                linkBtn.title = 'Copy link to this section';
                linkBtn.innerHTML = '<i class="fas fa-link"></i>';
                linkBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const url = window.location.origin + '/docs/#' + currentSlug + '--' + linkAnchor;
                    navigator.clipboard.writeText(url).then(() => {
                        linkBtn.innerHTML = '<i class="fas fa-check"></i>';
                        setTimeout(() => { linkBtn.innerHTML = '<i class="fas fa-link"></i>'; }, 1500);
                    });
                });
                toggle.appendChild(linkBtn);
            }

            const body = document.createElement('div');
            body.className = 'api-section-body';
            while (section.firstChild) {
                body.appendChild(section.firstChild);
            }
            section.appendChild(toggle);
            section.appendChild(body);

            toggle.addEventListener('click', function(e) {
                if (e.target.closest('.api-section-link')) return;
                section.classList.toggle('open');
                // Update URL hash when card is opened
                if (section.classList.contains('open') && linkAnchor) {
                    history.replaceState(null, '', '#' + currentSlug + '--' + linkAnchor);
                }
            });

            // Auto-open if anchor matches any of this section's IDs
            if (anchorId && anchorIds.includes(anchorId)) {
                section.classList.add('open');
                setTimeout(() => section.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
            }
        });
    }

    function loadDocPage(slug, anchorId) {
        if (!slug) return;
        currentSlug = slug;

        // Update URL hash to reflect current page
        const hashValue = anchorId ? slug + '--' + anchorId : slug;
        history.replaceState(null, '', '#' + hashValue);

        // Update active state in sidebar
        navItems.forEach(item => {
            item.classList.toggle('active', item.dataset.slug === slug);
        });

        // Show loading
        contentArea.style.opacity = '0.5';

        fetch('/docs/content/' + slug + '/', {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(response => {
            if (!response.ok) throw new Error('Failed to load: ' + response.status);
            return response.text();
        })
        .then(html => {
            contentArea.innerHTML = html;
            contentArea.style.opacity = '1';
            contentArea.scrollTop = 0;
            // Move any <link /> tags to <head>
            const links = contentArea.querySelectorAll('link[rel="stylesheet"]');
            links.forEach(link => {
                if (!document.querySelector('link[href="' + link.getAttribute('href') + '"]')) {
                    document.head.appendChild(link.cloneNode(true));
                }
                link.remove();
            });
            // Execute inline scripts
            const scripts = contentArea.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                if (oldScript.src) {
                    newScript.src = oldScript.src;
                } else {
                    newScript.textContent = oldScript.textContent;
                }
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
            // Fold sections into collapsible cards
            foldSections(anchorId);
        })
        .catch(err => {
            contentArea.innerHTML = '<div class="docs-error"><i class="fas fa-exclamation-triangle"></i> ' + err.message + '</div>';
            contentArea.style.opacity = '1';
        });
    }

    // Sidebar click handlers
    navItems.forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            loadDocPage(this.dataset.slug);
        });
    });

    // Parse hash: /docs/#slug or /docs/#slug--sectionId
    const hash = window.location.hash.replace('#', '');
    if (hash) {
        const parts = hash.split('--');
        const slugFromHash = parts[0];
        const anchorFromHash = parts[1] || null;
        const matchedItem = Array.from(navItems).find(i => i.dataset.slug === slugFromHash);
        if (matchedItem) {
            currentSlug = slugFromHash;
            loadDocPage(currentSlug, anchorFromHash);
        } else {
            loadDocPage(currentSlug, hash);
        }
    } else {
        loadDocPage(currentSlug);
    }
})();
</script>
