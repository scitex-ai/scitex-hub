<!-- Repository Header with Breadcrumb -->
<div class="repo-header">
    <div class="repo-header-left">
        <a href="/{{ project.owner.username }}/" class="repo-header-owner">{{ project.owner.username }}</a>
        <span class="repo-header-separator">/</span>
        <a href="/{{ project.owner.username }}/{{ project.slug }}/" class="repo-title">{{ project.slug }}</a>
        {% if breadcrumbs %}
            {% for breadcrumb in breadcrumbs %}
                {% if breadcrumb.name != project.name %}
                    <span class="repo-header-separator">/</span>
                    {% if not breadcrumb.is_last %}
                        <a href="{{ breadcrumb.url }}" class="repo-breadcrumb-item">{{ breadcrumb.name }}</a>
                    {% else %}
                        <span class="repo-breadcrumb-current">{{ breadcrumb.name }}</span>
                    {% endif %}
                {% endif %}
            {% endfor %}
        {% endif %}
    </div>
</div>
