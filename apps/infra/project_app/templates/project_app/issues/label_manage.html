{% extends 'global_base.html' %}

{% block title %}Manage Labels - {{ project.name }} - SciTeX Hub{% endblock %}
{% block content %}
    <div class="container" style="max-width: 900px; padding: 2rem 0">
        <h2>Manage Labels</h2>
        <p>
            Label management interface - Create, edit, and delete labels for your
            project issues.
        </p>
        <a href="{% url 'project_app:issue_list' username=project.owner.username slug=project.slug %}"
           class="btn btn-secondary">Back to Issues</a>
    </div>
{% endblock %}
