{% load static %}

<!-- Settings Navigation - Reusable partial -->
<!-- Personal Settings -->
<div class="settings-nav-section">
    <div class="settings-nav-header">Personal</div>
    <a href="{% url 'accounts_app:profile_edit' %}"
       class="settings-nav-item {% if active == 'profile' %}active{% endif %}">
        <i class="fas fa-user"></i>
        <span>Profile</span>
    </a>
    <a href="{% url 'accounts_app:appearance' %}"
       class="settings-nav-item {% if active == 'appearance' %}active{% endif %}">
        <i class="fas fa-palette"></i>
        <span>Appearance</span>
    </a>
</div>
<!-- Integrations -->
<div class="settings-nav-section">
    <div class="settings-nav-header">Integrations</div>
    <a href="{% url 'accounts_app:git_integrations' %}"
       class="settings-nav-item {% if active == 'git_integrations' %}active{% endif %}">
        <i class="fab fa-git-alt"></i>
        <span>Git platforms</span>
    </a>
    <a href="{% url 'accounts_app:ai_providers' %}"
       class="settings-nav-item {% if active == 'ai_providers' %}active{% endif %}">
        <i class="fas fa-robot"></i>
        <span>AI providers</span>
    </a>
    <a href="{% url 'llm_app:usage_dashboard' %}"
       class="settings-nav-item {% if active == 'ai_usage' %}active{% endif %}">
        <i class="fas fa-chart-bar"></i>
        <span>AI usage</span>
    </a>
    <a href="{% url 'accounts_app:mcp_tools' %}"
       class="settings-nav-item {% if active == 'mcp_tools' %}active{% endif %}">
        <i class="fas fa-puzzle-piece"></i>
        <span>MCP tools</span>
    </a>
</div>
<!-- Authentication & Tokens -->
<div class="settings-nav-section">
    <div class="settings-nav-header">Authentication</div>
    <a href="{% url 'accounts_app:ssh_keys' %}"
       class="settings-nav-item {% if active == 'ssh_keys' %}active{% endif %}">
        <i class="fas fa-key"></i>
        <span>SSH keys</span>
    </a>
    <a href="{% url 'accounts_app:api_keys' %}"
       class="settings-nav-item {% if active == 'api_keys' %}active{% endif %}">
        <i class="fas fa-code"></i>
        <span>API keys</span>
    </a>
</div>
<!-- Privacy -->
<div class="settings-nav-section">
    <div class="settings-nav-header">Privacy</div>
    <a href="{% url 'accounts_app:privacy_settings' %}"
       class="settings-nav-item {% if active == 'privacy' %}active{% endif %}">
        <i class="fas fa-shield-alt"></i>
        <span>Privacy & Analytics</span>
    </a>
</div>
<!-- Repositories (Advanced) -->
<div class="settings-nav-section">
    <div class="settings-nav-header">Repositories</div>
    <a href="{% url 'accounts_app:repository_health' %}"
       class="settings-nav-item {% if active == 'repository_health' %}active{% endif %}">
        <i class="fas fa-heartbeat"></i>
        <span>Repository Health</span>
    </a>
</div>
