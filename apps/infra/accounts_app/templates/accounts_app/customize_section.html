{% extends "global_base.html" %}

{% block title %}{{ section_title }} — AI Setup — SciTeX{% endblock %}
{% block content %}
    <div class="customize-workspace">
        <aside class="customize-sidebar">
            <nav class="customize-nav">
                {% for cat in categories %}
                    <a href="{{ cat.url }}"
                       class="customize-nav-item{% if cat.name == section_title %} active{% endif %}"
                       data-ajax-load="{{ cat.url }}"
                       data-section="{{ cat.name|slugify }}">
                        <i class="{{ cat.icon }}"></i>
                        <span>{{ cat.name }}</span>
                    </a>
                {% endfor %}
            </nav>
        </aside>
        <div class="customize-content" id="customize-content">{% include "accounts_app/customize_section_partial.html" %}</div>
    </div>
{% endblock %}
