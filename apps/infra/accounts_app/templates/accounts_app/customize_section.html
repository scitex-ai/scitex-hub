{% extends "global_base.html" %}

{% block title %}{{ section_title }} — Customize — SciTeX{% endblock %}
{% block content %}
    <div class="customize-section">
        <div class="customize-section-header">
            <a href="/customize/" class="customize-back" title="Back to Customize">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="customize-section-icon">
                <i class="{{ section_icon }}"></i>
            </div>
            <div>
                <h1 class="customize-section-title">{{ section_title }}</h1>
                <p class="customize-section-subtitle">Coming soon</p>
            </div>
        </div>
        <div class="customize-section-content">
            <div class="customize-empty">
                <i class="{{ section_icon }}"></i>
                <p>{{ section_title }} configuration will be available here.</p>
                <p class="customize-empty-hint">This feature is under development.</p>
            </div>
        </div>
    </div>
{% endblock %}
