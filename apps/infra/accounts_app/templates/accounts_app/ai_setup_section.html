{% extends "global_base.html" %}

{% block title %}{{ section_title }} — AI Setup — SciTeX{% endblock %}
{% block content %}
    <div class="stx-app-miller">
        <!-- Col 1: Section nav -->
        <div class="stx-app-miller__col">
            {% for cat in categories %}
                <button class="stx-app-miller__item{% if cat.name == section_title %} stx-app-miller__item--active{% endif %}"
                        data-ajax-load="{{ cat.url }}"
                        data-section="{{ cat.name|slugify }}">
                    <i class="{{ cat.icon }}"></i>
                    <span class="stx-app-miller__item-label">{{ cat.name }}</span>
                    <i class="fas fa-chevron-right stx-app-miller__item-arrow"></i>
                </button>
            {% endfor %}
        </div>
        <!-- Col 2: Items with toggles -->
        <div class="stx-app-miller__col" id="ai-setup-content">{% include "accounts_app/ai_setup_section_partial.html" %}</div>
        <!-- Col 3: Detail (populated by JS on item click) -->
        <div class="stx-app-miller__col stx-app-miller__col--detail"
             id="ai-setup-detail-col">
            <div class="stx-app-miller__detail-empty">Select an item to view details</div>
        </div>
    </div>
{% endblock %}
