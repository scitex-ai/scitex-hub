<!-- hook-bypass: inline-script — AJAX-loaded partial needs inline JS for dynamic item click handlers -->
{% load i18n %}
{% if items %}
    {% for item in items %}
        <button class="stx-app-miller__item"
                data-item-name="{{ item.name }}"
                data-section="{{ section }}">
            <i class="{{ item.icon }}"></i>
            <span class="stx-app-miller__item-label">{{ item.name }}</span>
            <label class="ai-setup-toggle" onclick="event.stopPropagation();">
                <input type="checkbox"
                       class="ai-setup-toggle-input"
                       data-item="{{ item.group_key|default:item.name }}"
                       {% if item.enabled %}checked{% endif %}
                       checked />
                <span class="ai-setup-toggle-slider"></span>
            </label>
            <i class="fas fa-chevron-right stx-app-miller__item-arrow"></i>
        </button>
    {% endfor %}
{% else %}
    <div class="stx-app-miller__detail-empty">{% with section_name=section_title|lower %}{% blocktrans trimmed %}No {{ section_name }} available.{% endblocktrans %}{% endwith %}</div>
{% endif %}
<script>
setTimeout(function() {
  var items = document.querySelectorAll('#ai-setup-content .stx-app-miller__item');
  var detail = document.getElementById('ai-setup-detail-col');
  if (!detail || !items.length) return;
  // Item names come from the DOM; set them as text so they are never parsed as HTML.
  function showEmpty(text) {
    var box = document.createElement('div');
    box.className = 'stx-app-miller__detail-empty';
    box.textContent = text;
    detail.replaceChildren(box);
  }
  items.forEach(function(item) {
    item.addEventListener('click', function() {
      items.forEach(function(i) { i.classList.remove('stx-app-miller__item--active'); });
      item.classList.add('stx-app-miller__item--active');
      var name = item.getAttribute('data-item-name');
      var section = item.getAttribute('data-section');
      if (!name || !section) return;
      detail.textContent = '{% trans "Loading..." as loading_label %}{{ loading_label|escapejs }}';
      fetch('/ai-setup/api/item/' + section + '/' + encodeURIComponent(name) + '/')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.content) {
            var html = (typeof marked !== 'undefined' && marked.parse)
              ? marked.parse(data.content)
              : '\x3cpre>' + data.content.replace(/&/g, '&amp;').replace(/\x3c/g, '&lt;').replace(/\x3e/g, '&gt;') + '\x3c/pre>';
            detail.innerHTML = '\x3cdiv class="stx-app-miller__detail-content">' + html + '\x3c/div>';
          } else {
            showEmpty('{% trans "No detail for" as no_detail_label %}{{ no_detail_label|escapejs }} ' + name);
          }
        })
        .catch(function() { showEmpty('{% trans "Failed" as failed_label %}{{ failed_label|escapejs }}'); });
    });
  });
}, 0);
</script>
