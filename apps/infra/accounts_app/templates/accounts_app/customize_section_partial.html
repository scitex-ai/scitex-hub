<div class="customize-section customize-section--scrollable">
    <div class="customize-section-header">
        <a href="/customize/"
           class="customize-back"
           data-ajax-load="/customize/"
           title="Back to Customize">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="customize-section-icon">
            <i class="{{ section_icon }}"></i>
        </div>
        <div>
            <h1 class="customize-section-title">{{ section_title }}</h1>
            <p class="customize-section-subtitle">{{ items|length }} item{{ items|length|pluralize }}</p>
        </div>
    </div>
    <div class="customize-section-content">
        {% if items %}
            {% for item in items %}
                <div class="customize-section-item">
                    <div class="customize-card-icon">
                        <i class="{{ item.icon }}"></i>
                    </div>
                    <div class="customize-card-body">
                        <h3 class="customize-card-name">{{ item.name }}</h3>
                        <p class="customize-card-desc">{{ item.description }}</p>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <div class="customize-empty">
                <i class="{{ section_icon }}"></i>
                <p>No {{ section_title|lower }} configured yet.</p>
            </div>
        {% endif %}
    </div>
</div>
