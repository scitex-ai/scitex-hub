<div class="customize-section customize-section--scrollable">
    <div class="customize-section-content">
        {% if items %}
            {% for item in items %}
                <div class="customize-section-item">
                    <div class="customize-card-icon">
                        <i class="{{ item.icon }}"></i>
                    </div>
                    <div class="customize-card-body">
                        <h3 class="customize-card-name">{{ item.name }}</h3>
                        <p class="customize-card-desc">
                            {{ item.description }}
                            {% if item.count %}· {{ item.count }} tools{% endif %}
                        </p>
                    </div>
                    <label class="stx-app-toggle" onclick="event.stopPropagation();">
                        <input type="checkbox"
                               class="stx-app-toggle__input"
                               data-group="{{ item.group_key|default:item.name }}"
                               {% if item.enabled %}checked{% endif %}
                               checked />
                        <span class="stx-app-toggle__slider"></span>
                    </label>
                </div>
            {% endfor %}
        {% else %}
            <div class="customize-empty">
                <i class="{{ section_icon }}"></i>
                <p>No {{ section_title|lower }} configured yet.</p>
            </div>
        {% endif %}
    </div>
</div>
