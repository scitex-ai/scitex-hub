{% if items %}
    {% for item in items %}
        <button class="stx-app-miller__item"
                data-item-name="{{ item.name }}"
                data-section="{{ section }}">
            <i class="{{ item.icon }}"></i>
            <span class="stx-app-miller__item-label">{{ item.name }}</span>
            <label class="customize-toggle" onclick="event.stopPropagation();">
                <input type="checkbox"
                       class="customize-toggle-input"
                       data-item="{{ item.group_key|default:item.name }}"
                       {% if item.enabled %}checked{% endif %}
                       checked />
                <span class="customize-toggle-slider"></span>
            </label>
            <i class="fas fa-chevron-right stx-app-miller__item-arrow"></i>
        </button>
    {% endfor %}
{% else %}
    <div class="stx-app-miller__detail-empty">No {{ section_title|lower }} available.</div>
{% endif %}
<script>
(function() {
  var items = document.querySelectorAll('#customize-content .stx-app-miller__item');
  var detail = document.getElementById('customize-detail-col');
  if (!detail || !items.length) return;
  items.forEach(function(item) {
    item.addEventListener('click', function() {
      items.forEach(function(i) { i.classList.remove('stx-app-miller__item--active'); });
      item.classList.add('stx-app-miller__item--active');
      var name = item.getAttribute('data-item-name');
      var section = item.getAttribute('data-section');
      if (!name || !section) return;
      detail.textContent = 'Loading...';
      fetch('/customize/api/item/' + section + '/' + encodeURIComponent(name) + '/')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.content) {
            var escaped = data.content.replace(/&/g, '&amp;').replace(/\x3c/g, '&lt;').replace(/\x3e/g, '&gt;');
            detail.innerHTML = '\x3cpre class="stx-app-miller__detail-content">' + escaped + '\x3c/pre>';
          } else {
            detail.innerHTML = '<div class="stx-app-miller__detail-empty">No detail for ' + name + '</div>';
          }
        })
        .catch(function() { detail.innerHTML = '<div class="stx-app-miller__detail-empty">Failed</div>'; });
    });
  });
})();
</script>
