{% load static %}

<link rel="stylesheet" href="{% static 'marketplace_app/css/marketplace.css' %}" />
<div class="marketplace-container">
    <div class="marketplace-header"
         style="display:flex;
                align-items:center;
                gap:8px;
                padding:4px 0 0;
                margin-bottom:8px">
        <span style="font-weight:600;">Marketplace</span>
        <span class="badge badge-wip">WIP</span>
    </div>
    <!-- Top bar: category filter tabs, search, sort -->
    <div class="marketplace-topbar">
        <nav class="marketplace-category-tabs" aria-label="App categories">
            <button type="button" class="marketplace-cat-tab active" data-filter-category="">All</button>
            {% for cat_key, cat_label in categories %}
                <button type="button" class="marketplace-cat-tab" data-filter-category="{{ cat_key }}">{{ cat_label }}</button>
            {% endfor %}
        </nav>
        <div class="marketplace-search-sort">
            <div class="marketplace-search-wrapper">
                <i class="fas fa-search marketplace-search-icon" aria-hidden="true"></i>
                <input type="text"
                       id="mp-search-input"
                       class="marketplace-search-input"
                       placeholder="Search apps... (Ctrl+K)"
                       aria-label="Search apps" />
                <button type="button"
                        class="marketplace-search-clear"
                        id="mp-search-clear"
                        style="display:none"
                        aria-label="Clear search">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>
            <select id="mp-sort-select" class="marketplace-sort-select" aria-label="Sort apps">
                <option value="popular" selected>Popular</option>
                <option value="newest">Newest</option>
                <option value="rating">Rating</option>
            </select>
        </div>
    </div>
    <!-- Module grid (always contains ALL modules; filtering is client-side) -->
    <div class="marketplace-grid" id="mp-grid">
        {% for mod_item in modules %}
            {% include "marketplace_app/partials/module_card.html" %}
        {% endfor %}
    </div>
    <div class="marketplace-empty-state" id="mp-empty" style="display:none">
        <i class="fas fa-store-slash" aria-hidden="true"></i>
        <p class="marketplace-empty-title">No apps found</p>
        <p class="marketplace-empty-description" id="mp-empty-desc">No apps match your search.</p>
    </div>
</div>
<script>
(function () {
    var grid = document.getElementById('mp-grid');
    var emptyEl = document.getElementById('mp-empty');
    var emptyDesc = document.getElementById('mp-empty-desc');
    var searchInput = document.getElementById('mp-search-input');
    var clearBtn = document.getElementById('mp-search-clear');
    var sortSelect = document.getElementById('mp-sort-select');
    var tabs = document.querySelectorAll('.marketplace-cat-tab');
    var cards = grid ? Array.prototype.slice.call(grid.querySelectorAll('.mp-card')) : [];
    var activeCategory = '';

    /* ── Helpers ────────────────────────────────────── */
    function getCsrf() {
        return document.querySelector('[name=csrfmiddlewaretoken]')?.value ||
               document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
    }

    /** Sort rank: installed+enabled=2, installed+disabled=1, not installed=0 */
    function installRank(card) {
        var inst = parseInt(card.dataset.installed) || 0;
        if (!inst) return 0;
        var en = parseInt(card.dataset.enabled) || 0;
        return en ? 2 : 1;
    }

    /* ── Filtering ─────────────────────────────────── */
    function applyFilters() {
        var query = (searchInput.value || '').toLowerCase().trim();
        var visibleCount = 0;

        cards.forEach(function (card) {
            var catMatch = !activeCategory || card.dataset.category === activeCategory;
            var textMatch = !query || card.textContent.toLowerCase().indexOf(query) !== -1;
            var show = catMatch && textMatch;
            card.style.display = show ? '' : 'none';
            if (show) visibleCount++;
        });

        clearBtn.style.display = query ? '' : 'none';

        if (visibleCount === 0) {
            grid.style.display = 'none';
            emptyEl.style.display = '';
            if (query) {
                emptyDesc.innerHTML = 'No apps match &ldquo;' +
                    query.replace(/</g, '&lt;') + '&rdquo;.';
            } else {
                emptyDesc.textContent = 'No apps in this category.';
            }
        } else {
            grid.style.display = '';
            emptyEl.style.display = 'none';
        }
    }

    /* ── Sorting ───────────────────────────────────── */
    function applySortAndFilter() {
        var sortKey = sortSelect.value;
        cards.sort(function (a, b) {
            /* Priority: installed+enabled > installed+disabled > others */
            var rankDiff = installRank(b) - installRank(a);
            if (rankDiff !== 0) return rankDiff;

            /* Within same rank, installed cards sort by tab_order */
            if (installRank(a) > 0) {
                return (parseInt(a.dataset.tabOrder) || 50) - (parseInt(b.dataset.tabOrder) || 50);
            }

            /* Others: sort by user-selected criteria */
            if (sortKey === 'newest') {
                return (parseInt(b.dataset.created) || 0) - (parseInt(a.dataset.created) || 0);
            } else if (sortKey === 'rating') {
                var diff = (parseFloat(b.dataset.rating) || 0) - (parseFloat(a.dataset.rating) || 0);
                return diff !== 0 ? diff : (parseInt(b.dataset.stars) || 0) - (parseInt(a.dataset.stars) || 0);
            }
            var diff2 = (parseInt(b.dataset.stars) || 0) - (parseInt(a.dataset.stars) || 0);
            return diff2 !== 0 ? diff2 : (parseInt(b.dataset.installs) || 0) - (parseInt(a.dataset.installs) || 0);
        });
        cards.forEach(function (card) { grid.appendChild(card); });
        applyFilters();
    }

    /* ── Drag-to-reorder (installed/disabled cards only) ── */
    var draggedCard = null;
    var dropPosition = 'before'; /* 'before' or 'after' relative to target */

    function isReorderable(card) {
        return installRank(card) > 0;
    }

    function clearDragClasses() {
        grid.querySelectorAll('.mp-card-drag-above, .mp-card-drag-below').forEach(function (c) {
            c.classList.remove('mp-card-drag-above', 'mp-card-drag-below');
        });
    }

    cards.forEach(function (card) {
        if (!isReorderable(card)) return;
        card.draggable = true;

        card.addEventListener('dragstart', function (e) {
            draggedCard = card;
            card.classList.add('mp-card-dragging');
            e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', function () {
            draggedCard = null;
            card.classList.remove('mp-card-dragging');
            clearDragClasses();
        });

        card.addEventListener('dragover', function (e) {
            if (!draggedCard || draggedCard === card || !isReorderable(card)) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            /* Detect cursor position: top half → insert above, bottom half → below */
            var rect = card.getBoundingClientRect();
            var midY = rect.top + rect.height / 2;

            clearDragClasses();
            if (e.clientY < midY) {
                card.classList.add('mp-card-drag-above');
                dropPosition = 'before';
            } else {
                card.classList.add('mp-card-drag-below');
                dropPosition = 'after';
            }
        });

        card.addEventListener('dragleave', function (e) {
            /* Only clear if actually leaving this card (not entering a child) */
            if (!card.contains(e.relatedTarget)) {
                card.classList.remove('mp-card-drag-above', 'mp-card-drag-below');
            }
        });

        card.addEventListener('drop', function (e) {
            e.preventDefault();
            clearDragClasses();
            if (!draggedCard || draggedCard === card) return;

            /* Insert based on detected position */
            if (dropPosition === 'after') {
                grid.insertBefore(draggedCard, card.nextSibling);
            } else {
                grid.insertBefore(draggedCard, card);
            }

            /* Update cards array and tab_order data attributes */
            cards = Array.prototype.slice.call(grid.querySelectorAll('.mp-card'));
            var order = [];
            var idx = 0;
            cards.forEach(function (c) {
                if (isReorderable(c)) {
                    idx++;
                    c.dataset.tabOrder = idx * 10;
                    order.push(c.dataset.module);
                }
            });

            /* Persist to server + sync tab bar */
            fetch('/marketplace/api/reorder/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCsrf(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ order: order })
            }).then(function () {
                syncTabBar(order);
            });
        });
    });

    /** Reorder the module tab bar to match marketplace order */
    function syncTabBar(orderedNames) {
        var tabBar = document.querySelector('.module-tab-bar');
        if (!tabBar) return;
        var tabBtns = Array.prototype.slice.call(tabBar.querySelectorAll('.module-tab-btn'));
        var tabMap = {};
        tabBtns.forEach(function (btn) { tabMap[btn.dataset.module] = btn; });

        orderedNames.forEach(function (name) {
            if (tabMap[name]) tabBar.appendChild(tabMap[name]);
        });
        /* Append any remaining tabs not in the order list (e.g. non-reordered) */
        tabBtns.forEach(function (btn) {
            if (orderedNames.indexOf(btn.dataset.module) === -1) {
                tabBar.appendChild(btn);
            }
        });
    }

    /* ── Category tabs ─────────────────────────────── */
    tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
            tabs.forEach(function (t) { t.classList.remove('active'); });
            tab.classList.add('active');
            activeCategory = tab.dataset.filterCategory || '';
            applyFilters();
        });
    });

    /* Search — instant on input */
    searchInput.addEventListener('input', applyFilters);

    /* Clear button */
    clearBtn.addEventListener('click', function () {
        searchInput.value = '';
        applyFilters();
        searchInput.focus();
    });

    /* Sort */
    sortSelect.addEventListener('change', applySortAndFilter);

    /* Initial sort */
    applySortAndFilter();

    /* Ctrl+K — focus search */
    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            var container = document.querySelector('.marketplace-container');
            if (container && container.offsetParent !== null) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        }
    });
}());
</script>
