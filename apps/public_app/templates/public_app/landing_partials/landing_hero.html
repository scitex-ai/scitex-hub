{% load static %}
<!-- Hero Section -->
<section class="hero-landing" id="home">
    <div class="container">
        <div class="hero-wrapper">
            <div class="hero-content">
                <!-- Text title option (kept for future use)
                <h1 class="hero-title">SciTeX — Where Research Happens</h1>
                <p class="hero-bullet-point">From data to publication, all in one.</p>
                -->
                <!-- Icon only option (kept for future use)
                <div class="hero-logo-container">
                    <img src="{% static 'shared/images/scitex_logos/scitex-icon/scitex-icon-navy-inverted.png' %}"
                         alt="SciTeX"
                         class="hero-icon" />
                </div>
                -->
                <!-- Full logo - clean and minimal -->
                <div class="hero-logo-container">
                    <img src="{% static 'shared/images/scitex_logos/logo-files/png/scitex-logo-transparent.png' %}"
                         alt="SciTeX - For Researchers"
                         class="hero-logo" />
                </div>
                <!-- Value proposition and CTA -->
                <p class="hero-tagline">Research Automation — For Humans and AI</p>
                <p class="hero-description">Python toolkit + MCP server for literature search, statistics, visualization, and manuscript writing. 70% less code.</p>
                <div class="hero-cta-container">
                    <a href="{% url 'workspace_app:dashboard' %}" class="hero-cta-button">
                        <i class="fas fa-rocket"></i> Start Automating
                    </a>
                    <span class="hero-cta-note">No sign-up required</span>
                </div>
                <div class="hero-badges">
                    <span class="hero-badge badge-success">
                        <i class="fab fa-github"></i> 100% Open Source
                    </span>
                    <a href="{% url 'public_app:demos' %}" class="hero-badge badge-warning" style="text-decoration: none;">
                        <i class="fas fa-play-circle"></i> Watch Demos
                    </a>
                </div>
            </div>
            <!-- Hero Demo Video Preview -->
            <div class="hero-image">
                <div class="demo-preview">
                    <a href="{% url 'public_app:video_player' 'scitex-automated-research' %}"
                       class="demo-link">
                        <div class="demo-display">
                            <img src="/media/videos/scitex-automated-research-demo-thumbnail.png"
                                 alt="SciTeX Automated Research Demo"
                                 class="demo-thumbnail" />
                            <div class="demo-overlay">
                                <i class="fas fa-play-circle demo-play-icon"></i>
                                <span class="demo-text">Watch Demo</span>
                                <span class="demo-duration">40 min · Automated with SciTeX MCP server</span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
