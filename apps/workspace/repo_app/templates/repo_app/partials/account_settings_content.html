{% comment %}
Hub-embedded account settings — loaded inline by /hub/api/account-settings/
{% endcomment %}
{% load static %}

<link rel="stylesheet" href="{% static 'shared/css/layouts/settings-layout.css' %}" />
<link rel="stylesheet" href="{% static 'accounts_app/css/profile_edit.css' %}" />
<link rel="stylesheet" href="{% static 'accounts_app/css/account_settings.css' %}" />
<div class="settings-page" id="hub-account-settings">
    <div class="settings-layout">
        <!-- Left Navigation -->
        <aside class="settings-nav">
            {% include 'accounts_app/partials/settings_nav.html' with active='profile' %}
        </aside>
        <!-- Right Content -->
        <main class="settings-content" id="hub-account-settings-content">
            <div id="hub-settings-message"></div>
            <div id="hub-settings-section-content">{% include 'repo_app/partials/account_settings/profile_section.html' %}</div>
        </main>
    </div>
</div>
