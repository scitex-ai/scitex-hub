<label class="scholar-project-picker" for="project-selector">
    <i class="fas fa-folder-open" aria-hidden="true"></i>
    <span class="sr-only">Project</span>
    <select id="project-selector" class="form-select" title="Save to: All projects (your library) or one project">
        <option value="">All projects</option>
        {% for project in user_projects %}
        <option value="{{ project.id }}"{% if current_project and project.id == current_project.id %} selected{% endif %}>{{ project.name }}</option>
        {% endfor %}
    </select>
    <i class="fas fa-chevron-down scholar-project-picker-chevron" aria-hidden="true"></i>
</label>
