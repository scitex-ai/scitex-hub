{% load static i18n %}

<!-- Hidden file input for BibTeX import (referenced by JS) -->
<input type="file" id="bibtex-file-input" accept=".bib" hidden />
<!-- Unified toolbar: search, then collection + sort selects -->
<div class="library-toolbar">
    <div class="library-collection-filter">
        <!-- The user's collections are appended by _library-manager.ts -->
        <select class="library-filter-select"
                id="library-collection-select"
                aria-label="{% trans 'Collection' %}"
                title="{% trans 'Collection' %}">
            <option value="all">{% trans "All papers" %}</option>
        </select>
    </div>
    <div class="library-search-input-wrapper">
        <i class="fas fa-search library-search-icon"></i>
        <input type="text"
               class="library-search-input"
               id="library-search-input"
               placeholder="{% trans 'Search papers from library' %}" />
        <button class="library-search-clear" id="library-search-clear" hidden>
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="library-filter-controls">
        <!-- Short labels so the selected option fits the phone toolbar. -->
        <select class="library-filter-select"
                id="library-sort-select"
                aria-label="{% trans 'Sort papers' %}"
                title="{% trans 'Sort papers' %}">
            <option value="date_added_desc">{% trans "Newest" %}</option>
            <option value="date_added_asc">{% trans "Oldest" %}</option>
            <option value="importance_desc">{% trans "Most important" %}</option>
            <option value="importance_asc">{% trans "Least important" %}</option>
            <option value="year_desc">{% trans "Year (new)" %}</option>
            <option value="year_asc">{% trans "Year (old)" %}</option>
            <option value="title_asc">{% trans "Title A–Z" %}</option>
            <option value="title_desc">{% trans "Title Z–A" %}</option>
        </select>
    </div>
</div>
<!-- Paper List -->
<div class="library-papers-container">
    <div class="library-papers-list"
         id="library-papers-list"
         data-empty-title="{% trans 'No papers in your library yet' %}"
         data-empty-description="{% trans 'Start by importing papers from BibTeX or adding them manually' %}"
         data-empty-filtered-title="{% trans 'No matching papers' %}"
         data-empty-filtered-description="{% trans 'Try adjusting your search or filters' %}">
        <!-- Loading spinner -->
        <div class="library-loading" id="library-loading">
            <i class="fas fa-spinner fa-spin"></i>
            <div class="library-loading-text">Loading papers...</div>
        </div>
        <!-- Empty state -->
        <div class="library-empty-state" id="library-empty-state" hidden>
            <i class="fas fa-books"></i>
            <div class="library-empty-title">{% trans "No papers in your library yet" %}</div>
            <div class="library-empty-description">{% trans "Start by importing papers from BibTeX or adding them manually" %}</div>
        </div>
        <!-- Paper cards loaded via JS -->
    </div>
</div>
<!-- Paper Card Template (for JS cloning) -->
<template id="library-paper-card-template">
    <div class="library-paper-card" data-paper-id="">
        <div class="library-paper-header">
            <div class="library-paper-title-row">
                <h6 class="library-paper-title"></h6>
                <div class="library-paper-status-badge"></div>
            </div>
            <div class="library-paper-importance">
                <i class="far fa-star library-star" data-rating="1"></i>
                <i class="far fa-star library-star" data-rating="2"></i>
                <i class="far fa-star library-star" data-rating="3"></i>
                <i class="far fa-star library-star" data-rating="4"></i>
                <i class="far fa-star library-star" data-rating="5"></i>
            </div>
        </div>
        <div class="library-paper-meta">
            <div class="library-paper-authors"></div>
            <div class="library-paper-publication"></div>
        </div>
        <div class="library-paper-tags"></div>
        <div class="library-paper-actions">
            <button class="library-paper-action-btn" data-action="view-pdf" title="View PDF">
                <i class="fas fa-file-pdf"></i>
            </button>
            <button class="library-paper-action-btn" data-action="edit" title="Edit details">
                <i class="fas fa-edit"></i>
            </button>
            <button class="library-paper-action-btn"
                    data-action="remove"
                    title="Remove from library">
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>
    </div>
</template>
