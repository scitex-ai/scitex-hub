<!-- Library Import/Export Controls for Right Panel -->
<div class="search-controls-panel">
    <!-- Service Status -->
    <div class="mig-card collapsed"
         id="section-library-status"
         data-panel-id="lib-service-status">
        <div class="mig-card__header"
             onclick="window._toggleInlinePanel && window._toggleInlinePanel(this)">
            <h6 class="mig-card__title">
                <i class="fas fa-heartbeat"></i> Service Status
            </h6>
            <i class="fas fa-chevron-down mig-card__chevron"></i>
        </div>
        <div class="mig-card__content">
            <div id="library-service-status" class="library-service-leds">
                <div class="library-led-row" data-service="zotero">
                    <span class="search-led" data-status="checking"></span>
                    <span class="library-led-label">Zotero (local DB)</span>
                </div>
                <div class="library-led-row" data-service="connected-papers">
                    <span class="search-led" data-status="checking"></span>
                    <span class="library-led-label">Connected Papers (Semantic Scholar)</span>
                </div>
            </div>
        </div>
    </div>
    <!-- BibTeX / RIS -->
    <div class="mig-card collapsed"
         id="section-bibtex-ris"
         data-panel-id="lib-bibtex-ris">
        <div class="mig-card__header"
             onclick="window._toggleInlinePanel && window._toggleInlinePanel(this)">
            <h6 class="mig-card__title">
                <i class="fas fa-file-alt icon-bibtex"></i> BibTeX / RIS
            </h6>
            <i class="fas fa-chevron-down mig-card__chevron"></i>
        </div>
        <div class="mig-card__content">
            <label class="mig-card__label">
                <i class="fas fa-download"></i> Import
            </label>
            <input type="file" id="bibtex-file-input" accept=".bib" hidden />
            <button id="library-import-btn" class="mig-card__btn mig-card__btn--primary">
                <i class="fas fa-file-upload"></i> Import BibTeX (.bib)
            </button>
            <div id="bibtex-import-result" class="mig-card__status" hidden></div>
            <hr class="mig-card__hr" />
            <label class="mig-card__label">
                <i class="fas fa-upload"></i> Export
            </label>
            <div class="mig-card__btn-group">
                <button id="library-export-all-btn" class="mig-card__btn">
                    <i class="fas fa-file-download"></i> BibTeX
                </button>
                <button id="export-ris-button" class="mig-card__btn">
                    <i class="fas fa-file-export"></i> RIS
                </button>
            </div>
        </div>
    </div>
    <!-- Zotero -->
    <div class="mig-card collapsed"
         id="section-zotero"
         data-panel-id="lib-zotero"
         title="Import from / Export to Zotero">
        <div class="mig-card__header"
             onclick="window._toggleInlinePanel && window._toggleInlinePanel(this)">
            <h6 class="mig-card__title">
                <i class="fas fa-book icon-zotero"></i> &#x2194; Zotero
                <span class="badge badge-wip badge-sm">WIP</span>
            </h6>
            <i class="fas fa-chevron-down mig-card__chevron"></i>
        </div>
        <div class="mig-card__content">
            <div id="zotero-status-indicator" class="mig-card__status-indicator">
                <span class="mig-card__hint">
                    <i class="fas fa-circle-notch fa-spin"></i> Checking Zotero...
                </span>
            </div>
            <label class="mig-card__label">
                <i class="fas fa-download"></i> Import
            </label>
            <select id="zotero-import-mode" class="form-control form-control-sm mb-1">
                <option value="all">All papers</option>
                <option value="collection">By collection</option>
                <option value="tags">By tags</option>
            </select>
            <div id="zotero-collection-group" class="mig-card__filter-group" hidden>
                <select id="zotero-collection-select" class="form-control form-control-sm">
                    <option value="">Loading...</option>
                </select>
            </div>
            <div id="zotero-tags-group" class="mig-card__filter-group" hidden>
                <input type="text"
                       id="zotero-tags-input"
                       class="form-control form-control-sm"
                       placeholder="e.g. neuroscience, review" />
            </div>
            <button id="zotero-import-btn"
                    class="mig-card__btn mig-card__btn--primary"
                    onclick="scholarZoteroImport();">
                <i class="fas fa-download"></i> Import from Zotero
            </button>
            <div id="zotero-import-result" class="mig-card__status" hidden></div>
            <hr class="mig-card__hr" />
            <label class="mig-card__label">
                <i class="fas fa-upload"></i> Export
            </label>
            <p class="mig-card__hint">Export selected library papers as BibTeX for Zotero import.</p>
            <button id="zotero-export-btn" class="mig-card__btn" onclick="scholarZoteroExport();">
                <i class="fas fa-upload"></i> Export to Zotero (BibTeX)
            </button>
            <div id="zotero-export-result" class="mig-card__status" hidden></div>
        </div>
    </div>
    <!-- Overleaf and Prism integrations are in the Writer app -->
    <!-- Connected Papers -->
    <div class="mig-card collapsed"
         id="section-connected-papers"
         data-panel-id="lib-connected-papers">
        <div class="mig-card__header"
             onclick="window._toggleInlinePanel && window._toggleInlinePanel(this)">
            <h6 class="mig-card__title">
                <i class="fas fa-project-diagram icon-connected-papers"></i> &#x2194; Connected Papers
                <span class="badge badge-wip badge-sm">WIP</span>
            </h6>
            <i class="fas fa-chevron-down mig-card__chevron"></i>
        </div>
        <div class="mig-card__content">
            <div id="cp-status-indicator" class="mig-card__status-indicator">
                <span class="mig-card__hint">
                    <i class="fas fa-circle-notch fa-spin"></i> Checking...
                </span>
            </div>
            <label class="mig-card__label">Semantic Scholar Paper ID</label>
            <input type="text"
                   id="cp-paper-id"
                   class="form-control form-control-sm mb-1"
                   placeholder="40-char SHA or DOI" />
            <p class="mig-card__hint">Find paper IDs at semanticscholar.org</p>
            <button id="cp-import-btn"
                    class="mig-card__btn mig-card__btn--primary"
                    onclick="scholarCPImport();">
                <i class="fas fa-download"></i> Import Graph
            </button>
            <div id="cp-import-result" class="mig-card__status" hidden></div>
        </div>
    </div>
</div>
<script>
// Zotero import mode toggle
document.getElementById('zotero-import-mode')?.addEventListener('change', function() {
    const mode = this.value;
    document.getElementById('zotero-collection-group').hidden = mode !== 'collection';
    document.getElementById('zotero-tags-group').hidden = mode !== 'tags';
});

// Helper: update LED indicator
function updateLed(service, status) {
    var row = document.querySelector('.library-led-row[data-service="' + service + '"] .search-led');
    if (row) row.setAttribute('data-status', status);
}

// Check Zotero status on load
(function checkZoteroStatus() {
    fetch('/apps/scholar/api/library/zotero/status/')
        .then(r => r.json())
        .then(data => {
            const el = document.getElementById('zotero-status-indicator');
            updateLed('zotero', data.available ? 'ready' : 'error');
            if (!el) return;
            if (data.available) {
                el.innerHTML = '<span class="mig-card__hint mig-status--success"><i class="fas fa-check-circle"></i> Zotero DB found</span>';
                fetch('/apps/scholar/api/library/zotero/collections/')
                    .then(r => r.json())
                    .then(cd => {
                        const sel = document.getElementById('zotero-collection-select');
                        if (!sel || !cd.collections) return;
                        sel.innerHTML = cd.collections.map(c => '<option value="' + c + '">' + c + '</option>').join('');
                    });
            } else {
                el.innerHTML = '<span class="mig-card__hint"><i class="fas fa-times-circle"></i> Zotero not found locally</span>';
                document.getElementById('zotero-import-btn')?.setAttribute('disabled', 'true');
            }
        })
        .catch(() => {
            updateLed('zotero', 'error');
            const el = document.getElementById('zotero-status-indicator');
            if (el) el.innerHTML = '<span class="mig-card__hint mig-status--danger"><i class="fas fa-exclamation-triangle"></i> Status check failed</span>';
        });
})();

function scholarZoteroImport() {
    const mode = document.getElementById('zotero-import-mode')?.value || 'all';
    const btn = document.getElementById('zotero-import-btn');
    const result = document.getElementById('zotero-import-result');
    if (!btn || !result) return;

    const body = { mode: mode };
    if (mode === 'collection') {
        body.collection = document.getElementById('zotero-collection-select')?.value || '';
    } else if (mode === 'tags') {
        const raw = document.getElementById('zotero-tags-input')?.value || '';
        body.tags = raw.split(',').map(t => t.trim()).filter(Boolean);
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Importing...';
    result.hidden = true;

    fetch('/apps/scholar/api/library/zotero/import/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value
                || document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '',
        },
        body: JSON.stringify(body),
    })
    .then(r => r.json())
    .then(data => {
        result.hidden = false;
        if (data.error) {
            result.innerHTML = '<span class="mig-status--danger"><i class="fas fa-times-circle"></i> ' + data.error + '</span>';
        } else {
            result.innerHTML = '<span class="mig-status--success"><i class="fas fa-check-circle"></i> Imported ' + data.imported + ' / ' + data.total + ' papers</span>';
        }
    })
    .catch(err => {
        result.hidden = false;
        result.innerHTML = '<span class="mig-status--danger"><i class="fas fa-times-circle"></i> ' + err.message + '</span>';
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-download"></i> Import from Zotero';
    });
}

function scholarZoteroExport() {
    const btn = document.getElementById('zotero-export-btn');
    const result = document.getElementById('zotero-export-result');
    if (!btn || !result) return;

    const checked = document.querySelectorAll('.library-checkbox:checked');
    const paperIds = Array.from(checked).map(cb => cb.dataset.paperId).filter(Boolean);

    if (paperIds.length === 0) {
        result.hidden = false;
        result.innerHTML = '<span class="mig-status--warning"><i class="fas fa-info-circle"></i> Select papers in library first</span>';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Exporting...';
    result.hidden = true;

    fetch('/apps/scholar/api/library/zotero/export/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value
                || document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '',
        },
        body: JSON.stringify({ paper_ids: paperIds, mode: 'bibtex' }),
    })
    .then(r => {
        if (r.headers.get('Content-Type')?.includes('text/plain')) {
            return r.blob().then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'zotero_export.bib';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                result.hidden = false;
                result.innerHTML = '<span class="mig-status--success"><i class="fas fa-check-circle"></i> Downloaded ' + paperIds.length + ' papers as BibTeX</span>';
            });
        }
        return r.json().then(data => {
            result.hidden = false;
            if (data.error) {
                result.innerHTML = '<span class="mig-status--danger"><i class="fas fa-times-circle"></i> ' + data.error + '</span>';
            } else {
                result.innerHTML = '<span class="mig-status--success"><i class="fas fa-check-circle"></i> Exported ' + data.exported + ' papers</span>';
            }
        });
    })
    .catch(err => {
        result.hidden = false;
        result.innerHTML = '<span class="mig-status--danger"><i class="fas fa-times-circle"></i> ' + err.message + '</span>';
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-upload"></i> Export to Zotero (BibTeX)';
    });
}

// Check Connected Papers status on load
(function checkCPStatus() {
    fetch('/apps/scholar/api/library/connected-papers/status/')
        .then(r => r.json())
        .then(data => {
            updateLed('connected-papers', data.available ? 'ready' : 'error');
            const el = document.getElementById('cp-status-indicator');
            if (!el) return;
            if (data.available) {
                el.innerHTML = '<span class="mig-card__hint mig-status--success"><i class="fas fa-check-circle"></i> Connected Papers available</span>';
            } else {
                el.innerHTML = '<span class="mig-card__hint"><i class="fas fa-times-circle"></i> ' + (data.error || 'Not available') + '</span>';
                document.getElementById('cp-import-btn')?.setAttribute('disabled', 'true');
            }
        })
        .catch(() => {
            updateLed('connected-papers', 'error');
            const el = document.getElementById('cp-status-indicator');
            if (el) el.innerHTML = '<span class="mig-card__hint mig-status--danger"><i class="fas fa-exclamation-triangle"></i> Status check failed</span>';
        });
})();

function scholarCPImport() {
    const paperId = document.getElementById('cp-paper-id')?.value?.trim();
    const btn = document.getElementById('cp-import-btn');
    const result = document.getElementById('cp-import-result');
    if (!btn || !result) return;

    if (!paperId) {
        result.hidden = false;
        result.innerHTML = '<span class="mig-status--warning"><i class="fas fa-info-circle"></i> Enter a Semantic Scholar paper ID</span>';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Importing graph...';
    result.hidden = true;

    fetch('/apps/scholar/api/library/connected-papers/import/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value
                || document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '',
        },
        body: JSON.stringify({ paper_id: paperId, output_format: 'papers' }),
    })
    .then(r => r.json())
    .then(data => {
        result.hidden = false;
        if (data.error) {
            result.innerHTML = '<span class="mig-status--danger"><i class="fas fa-times-circle"></i> ' + data.error + '</span>';
        } else {
            const stats = data.stats || {};
            result.innerHTML = '<span class="mig-status--success"><i class="fas fa-check-circle"></i> Imported ' + (data.imported || 0) + ' papers (' + (stats.node_count || 0) + ' in graph)</span>';
        }
    })
    .catch(err => {
        result.hidden = false;
        result.innerHTML = '<span class="mig-status--danger"><i class="fas fa-times-circle"></i> ' + err.message + '</span>';
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-download"></i> Import Graph';
    });
}
</script>
