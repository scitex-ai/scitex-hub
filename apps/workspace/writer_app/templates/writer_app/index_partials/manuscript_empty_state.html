{% load i18n %}
<div id="writer-empty-state" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body text-center p-4 p-md-5">
                    <i class="fas fa-pen-fancy fa-3x text-primary mb-3" aria-hidden="true"></i>
                    <h3 class="mb-3">{% translate "No manuscript yet" %}</h3>
                    <p class="text-muted mb-4">
                        {% translate "This project does not have a Writer manuscript. Create one to start writing with LaTeX." %}
                    </p>
                    <button id="create-manuscript-btn"
                            type="button"
                            class="btn btn-primary btn-lg"
                            data-project-id="{{ project.id }}"
                            data-label-busy="{% translate 'Creating manuscript...' %}"
                            data-label-failed="{% translate 'Could not create the manuscript' %}">
                        <i class="fas fa-plus me-2" aria-hidden="true"></i><span>{% translate "Create manuscript" %}</span>
                    </button>
                    <p id="create-manuscript-error" class="text-danger small mt-3 mb-0" role="alert" hidden></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    var button = document.getElementById('create-manuscript-btn');
    var label = button.querySelector('span');
    var idleLabel = label.textContent;
    var errorLine = document.getElementById('create-manuscript-error');
    button.addEventListener('click', function () {
        button.disabled = true;
        label.textContent = button.dataset.labelBusy;
        errorLine.hidden = true;
        fetch('/apps/writer/api/initialize-workspace/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
            body: JSON.stringify({project_id: Number(button.dataset.projectId)})
        })
        .then(function (response) { return response.json(); })
        .then(function (data) {
            if (data.success) { window.location.reload(); return; }
            throw new Error(data.error || '');
        })
        .catch(function (error) {
            button.disabled = false;
            label.textContent = idleLabel;
            errorLine.textContent = button.dataset.labelFailed + (error.message ? ': ' + error.message : '');
            errorLine.hidden = false;
        });
    });
})();
</script>
