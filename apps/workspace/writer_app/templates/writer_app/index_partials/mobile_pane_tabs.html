{% load i18n %}
<!-- Phone-only pane tabs (hidden >= 768px); logic in ts/_writer/ui/mobile-pane-tabs.ts -->
<div class="writer-mobile-tabs" role="tablist" aria-label="{% translate 'Writer panes' %}">
    <button type="button" class="writer-mobile-tab" role="tab" data-pane="editor" aria-selected="true">
        <i class="fas fa-code" aria-hidden="true"></i>{% translate "Editor" %}
    </button>
    <button type="button" class="writer-mobile-tab" role="tab" data-pane="pdf" aria-selected="false" tabindex="-1">
        <i class="fas fa-file-pdf" aria-hidden="true"></i>PDF
    </button>
    <button type="button" class="writer-mobile-tab" role="tab" data-pane="details" aria-selected="false" tabindex="-1">
        <i class="fas fa-sliders-h" aria-hidden="true"></i>{% translate "Details" %}
    </button>
</div>
