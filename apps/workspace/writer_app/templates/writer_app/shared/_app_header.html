{% load static scitex_project_picker %}
{# Canonical SDK AppHeader primitive (STX-UI108): no leaf-local header tag. #}
<link rel="stylesheet" href="{% static 'scitex_sdk/ui/css/app/app-header.css' %}" />
<link rel="stylesheet" href="{% static 'scitex_sdk/ui/css/app/project-selector.css' %}" />
<div data-stx-app-header data-app-title="SciTeX Writer"></div>
<div id="writer-picker-holder" hidden>{% scitex_project_picker scope="project" current=current_project %}</div>
<script type="module" src="{% static 'scitex_sdk/ui/js/app/app-header.js' %}"></script>
<script type="module">
    // Relocate the server-rendered project picker into the canonical slot.
    // app-header.js auto-mounts on import (deferred, document order), so the
    // header exists by the time this module runs.
    const header = window.stxAppHeader?.get();
    const holder = document.getElementById("writer-picker-holder");
    if (header?.projectSlot && holder) {
        header.projectSlot.replaceChildren(...holder.childNodes);
        holder.remove();
    } else if (holder) {
        holder.hidden = false;
    }
</script>
