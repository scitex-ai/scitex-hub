[project]
name = "scitex-hub"
version = "0.19.0"
description = "SciTeX Hub - Deployment and management CLI for SciTeX"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    {name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rich",
    "click>=8.0",
    # `requests` is a TOP-LEVEL import of the shipped CLI, so it is a runtime
    # dependency, not an optional one. The console script is
    # `scitex_hub._cli.main:main`, and importing it walks:
    #     main.py:22 `from .gitea import gitea`
    #       -> gitea.py:13 `from ._gitea_auth import login, logout`
    #         -> _gitea_auth.py:9 `import requests`
    # (also _gitea_collab, _workspace_auth, _workspace_cmds, _account/_whoami).
    # It used to be declared ONLY in the `all` extra, which had two effects:
    #   1. `pip install scitex-hub` + `scitex-hub --help` raised
    #      ModuleNotFoundError — the CLI could not start from a plain install.
    #   2. The quality-audit job installs `-e ".[dev]"` while pytest-matrix
    #      installs `-e ".[all,dev]"`, so audit-cli could not import the CLI it
    #      grades and reported `not-auditable` — the CLI silently went UNGRADED
    #      on one leg and graded on the other, from the same tree.
    # Measured 2026-08-11: blocking `requests` via a meta_path finder makes
    # `import scitex_hub._cli.main` fail with exactly
    # `ImportError: No module named 'requests'`.
    # Card: hub-audit-cli-runs-only-when-its-deps-happen-to-be-installed-20260809
    "requests>=2.31",
    # 0.2.10 is the first release where `scitex_app.appmaker.init_app`
    # emits the nested-package layout + `[tool.hatch.build.targets.wheel]
    # packages=["<name>"]` block in the generated pyproject (scitex-app
    # PR #35, scitex-cloud PR #293 done-gate). Pre-0.2.10 the canonical
    # CLI path `scitex-hub app init` shadowed our local _scaffold fix
    # with the upstream flat-layout generator, breaking
    # `pip_install_user_app` at install time. (0.2.9 was claimed by an
    # orphan tag for an unrelated earlier release — jumping to 0.2.10.)
    "scitex-app>=0.2.10",
    "scitex-config>=0.3.6",
    # `scitex-session` is consumed via the umbrella as `scitex.session.INJECTED`
    # (settings_shared.py / settings_auth.py / config/routing.py).
    # scitex >= 2.29 lazy-loads `scitex_session` and raises ImportError if
    # the sub-package is missing — but the umbrella's `[session]` extra
    # only declares matplotlib + pyyaml, NOT scitex-session itself
    # (upstream gap, ywatanabe1989/scitex-python). Declare it directly
    # so the import works in any install graph.
    "scitex-session>=0.1.6",
    "scitex-writer>=2.17.2",
    # 0.16.1 is the first release where `audit_all_for_package`
    # honours the HYPHENATED rule-id format that tests/develop/
    # test_audit.py uses (`[PA-307 …]` <- skip_rules=("PA-307",)).
    # Pinning to <0.16.1 silently lets every entry in `skip_rules`
    # leak through — the gate fails on rules we explicitly deferred.
    # NOTE (CLI-standardization slice 6a): the deprecated-alias ladder
    # and spec-built help come from scitex-dev's click_compat/help_spec
    # (scitex-dev#307/#308) which are on develop but NOT in a release
    # yet (latest v0.28.0 predates them). scitex_hub._cli._click_compat
    # guard-imports them (scitex-python#352 pattern); bump this floor to
    # the first release that ships them and drop the fallbacks there.
    #
    # CEILING (<0.39) added 2026-07-29. The comment above already knew this
    # contract is version-sensitive, but bounded it on ONE side only, so any
    # scitex-dev release could redefine hub's gate with no hub change — and
    # one did. Measured, same tree, no diff between the two runs:
    #     10:00  fix/skill-url-prefix-ssot   scitex-dev 0.38.1  -> audit GREEN
    #     10:28  develop (that same code)    scitex-dev 0.40.0  -> audit RED
    # 0.40.0 shells out to `scitex-dev ecosystem audit-all` WITHOUT
    # forwarding skip_rules, so every documented deferral in
    # tests/develop/test_audit.py is silently ignored ("0 declared") and the
    # gate fails on rules we explicitly deferred — the exact failure the
    # comment above predicted, from the other direction.
    # <0.39 not <0.40 deliberately: 0.38.1 is PROVEN green and 0.40.0 PROVEN
    # red, but 0.39.x is UNTESTED — a <0.40 bound would admit a version
    # nobody has run, which is the same "whatever resolves" bug in a smaller
    # box. Raise this ceiling only with a green run behind it.
    # This is a STOPGAP. The durable fix is moving those deferrals into
    # .scitex/dev/config.yaml's `audit.exemptions` block, which the CLI does
    # honour (hub already uses it for PS-224). Until that lands, the next
    # intentional bump re-breaks the lane.
    # Tracked: ci-unpinned-scitex-dev-voids-skip-rules-20260729.
    #
    # CEILING RAISED TO ==0.43.1 on 2026-08-10. The <0.39 ceiling above did
    # its job and is now the thing blocking the work. Read the two paragraphs
    # below before touching this line again.
    #
    # WHAT THE 2026-08-09 REVERT LEFT UNEXPLAINED. That attempt raised the
    # ceiling to <0.44 (resolving 0.43.0), pytest-matrix went red, and the
    # revert recorded the cause as "not understood": §2/§5/§6 were all in
    # SKIP_RULES and the fixture raised anyway. It is understood now, and it
    # was never about §2/§5/§6. Under 0.43.0 the import-budget auditor emits
    # `WARN: [§10w …]` — a warn-tier "COULD NOT MEASURE RELIABLY" notice, not
    # a finding. 0.43.0's classifier counted any bracketed line as a
    # violation, §10w matched no skip rule, and `audit_all_for_package`'s
    # mask guard is `if skipped and not non_skipped` — so ONE notice
    # discarded the entire 151-entry mask and reddened a green tree.
    #
    # 0.43.1 IS THE FIX FOR THAT EXACT INCIDENT, and says so in its own
    # source (scitex_dev/testing/_audit_conformance.py): "Measured 2026-08-09
    # on scitex-hub: one such notice discarded a 151-line skip mask and
    # reddened a green tree." It adds `_NON_VIOLATION_RULES` ({§10, §10w,
    # TALLY, defer}) and `_NON_VIOLATION_LEVELS` ({WARN, INFO, SUCC, NOTE}).
    # Diffed 0.38.1 -> 0.43.1: those two `continue` filters are the ONLY
    # change to the classification loop, so 0.43.1 classifies a strict SUBSET
    # of what 0.38.1 called a violation. It cannot newly redden this gate.
    # The masked-count warning text is unchanged, so test_audit.py's
    # _MASKED_COUNT_RE still parses it.
    #
    # MEASURED HERE, in the environment the revert could not reproduce —
    # `uv pip install -e ".[all,dev]"` exactly as pytest-matrix does, so
    # scitex_hub is importable and audit-cli genuinely RUNS (the revert's
    # venvs had no scitex_hub, audit-cli reported not-auditable, and that is
    # why its numbers were wrong). Same tree, same gate, only the corpus
    # differs:
    #     0.38.1  audit-cli 104 error(s)  151 unmasked  -> FAILED on PS-169
    #     0.43.1  audit-cli   3 error(s)   45 unmasked  -> PASSED, 45 masked
    # The 0.38.1 line reproduces CI run 31348349271 byte-for-byte.
    #
    # WHY PS-169 WAS THE BLOCKER AND WHY THAT IS CORRECT TO RETIRE: in 0.38.1
    # PS-169 is W with a baseline ratchet that escalates NEW violations to E.
    # Every PR in the Spartan migration introduces a new hosted runner by
    # construction, so the ratchet blocks precisely the PRs that comply with
    # the operator's 2026-08-05 ruling
    # (「スパルタンのCIは全面的にやめましょう」). 0.43.1 deletes the ratchet
    # and makes PS-169 a flat advisory W — upstream's words: "A gate that
    # permits the accumulated mess and blocks its correction is worse than no
    # gate." There is no exemption path for PS-169 in any version
    # (`audit.exemptions` is loaded per-check and PS-169 never loads it), so
    # moving the corpus is the only fix that is not a lie.
    #
    # EXACT PIN, NOT A RANGE — deliberately, for the same reason the <0.39
    # ceiling above chose <0.39 over <0.40: a range readmits releases nobody
    # has run, which is the "whatever resolves redefines our gate" bug in a
    # smaller box. 0.43.1 is measured; 0.43.2 is not. Move this pin only with
    # a green pytest-matrix run behind it, and re-measure with `.[all,dev]`
    # installed — a venv without scitex_hub silently skips audit-cli and will
    # tell you everything is fine.
    "scitex-dev==0.43.1",
    "gitpython>=3.1.51",
]

[project.urls]
Homepage = "https://scitex.ai"
Repository = "https://github.com/scitex-ai/scitex-hub"
Documentation = "https://scitex-hub.readthedocs.io"
Issues = "https://github.com/scitex-ai/scitex-hub/issues"
Changelog = "https://github.com/scitex-ai/scitex-hub/blob/main/CHANGELOG.md"

[project.entry-points."scitex_dev.docs"]
scitex-hub = "scitex_hub"

[project.entry-points."scitex_dev.skills"]
scitex-hub = "scitex_hub"

[project.optional-dependencies]
# Project rule: ONLY [all] is a user-facing install target. Sub-extras
# like [django], [gui], [mcp], [test], [docs] used to exist and were
# referenced recursively from [all] (`scitex-hub[django]` etc.), which
# tripped pip's resolver when a recursively-installed dep added a
# conflicting pin (the v0.18.0 release pipeline halted because the
# umbrella `scitex==2.29` pin on `scitex-app==0.2.7` could not be
# reconciled through the recursive `scitex-hub[django]` reference).
# Flattening eliminates the recursion entirely.
#
# [dev] is kept separate — it covers tools needed only for development
# (formatters, linters, dev-only test plugins) and CI installs with
# `pip install -e ".[all,dev]"`.
all = [
    # The board mounted at /apps/cards/ (config/urls.py:173) and the
    # tenancy middleware's `_TODO_INSTALLED` guard both come from this
    # package. Listed here as well as in [dev] because PS-221 §3 requires
    # every requirement of the PUBLIC `dev` extra to be closed under
    # `all` — and because a deployment installing `[all]` genuinely wants
    # the board it mounts.
    "scitex-cards>=0.32.1",
    # --- Django stack (web framework + DRF + auth + ORM + ASGI) ---
    "Django>=5.2.11",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.9",
    "django-extensions>=4.1",
    "django-browser-reload>=1.12",
    "django-axes>=6.3",
    "django-allauth[socialaccount]>=65.14.1",
    "django-oauth-toolkit>=3.0",
    "django-widget-tweaks>=1.5",
    "django-celery-results>=2.5",
    "django-celery-beat>=2.8",
    "psycopg2-binary>=2.9",
    "gunicorn>=21.2",
    "daphne>=4.2.2",
    "channels>=4.3",
    "channels-redis>=4.3",
    # <5.6: the floating pin let the 2026-07-13 image rebuild jump prod onto
    # celery 5.6.3 / kombu 5.6.2, and from the next day every prefork worker
    # on the redis broker stalled after ~2 prefetch windows (reserved full,
    # children alive+idle, zero errors, restart re-wedges after one burst;
    # measured repeatedly on prod 07-14..17). Matches the known upstream
    # stops-consuming family (celery#8091/#8030/#10205) — pin below the 5.6
    # line until a release is verified against the prod acceptance test
    # (a queued vis_queue backlog must drain to zero without the worker
    # going silent).
    "celery[redis]>=5.4,<5.6",
    "kombu<5.6",
    "whitenoise>=6.11",
    # --- HTTP / async server / API ---
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.31",
    # `requests` moved to [project.dependencies] — it is a top-level import of
    # the shipped CLI, not an optional extra. See the comment there.
    "feedparser>=6.0",
    # --- Auth / crypto ---
    "PyJWT>=2.8",
    "cryptography>=48.0.1",
    "python-decouple>=3.8",
    "python-dotenv>=1.0",
    "paramiko>=3.4",
    # --- Container / OS / runtime ---
    "docker>=7.1",
    "psutil>=5.9",
    "playwright>=1.48",
    # --- Billing (Stripe scaffold; endpoints stay 503 until
    # SCITEX_HUB_STRIPE_* env keys are configured) ---
    "stripe>=10.0",
    # --- AI / LLM / domain ---
    "litellm>=1.82.0",
    "impact-factor>=1.1",
    # --- Notebook / docs / rendering ---
    "nbformat>=5.9",
    "nbconvert>=7.17.0",
    "weasyprint>=60.0",
    "pygments",
    # --- Validation ---
    "pydantic<2.12",
    # --- SciTeX umbrella (Django-settings imports `import scitex as stx`
    # for `@stx.session` / `stx.session.INJECTED` / `@stx.module`, so
    # this is a hard runtime requirement, not an optional sibling.) ---
    # scitex 2.29.3 restored sane `>=` pins for sub-packages (the broken
    # `scitex-config==0.3.3` exact-pin on 2.29.0/2.29.1 was the original
    # ResolutionImpossible — see scitex-python#282, resolved). Floor at
    # 2.29.3 to skip the broken 2.29.0/2.29.1 entirely.
    "scitex>=2.29.3",
    # >=0.6.1: 0.6.0 never shipped middleware.py (merged after that release
    # was cut) and anything older is sync-only, deadlocking daphne under
    # ASGI. See scitex-ui PR #59 and settings_shared.py's MIDDLEWARE entry.
    "scitex-ui>=0.6.1",
    # --- GUI (dearpygui-based modules) ---
    "dearpygui>=1.11",
    "cairosvg>=2.9.0",
    "Pillow>=12.1.1",
    # --- MCP server surface ---
    "fastmcp>=2.0.0",
    "pyyaml>=6.0",
    # --- Test runtime (kept here, not [dev], because some tests run
    # against the deployed app inside the container) ---
    "pytest>=8.4",
    "pytest-django>=4.5",
    "pytest-playwright>=0.7",
    "pytest-base-url>=2.1",
    "pytest-asyncio>=1.2",
    # pytest-matrix workflow runs `pytest --cov=src/scitex_hub
    # --cov-report=xml --cov-report=term` and uploads to Codecov — the
    # plugin must be in the install graph, otherwise pytest exits 4 on
    # "unrecognized arguments: --cov".
    "pytest-cov>=4.1",
    # e2e-mobile.yml passes `--timeout=120` to cap individual Playwright
    # tests — the flag is provided by pytest-timeout, not core pytest.
    # Without this dep pytest exits 4 with "unrecognized arguments:
    # --timeout=120".
    "pytest-timeout>=2.0",
    # --- Sphinx docs build (run by CI on tag) ---
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
dev = [
    "black>=23.0",
    "ruff>=0.1.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "figrecipe>=0.13.0",
    "joblib",
    "flask",
    # PS-210: `[all]` ships these and the test suite imports them
    # unguarded, so a fresh `pip install -e .[dev]` must include them too
    # to be self-sufficient (no `pytest.importorskip` dance).
    "channels>=4.3",
    "fastmcp>=2.0.0",
    "scitex>=2.29.3",
    # django-celery-beat is in INSTALLED_APPS (settings_shared.py), so
    # Django cannot even start without it — every Django test fails at
    # setup, not at some optional import. Matching [all]'s spec.
    "django-celery-beat>=2.8",
    # scitex-dev provides the `audit-all` corpus the release gate runs.
    # 0.16.1 is the first release where `audit_all_for_package`
    # honours the HYPHENATED rule-id format that tests/develop/
    # test_audit.py uses (`[PA-307 …]` <- skip_rules=("PA-307",)).
    # Pinning to <0.16.1 silently lets every entry in `skip_rules`
    # leak through — the gate fails on rules we explicitly deferred.
    # PINNED ==0.43.1 — see the matching pin in [project.dependencies] for the
    # measurement. THIS is the pin pytest-matrix installs (`-e ".[all,dev]"`),
    # so this is the one that decides the three required checks; the audit
    # workflow's own pin cannot substitute for it. Keep the two identical.
    "scitex-dev==0.43.1",
    # The board-tenancy suite is guarded by `_TODO_INSTALLED`
    # (middleware.py:115, find_spec("scitex_cards")). Without this package
    # installed, every one of those tests SKIPS and the job exits 0 — a
    # green check over an unrun suite. Measured 2026-08-09: the whole
    # tenancy contract suite reported "8 skipped", exit 0, in an
    # environment where the middleware was byte-identical to prod's.
    # Those tests exist to stop the ?store= tenancy channel being deleted;
    # skipped, they protect nothing while reading as protection.
    # Same rationale as the PS-210 block above.
    "scitex-cards>=0.32.1",
]

[project.scripts]
scitex-hub = "scitex_hub._cli.main:main"
scitex-hub-mcp = "scitex_hub._mcp_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_hub = ["skills/*.md", "skills/references/*.md", "_skills/**/*.md"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py311']
extend-exclude = '''
/(
  # Exclude HTML files - use djlint instead
  .*\.html$
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

# Exclude Django template files from Ruff
extend-exclude = [
    "*.html",
    "*/templates/**",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.djlint]
indent = 4
profile = "django"
max_line_length = 120
max_attribute_length = 80
format_css = true
format_js = false
close_void_tags = true
blank_line_after_tag = "load,extends"
ignore = "H006,H030,H031"
include = "H017,H035"
use_gitignore = true
linter_output_format = "{filename}:{line}: {message} ({code})"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
DJANGO_SETTINGS_MODULE = "config.settings.settings_dev"
norecursedirs = ["data", "docs", "scripts", "static", "deployment", "node_modules", ".git", "__pycache__", "*.egg-info", ".dev"]
# Global addopts intentionally exclude browser/E2E flags
# (--browser/--headed/--slowmo/--video/--screenshot). Those launch a
# headed Playwright browser and break the headless release gate
# (`pytest tests/ -x`). E2E tests are marked `@pytest.mark.e2e` and the
# browser flags are passed explicitly by the "E2E Mobile Tests" workflow.
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--capture=no",
]
markers = [
    "e2e: End-to-end tests using browser automation",
    "slow: Tests that take a long time to run",
    "auth: Authentication and authorization tests",
    "user: User management tests",
    "integration: Integration tests",
    "django_db: Tests requiring database access (pytest-django)",
    "security: Exploit-regression tests for confirmed security findings",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestConfigWarning",
]
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
parallel = true
source = ["scitex_hub"]
concurrency = ["multiprocessing", "thread"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.scitex-linter]
# Django project: standard library `logging` is used throughout.
# STX-I007 warns to use @stx.session-injected `logger` instead, which
# does not apply to Django views/services that have no @stx.session context.
disable = ["STX-I007"]
library_dirs = ["src", "tests", "examples", "apps", "lib", "config"]

[tool.uv.extra-build-dependencies]
# sktime==0.8.1 needs pkg_resources at build time but doesn't declare it.
# pkg_resources is provided by setuptools. This injects it into uv's build isolation.
sktime = ["setuptools"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
