[project]
name = "scitex-cloud"
version = "0.6.2-alpha"
description = "SciTeX Cloud - Deployment and management CLI for SciTeX"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
authors = [
    {name = "SciTeX Team", email = "contact@scitex.ai"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
scitex-cloud = "scitex_cloud.cli.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py311']
extend-exclude = '''
/(
  # Exclude HTML files - use djlint instead
  .*\.html$
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

# Exclude Django template files from Ruff
extend-exclude = [
    "*.html",
    "*/templates/**",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.djlint]
indent = 4
profile = "django"
max_line_length = 120
format_css = true
format_js = true
