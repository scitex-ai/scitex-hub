[project]
name = "scitex-hub"
version = "0.18.0"
description = "SciTeX Hub - Deployment and management CLI for SciTeX"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    {name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rich",
    "click>=8.0",
    "scitex-app>=0.1.0",
    "scitex-config>=0.3.0",
    "scitex-writer>=2.14.0",
    "scitex-dev>=0.11.5",
    "gitpython>=3.1",
]

[project.urls]
Homepage = "https://scitex.ai"
Repository = "https://github.com/ywatanabe1989/scitex-hub"
Documentation = "https://scitex-hub.readthedocs.io"
Issues = "https://github.com/ywatanabe1989/scitex-hub/issues"
Changelog = "https://github.com/ywatanabe1989/scitex-hub/blob/main/CHANGELOG.md"

[project.entry-points."scitex_dev.docs"]
scitex-hub = "scitex_hub"

[project.entry-points."scitex_dev.skills"]
scitex-hub = "scitex_hub"

[project.optional-dependencies]
django = [
    "Django>=5.2",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.9",
    "django-extensions>=4.1",
    "django-browser-reload>=1.12",
    "djangorestframework-simplejwt>=5.3",
    "psycopg2-binary>=2.9",
    "gunicorn>=21.2",
    "daphne>=4.1",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "django-axes>=6.3",
    "python-decouple>=3.8",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "django-allauth[socialaccount]>=65.3",
    "django-oauth-toolkit>=3.0",
    "requests>=2.31",
    "feedparser>=6.0",
    "playwright>=1.48",
    "docker>=7.1",
    "paramiko>=3.4",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "whitenoise>=6.11",
    "channels>=4.3",
    "channels-redis>=4.3",
    "celery[redis]>=5.4",
    "django-celery-results>=2.5",
    "django-celery-beat>=2.8",
    "django-widget-tweaks>=1.5",
    "pygments",
    "litellm>=1.0",
    "impact-factor>=1.1",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "weasyprint>=60.0",
    "pydantic<2.12",
    "scitex-ui>=0.2.0",
    # The umbrella `scitex` package is imported at Django-settings load
    # time (`config/routing.py` and `config/settings/settings_*.py` do
    # `import scitex as stx`), so it's a hard runtime requirement for
    # the Django stack — not just a sibling dev tool. Without this,
    # `pytest tests/` halts in pytest-django with
    # `ImportError: No module named 'scitex'` before any test runs.
    "scitex>=2.29",
]
gui = [
    "dearpygui>=1.11",
    "cairosvg>=2.7",
    "Pillow>=10.0",
]
mcp = [
    "fastmcp>=2.0.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]
test = [
    "pytest>=8.4",
    "pytest-django>=4.5",
    "pytest-playwright>=0.7",
    "pytest-base-url>=2.1",
    "pytest-asyncio>=1.2",
]
dev = [
    "black>=23.0",
    "celery",
    "celery[redis]>=5.4",
    "channels-redis>=4.3",
    "channels>=4.3",
    "cryptography>=42.0",
    "daphne>=4.1",
    "django-allauth[socialaccount]>=65.3",
    "django-axes>=6.3",
    "django-browser-reload>=1.12",
    "django-celery-beat>=2.8",
    "django-celery-results>=2.5",
    "django-cors-headers>=4.9",
    "django-extensions>=4.1",
    "django-oauth-toolkit>=3.0",
    "django-widget-tweaks>=1.5",
    "Django>=5.2",
    "djangorestframework-simplejwt>=5.3",
    "djangorestframework>=3.16",
    "docker>=7.1",
    "fastapi>=0.109",
    "fastmcp>=2.0.0",
    "feedparser>=6.0",
    "figrecipe>=0.13.0",
    "flask",
    "gunicorn>=21.2",
    "impact-factor>=1.1",
    "joblib",
    "litellm>=1.0",
    "nbconvert>=7.0",
    "nbformat>=5.9",
    "paramiko>=3.4",
    "playwright>=1.48",
    "psutil>=5.9",
    "psycopg2-binary>=2.9",
    "pydantic<2.12",
    "pygments",
    "PyJWT>=2.8",
    "pytest-asyncio>=1.2",
    "pytest-base-url>=2.1",
    "pytest-django>=4.5",
    "pytest-playwright>=0.7",
    "pytest>=7.0",
    "python-decouple>=3.8",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "ruff>=0.1.0",
    "scitex-ui>=0.2.0",
    "uvicorn[standard]>=0.27",
    "weasyprint>=60.0",
    "whitenoise>=6.11",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-hub[django]",
    "scitex-hub[gui]",
    "scitex-hub[mcp]",
    "scitex-hub[test]",
]

[project.scripts]
scitex-hub = "scitex_hub._cli.main:main"
scitex-hub-mcp = "scitex_hub._mcp_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_hub = ["skills/*.md", "skills/references/*.md", "_skills/**/*.md"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py311']
extend-exclude = '''
/(
  # Exclude HTML files - use djlint instead
  .*\.html$
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

# Exclude Django template files from Ruff
extend-exclude = [
    "*.html",
    "*/templates/**",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.djlint]
indent = 4
profile = "django"
max_line_length = 120
max_attribute_length = 80
format_css = true
format_js = false
close_void_tags = true
blank_line_after_tag = "load,extends"
ignore = "H006,H030,H031"
include = "H017,H035"
use_gitignore = true
linter_output_format = "{filename}:{line}: {message} ({code})"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
DJANGO_SETTINGS_MODULE = "config.settings.settings_dev"
norecursedirs = ["data", "docs", "scripts", "static", "deployment", "node_modules", ".git", "__pycache__", "*.egg-info", ".dev"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--capture=no",
    "--browser=chromium",
    "--headed",
    "--slowmo=50",
    "--video=retain-on-failure",
    "--screenshot=only-on-failure",
]
markers = [
    "e2e: End-to-end tests using browser automation",
    "slow: Tests that take a long time to run",
    "auth: Authentication and authorization tests",
    "user: User management tests",
    "integration: Integration tests",
    "django_db: Tests requiring database access (pytest-django)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestConfigWarning",
]
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
parallel = true
source = ["scitex_hub"]
concurrency = ["multiprocessing", "thread"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.scitex-linter]
# Django project: standard library `logging` is used throughout.
# STX-I007 warns to use @stx.session-injected `logger` instead, which
# does not apply to Django views/services that have no @stx.session context.
disable = ["STX-I007"]
library_dirs = ["src", "tests", "examples", "apps", "lib", "config"]

[tool.uv.extra-build-dependencies]
# sktime==0.8.1 needs pkg_resources at build time but doesn't declare it.
# pkg_resources is provided by setuptools. This injects it into uv's build isolation.
sktime = ["setuptools"]
