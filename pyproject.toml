[project]
name = "scitex-cloud"
version = "0.9.1-alpha"
description = "SciTeX Cloud - Deployment and management CLI for SciTeX"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    {name = "SciTeX Team", email = "contact@scitex.ai"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://scitex.ai"
Repository = "https://github.com/ywatanabe1989/scitex-cloud"
Documentation = "https://scitex-cloud.readthedocs.io"
Issues = "https://github.com/ywatanabe1989/scitex-cloud/issues"
Changelog = "https://github.com/ywatanabe1989/scitex-cloud/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
django = [
    # Django core
    "Django>=5.2",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.9",
    "django-extensions>=4.1",
    "django-browser-reload>=1.12",
    "djangorestframework-simplejwt>=5.3",
    # Database
    "psycopg2-binary>=2.9",
    # Server
    "gunicorn>=21.2",
    "daphne>=4.1",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    # Security
    "django-axes>=6.3",
    "python-decouple>=3.8",
    # Authentication
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "django-allauth[socialaccount]>=65.3",
    # Integrations
    "requests>=2.31",
    "feedparser>=6.0",
    # Browser automation
    "playwright>=1.48",
    # Container management
    "docker>=7.1",
    "paramiko>=3.4",
    # Utilities
    "python-dotenv>=1.0",
    "whitenoise>=6.11",
    # WebSocket support
    "channels>=4.3",
    "channels-redis>=4.3",
    # Task queue
    "celery[redis]>=5.4",
    "django-celery-results>=2.5",
    "django-celery-beat>=2.8",
    "flower>=2.0",
    # UI utilities
    "django-widget-tweaks>=1.5",
    # Language detection
    "pygments",
    # Journal impact factors
    "impact-factor>=1.1",
    # Jupyter support
    "nbformat>=5.9",
    "nbconvert>=7.0",
    # PDF generation
    "weasyprint>=60.0",
]
test = [
    "pytest>=8.4",
    "pytest-playwright>=0.7",
    "pytest-base-url>=2.1",
    "pytest-asyncio>=1.2",
]
gui = [
    "dearpygui>=1.11",
    "cairosvg>=2.7",
    "Pillow>=10.0",
]
mcp = [
    "fastmcp>=0.4",
    "requests>=2.31",
    "pyyaml>=6.0",
]
all = [
    "scitex-cloud[django,test,gui,dev,mcp]",
]

[project.scripts]
scitex-cloud = "scitex_cloud.cli.main:main"
scitex-cloud-mcp = "scitex_cloud.mcp_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py311']
extend-exclude = '''
/(
  # Exclude HTML files - use djlint instead
  .*\.html$
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

# Exclude Django template files from Ruff
extend-exclude = [
    "*.html",
    "*/templates/**",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.djlint]
indent = 4
profile = "django"
max_line_length = 120
max_attribute_length = 80
format_css = true
format_js = false
close_void_tags = true
blank_line_after_tag = "load,extends"
ignore = "H006,H030,H031"
include = "H017,H035"
use_gitignore = true
linter_output_format = "{filename}:{line}: {message} ({code})"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--capture=no",
    "--browser=chromium",
    "--headed",
    "--slowmo=50",
    "--video=retain-on-failure",
    "--screenshot=only-on-failure",
]
markers = [
    "e2e: End-to-end tests using browser automation",
    "slow: Tests that take a long time to run",
    "auth: Authentication and authorization tests",
    "user: User management tests",
    "integration: Integration tests",
    "django_db: Tests requiring database access (pytest-django)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestConfigWarning",
]
log_cli = true
log_cli_level = "INFO"
