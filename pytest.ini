[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pytest options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --capture=no
    # Playwright options - headed by default for visual feedback
    --browser chromium
    --headed
    --slowmo 50
    --video retain-on-failure
    --screenshot only-on-failure
    # Skip already passed tests (use --testmon to enable)
    # Run with: pytest --testmon (to skip unchanged tests)
    # Run with: pytest --testmon-nocollect (to just collect without testmon)
    # Run with: pytest (normal run, all tests)

# Markers
markers =
    e2e: End-to-end tests using browser automation
    slow: Tests that take a long time to run
    auth: Authentication and authorization tests
    user: User management tests
    integration: Integration tests

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestConfigWarning

# Test output
console_output_style = progress
log_cli = true
log_cli_level = INFO
