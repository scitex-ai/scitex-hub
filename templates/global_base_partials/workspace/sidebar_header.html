<!-- Unified sidebar header for all workspace modules (writer, scholar, vis, console, verifier, hub, files, tools, explorer) -->
<div class="sidebar-header">
    <div class="sidebar-header-actions">
        <button class="hidden-files-toggle"
                id="hidden-files-toggle"
                title="Toggle hidden files">
            <i class="fas fa-eye-slash"></i>
        </button>
        <!-- Module filter buttons: W S V C R H F T E -->
        <div class="module-filter-buttons" id="module-filter-buttons">
            <button class="module-filter-btn" data-mode="writer" title="Writer files (Alt+W)">W</button>
            <button class="module-filter-btn" data-mode="scholar" title="Scholar files (Alt+S)">S</button>
            <button class="module-filter-btn" data-mode="vis" title="Visualizer files (Alt+V)">V</button>
            <button class="module-filter-btn" data-mode="code" title="Console files (Alt+C)">C</button>
            <button class="module-filter-btn" data-mode="verifier" title="Verifier files (Alt+R)">R</button>
            <button class="module-filter-btn" data-mode="hub" title="Hub files (Alt+H)">H</button>
            <button class="module-filter-btn" data-mode="files" title="Files view (Alt+F)">F</button>
            <button class="module-filter-btn" data-mode="tools" title="Tools view (Alt+T)">T</button>
            <button class="module-filter-btn" data-mode="explorer" title="Explorer view (Alt+E)">E</button>
        </div>
        <span class="sidebar-header-divider"></span>
    </div>
    <button id="sidebar-toggle"
            class="sidebar-toggle panel-toggle-btn left-panel-toggle"
            title="Toggle sidebar (Zen: F11/Alt+Z)">
        <i class="fas fa-chevron-left"></i>
    </button>
</div>
