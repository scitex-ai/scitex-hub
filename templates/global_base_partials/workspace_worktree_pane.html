{% load static tree_preseed %}

{% if user.is_authenticated %}
    <div class="ws-worktree-pane" id="ws-worktree-pane">
        <div class="stx-shell-sidebar" id="ws-worktree-sidebar">
            <div id="ws-worktree-resizer"
                 class="h-resizer h-resizer--shell"
                 data-h-resizer
                 data-left="#ws-worktree-sidebar"
                 data-right=".ws-module-pane"
                 data-most-left
                 data-threshold="48"
                 data-storage-key="ws-worktree-width"
                 data-external-toggle="ws-worktree-toggle"></div>
            <div class="stx-shell-sidebar__header">
                <button class="panel-toggle-btn" id="ws-worktree-toggle" title="Toggle file tree">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <span class="stx-shell-sidebar__title" title="Files"><i class="fas fa-folder"></i> Files</span>
                <span class="stx-shell-sidebar__title-full">
                    <i class="fas fa-folder-open"></i>
                    {% if current_project %}
                        {{ current_project.owner.username }}/{{ current_project.slug }}
                    {% else %}
                        Files
                    {% endif %}
                </span>
                <div class="stx-shell-sidebar__header-actions ws-worktree-actions">
                    <button class="scitex-ai-action-btn"
                            title="Keyboard Shortcuts"
                            onclick="window.showShortcutsModal()">
                        <i class="fas fa-keyboard"></i>
                    </button>
                </div>
            </div>
            <div class="stx-shell-sidebar__content ws-worktree-split">
                <div class="ws-worktree-tree-area">
                    {% if current_project %}
                        {% tree_preseed_script current_project %}
                    {% endif %}
                    <div id="ws-worktree-tree"
                         data-workspace-tree
                         {% if current_project %} data-project-id="{{ current_project.id }}" data-project-slug="{{ current_project.slug }}" data-username="{{ current_project.owner.username }}" {% endif %}>
                    </div>
                </div>
                <!-- Vertical resizer: tree / repo monitor split -->
                <div class="v-resizer"
                     id="repo-monitor-resizer"
                     data-v-resizer
                     data-in-app
                     data-top=".ws-worktree-tree-area"
                     data-bottom=".ws-repo-monitor-area"
                     data-most-bottom
                     data-threshold="48"
                     data-storage-key="ws-repo-monitor-split"></div>
                <!-- Repository Monitor -->
                <div class="ws-repo-monitor-area collapsed"
                     id="ws-repo-monitor"
                     {% if current_project %}data-project-id="{{ current_project.id }}"{% endif %}>
                    <div class="repo-monitor-header" id="repo-monitor-header">
                        <i class="fas fa-clock-rotate-left"></i>
                        <span>Recent</span>
                        <span class="repo-monitor-status" id="repo-monitor-status"></span>
                        <span class="repo-monitor-toolbar">
                            <button id="repo-monitor-config-toggle" class="rm-toolbar-btn" title="Filter settings">
                                <i class="fas fa-gear"></i>
                            </button>
                            <button id="repo-monitor-pause-toggle"
                                    class="rm-toolbar-btn"
                                    title="Pause/resume monitor">
                                <i class="fas fa-pause"></i>
                            </button>
                            <button id="repo-monitor-clear" class="rm-toolbar-btn" title="Clear feed">
                                <i class="fas fa-trash-can"></i>
                            </button>
                        </span>
                    </div>
                    <div class="repo-monitor-content" id="repo-monitor-feed"></div>
                </div>
            </div>
        </div>
    </div>
{% endif %}
