{% load module_icons %}

{% if user.is_authenticated %}
    <script>
    window.SCITEX_MODULE_COLORS = {
      {% for mod in workspace_modules %}{% if mod.accent_color %}"{{ mod.name }}": "{{ mod.accent_color }}",{% endif %}{% endfor %}
    };
    </script>
    <div class="ws-apps-pane" id="ws-apps-pane">
        <div id="ws-apps-sidebar">
            <div id="ws-apps-resizer"
                 class="h-resizer h-resizer--shell"
                 data-h-resizer
                 data-left="#ws-apps-sidebar"
                 data-right="#scitex-ai-panel"
                 data-most-right
                 data-threshold="56"
                 data-storage-key="ws-apps-width"></div>
            <nav class="stx-shell-sidebar__content selector-nav ws-apps-nav"
                 id="ws-app-selector"
                 data-indicator="right"
                 data-workspace-modules="{{ workspace_module_names_csv }}">
                {% for mod in workspace_modules %}
                    <a href="{{ mod.get_url }}"
                       class="selector-nav-item ws-apps-nav-item module-tab-btn{% if mod.is_active %} active{% endif %}"
                       data-module="{{ mod.name }}"
                       aria-label="{{ mod.label }}"
                       title="{{ mod.label }}"
                       data-app-accent="{{ mod.name }}">
                        {% module_icon mod.name "tab" mod.version mod.icon_fa mod.is_dev %}
                        <span class="selector-nav-label ws-apps-nav-label">{{ mod.label }}</span></a>
                {% endfor %}
            </nav>
        </div>
    </div>
{% endif %}
