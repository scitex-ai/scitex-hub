{% load module_icons %}

{% if user.is_authenticated %}
    <script>
    window.SCITEX_MODULE_COLORS = {
      {% for mod in workspace_modules %}{% if mod.accent_color %}"{{ mod.name }}": "{{ mod.accent_color }}",{% endif %}{% endfor %}
    };
    </script>
    <div class="ws-apps-pane" id="ws-apps-pane">
        <div id="ws-apps-sidebar">
            <div id="ws-apps-resizer"
                 class="panel-resizer"
                 data-panel-resizer
                 data-target="#ws-apps-sidebar"
                 data-direction="left"
                 data-min-width="56"
                 data-default-width="56"
                 data-fixed-width
                 data-storage-key="ws-apps-width"
                 style="position:absolute;
                        right:0;
                        top:0;
                        bottom:0;
                        z-index:1"></div>
            <nav class="sidebar-content ws-apps-nav"
                 data-workspace-modules="{{ workspace_module_names_csv }}">
                {% for mod in workspace_modules %}
                    <a href="/{{ mod.name }}/"
                       class="ws-apps-nav-item module-tab-btn{% if mod.is_active %} active{% endif %}"
                       data-module="{{ mod.name }}"
                       aria-label="{{ mod.label }}"
                       title="{{ mod.label }}"
                       data-module-accent="{{ mod.name }}"
                       {% if mod.accent_color %}style="--module-accent-color: {{ mod.accent_color }}"{% endif %}>{% module_icon mod.name %}<span class="ws-apps-nav-label">{{ mod.label }}</span></a>
                {% endfor %}
            </nav>
        </div>
    </div>
{% endif %}
