{% load static vite %}

<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description"
      content="{% block meta_description %}{{ META_DESCRIPTION_DEFAULT }}{% endblock %}" />
<!-- Inline theme application - Prevents flash of unstyled content.
     Base default is DARK (operator mandate, card
     hub-theme-default-must-be-dark): first visits render dark on every
     viewport; only an explicit stored choice or a registered user's
     saved preference (applied later by theme-switcher.ts) may differ.
     prefers-color-scheme is deliberately not consulted — an OS light
     preference must never flip a first visit to light. -->
<script>
    (function() {
        const theme = localStorage.getItem("scitex-theme-preference") || "dark";
        if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.setAttribute("data-color-mode", "dark");
        } else {
            document.documentElement.setAttribute("data-theme", "light");
            document.documentElement.setAttribute("data-color-mode", "light");
        }
    })();
</script>
<!-- Console Logger (Development Only) - Captures browser console to ./logs/console.log -->
{% vite_script 'shared/utils/console-interceptor' %}
<!-- PWA service worker registration -->
{% vite_script 'shared/utils/pwa-register' %}
<!--
  Favicon: the SAME SciTeX brand mark in a per-ENVIRONMENT colour, so prod /
  staging / dev are distinguishable from the tab icon alone.
      production  -> white snake on NAVY   (official product look)
      staging     -> NAVY snake on WHITE   (heavy / high-contrast)
      development -> white snake on GREEN
  Resolved from settings.SCITEX_ENV in config/branding.py (NOT from DEBUG,
  which is a debug flag, not an environment) and published as SCITEX_FAVICON
  by config.context_processors.scitex_env. This is the ONLY place the tab icon
  is declared -- see global_head_styles.html.
-->
<link rel="icon" type="image/svg+xml" href="{% static SCITEX_FAVICON %}" />
<link rel="shortcut icon" type="image/svg+xml" href="{% static SCITEX_FAVICON %}" />
<link rel="alternate icon" type="image/svg+xml" href="{% static SCITEX_FAVICON %}" />
<!-- PWA -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0d1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SciTeX" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon"
      href="{% static 'shared/images/favicons/apple-touch-icon.png' %}?v=2" />
{% if user.is_authenticated %}
    <meta name="user-registration-date" content="{{ user.date_joined|date:'c' }}" />
{% endif %}
<!-- Open Graph / Facebook -->
<meta property="og:type" content="{% block og_type %}website{% endblock %}" />
<meta property="og:url" content="{% block og_url %}https://scitex.ai/{% endblock %}" />
<meta property="og:title" content="{% block og_title %}{{ OG_TITLE }}{% endblock %}" />
<meta property="og:description"
      content="{% block og_description %}{{ OG_DESCRIPTION }}{% endblock %}" />
<meta property="og:image"
      content="{% block og_image %}https://scitex.ai/static/shared/images/scitex-og-image.png{% endblock %}" />
<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@SciTeX_AI" />
<meta name="twitter:url"
      content="{% block twitter_url %}https://scitex.ai/{% endblock %}" />
<meta name="twitter:title"
      content="{% block twitter_title %}{{ OG_TITLE }}{% endblock %}" />
<meta name="twitter:description"
      content="{% block twitter_description %}{{ OG_DESCRIPTION }}{% endblock %}" />
<meta name="twitter:image"
      content="{% block twitter_image %}https://scitex.ai/static/shared/images/scitex-og-image.png{% endblock %}" />
<!-- Umami Analytics (privacy-focused, no cookies) -->
{% if UMAMI_WEBSITE_ID %}
    <script defer
            src="{{ UMAMI_SCRIPT_URL|default:'https://cloud.umami.is/script.js' }}"
            data-website-id="{{ UMAMI_WEBSITE_ID }}"></script>
{% endif %}
