<!-- Inline handler: the mobile hamburger must work even if the Vite JS
     bundle fails to load (2026-07-08 iPhone field report: hamburger dead on
     the cookie-consent page). Same failure mode the visitor-menu and
     badge-popover inline fallbacks in global_header.html already guard
     against. header.ts checks data-inline-handler and skips its own wiring,
     so a healthy bundle never double-toggles the menu.

     Behaviour (2026-09-14, iPhone standalone-PWA report): the header stays
     visible above the sheet and the hamburger turns into the close control.
     The sheet closes on the close control, on Escape and on choosing an entry;
     aria-expanded and aria-label follow the state, and closing hands focus back
     to the hamburger. The sheet's top is measured from the header's real
     bottom edge, so an iOS status-bar inset can never slide it under the
     header again. -->
<!-- hook-bypass: inline-script — primary mobile nav must not depend on Vite -->
<script>
(function() {
    var btn = document.getElementById('mobile-hamburger-btn');
    var menu = document.getElementById('mobile-header-menu');
    if (!btn || !menu) return;
    btn.setAttribute('data-inline-handler', 'true');
    var header = btn.closest('.global-header');
    var labelOpen = btn.getAttribute('data-label-open') || 'Open menu';
    var labelClose = btn.getAttribute('data-label-close') || 'Close menu';

    function isOpen() {
        return menu.classList.contains('open');
    }
    function setState(open) {
        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.setAttribute('aria-label', open ? labelClose : labelOpen);
        var icon = btn.querySelector('i');
        if (icon) icon.className = open ? 'fas fa-times' : 'fas fa-bars';
        if (open && header) {
            var bottom = header.getBoundingClientRect().bottom;
            if (bottom > 0) menu.style.top = bottom + 'px';
        }
    }
    function close(returnFocus) {
        if (!isOpen()) return;
        setState(false);
        if (returnFocus) btn.focus();
    }

    btn.addEventListener('click', function(e) {
        e.stopPropagation(); // keep header collapse handlers out of it
        // This inline listener registers during HTML parse, BEFORE any
        // (deferred) module bundle runs. Stop later-registered listeners:
        // a STALE deployed header.js (predating the data-inline-handler
        // guard) would otherwise toggle the menu a second time per tap,
        // closing it again instantly — the exact dead-UI failure this
        // fallback exists to prevent.
        e.stopImmediatePropagation();
        setState(!isOpen());
    });
    // Choosing an entry closes the menu (focus follows the navigation).
    menu.querySelectorAll('a.mobile-menu-item').forEach(function(link) {
        link.addEventListener('click', function() {
            close(false);
        });
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isOpen()) close(true);
    });
    window.addEventListener('resize', function() {
        if (isOpen()) setState(true);
    });
    // Menu buttons are handled by their owning components. Links close as
    // navigation begins; Escape closes and restores focus to the hamburger.
})();
</script>
