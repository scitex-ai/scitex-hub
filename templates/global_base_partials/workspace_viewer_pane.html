{% if user.is_authenticated %}
    <!-- Monaco Editor CSS (editor JS loaded by monaco-loader.ts) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css" />
    <div class="ws-viewer-pane" id="ws-viewer-pane">
        <div class="workspace-sidebar collapsed"
             id="ws-viewer-sidebar"
             data-ai-hint="General Editor Pane: shared file viewer across all modules (Writer, Scholar, Console, etc.). Supports text (.py .js .ts .html .css .json .md .yaml .sh .tex .bib .txt), images (.png .jpg .gif .webp .svg), PDF (.pdf), tables (.csv .tsv), diagrams (.mmd .mermaid), audio (.mp3 .wav .ogg .flac), video (.mp4 .webm .avi .mov). Open files via ui_action(steps=[{action:'open-file', path:'relative/path'}]). The currently open file path is tracked in data-ai-viewer-active on this element."
             data-ai-viewer-active="">
            <div id="ws-viewer-resizer"
                 class="panel-resizer"
                 data-panel-resizer
                 data-target="#ws-viewer-sidebar"
                 data-direction="left"
                 data-min-width="48"
                 data-default-width="480"
                 data-storage-key="ws-viewer-width"
                 data-collapse-key="ws-viewer-collapsed"
                 data-toggle-btn="ws-viewer-toggle"
                 style="position:absolute;
                        right:0;
                        top:0;
                        bottom:0;
                        z-index:1"></div>
            <div class="sidebar-header">
                <button class="panel-toggle-btn" id="ws-viewer-toggle" title="Toggle viewer">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <span class="sidebar-title" title="Viewer"><i class="fas fa-eye"></i> Viewer</span>
                <span class="sidebar-title-full"><i class="fas fa-eye"></i> Viewer</span>
                <div class="sidebar-header-actions ws-viewer-header-actions">
                    <div id="ws-viewer-tabs" class="ws-viewer-tabs"></div>
                    <button id="ws-viewer-mode-toggle"
                            class="ws-viewer-mode-toggle-btn"
                            style="display:none"
                            title="Toggle Edit/Preview (double-click)">
                        <i class="fas fa-eye"></i>
                    </button>
                    <button class="ws-viewer-formats-info-btn"
                            data-tooltip="Supported formats:&#10;Text: .py .js .ts .html .css .json .md .yaml .sh .tex .bib .txt&#10;Image: .png .jpg .jpeg .gif .webp .svg .bmp .ico&#10;PDF: .pdf&#10;Table: .csv .tsv&#10;Diagram: .mmd .mermaid .dot .gv&#10;Audio: .mp3 .wav .ogg .flac .m4a .aac .wma&#10;Video: .mp4 .webm .avi .mov .mkv .ogv"
                            title="">
                        <i class="fas fa-info-circle"></i>
                    </button>
                    <button class="ws-viewer-shortcuts-btn"
                            title="Keyboard shortcuts (Alt+/)"
                            onclick="window.toggleShortcutsModal && window.toggleShortcutsModal()">
                        <i class="fas fa-keyboard"></i>
                    </button>
                </div>
            </div>
            <div class="sidebar-content ws-viewer-body">
                <div id="ws-viewer-content" class="ws-viewer-content">
                    <div id="ws-viewer-monaco" class="ws-viewer-monaco" style="display:none"></div>
                    <div id="ws-viewer-preview" class="ws-viewer-preview" style="display:none"></div>
                    <div id="ws-viewer-media" class="ws-viewer-media" style="display:none"></div>
                    <div id="ws-viewer-empty" class="ws-viewer-empty">
                        <i class="fas fa-file-alt"></i>
                        <span>Click a file to open</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endif %}
