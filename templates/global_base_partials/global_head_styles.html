{% load static %}

<!-- Favicon alternate icon (conditional based on DEBUG) -->
{% if DEBUG %}
    <link rel="alternate icon"
          href="{% static 'shared/images/favicons/favicon-dev.svg' %}?v=7" />
{% else %}
    <link rel="alternate icon"
          href="{% static 'shared/images/favicons/favicon.png' %}?v=2" />
{% endif %}
<!-- Preconnect to external resources for faster loading -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdnjs.cloudflare.com" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
<!-- External CSS Libraries -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="visitor"
      referrerpolicy="no-referrer" />
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="visitor" />
<!-- Design Tokens - Load colors first for CSS variables -->
<link rel="stylesheet" href="{% static 'shared/css/primitives/colors.css' %}" />
<!-- Icon Size Utilities -->
<link rel="stylesheet" href="{% static 'shared/css/components/icon-sizes.css' %}" />
<!-- Master Stylesheet - Imports all common, component, and page styles -->
<link rel="stylesheet" href="{% static 'shared/css/common.css' %}" />
<!-- Additional Specific Styles -->
<link rel="stylesheet"
      href="{% static 'shared/css/base/bootstrap-override/index.css' %}" />
<link rel="stylesheet" href="{% static 'shared/css/components/modal.css' %}" />
<!-- Keyboard Shortcuts Modal Styles -->
<link rel="stylesheet"
      href="{% static 'shared/css/components/shortcuts-modal.css' %}" />
<!-- Global Base Layout Styles -->
<link rel="stylesheet" href="{% static 'shared/css/layouts/global-base.css' %}" />
<!-- Zen Mode Styles (F11 for distraction-free writing) -->
<link rel="stylesheet" href="{% static 'shared/css/components/zen-mode.css' %}" />
<!-- Product Tour (step-by-step guided walkthrough) -->
<link rel="stylesheet" href="{% static 'shared/css/components/product-tour.css' %}" />
<!-- Mobile Notice Banner -->
<link rel="stylesheet" href="{% static 'shared/css/components/mobile-notice.css' %}" />
<!-- Cookie Consent Banner -->
<link rel="stylesheet" href="{% static 'shared/css/components/cookie-consent.css' %}" />
