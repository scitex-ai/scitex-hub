{% load static vite %}

<!-- hook-bypass: inline-style -->
<!-- Critical CSS inlined: FOUC spinner must render before ANY external CSS loads.
     This is Google's recommended critical CSS strategy, not a hack.
     The external loading-screen.css remains as the canonical source. -->
<style>
    #app-loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0d1117;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity .3s ease
    }

    .stx-loading-content {
        text-align: center;
        color: #8b949e
    }

    @keyframes stx-loading-spin {
        to {
            transform: rotate(360deg)
        }
    }

    .stx-loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: stx-loading-spin 1s linear infinite;
        margin: 0 auto 12px
    }

    .stx-loading-text {
        font-size: 13px;
        font-family: system-ui, sans-serif
    }

    body.app-ready #app-loading-screen {
        opacity: 0;
        pointer-events: none
    }
</style>
<!--
  The favicon (including `rel="alternate icon"`) is declared ONCE, in
  global_head_meta.html, driven by settings.SCITEX_ENV. A second DEBUG-keyed
  block used to live here and disagreed with that one: it had no staging
  branch, so staging served PRODUCTION's alternate icon while its primary icon
  was the staging one. Do not reintroduce a second favicon declaration.
-->
<!-- Preconnect to external resources for faster loading -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdnjs.cloudflare.com" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
<!-- External CSS Libraries -->
<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" {# pragma: allowlist secret #}
    crossorigin="visitor"
    referrerpolicy="no-referrer" />
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" {# pragma: allowlist secret #}
        crossorigin="visitor" />

        {% vite_css 'shared/head-styles-shell' %}
