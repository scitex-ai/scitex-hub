{% load static %}

{% if user.is_authenticated %}
    <div class="ws-ai-pane"
         id="ws-ai-pane"
         data-ai-hint="AI chat renders Markdown (code blocks, tables, lists). MCP tool outputs (images, CSV, plots) display inline. Use stx-show <file> in terminal to display media.">
        <div id="scitex-ai-panel"
             class="scitex-ai-panel workspace-sidebar collapsed"
             aria-hidden="true">
            <!-- WorkspacePanelResizer: handles collapse state restore and drag resize -->
            <div id="scitex-ai-resizer"
                 class="panel-resizer"
                 data-panel-resizer
                 data-target="#scitex-ai-panel"
                 data-direction="left"
                 data-min-width="40"
                 data-default-width="300"
                 data-storage-key="ws-ai-panel-width"
                 data-collapse-key="scitex-ai-panel-collapsed"
                 data-toggle-btn="scitex-ai-toggle"
                 style="position:absolute;
                        right:0;
                        top:0;
                        bottom:0;
                        z-index:1"></div>
            <div class="sidebar-header scitex-ai-panel-header" id="scitex-ai-panel-header">
                <button class="panel-toggle-btn" id="scitex-ai-toggle" title="AI Chat (Alt+A)">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <span class="sidebar-title" id="scitex-ai-collapsed-title"><i class="fas fa-terminal"></i> Console</span>
                <div class="scitex-ai-mode-toggle">
                    <button class="scitex-ai-mode-btn active" data-mode="chat" title="AI Chat">
                        <i class="fas fa-robot"></i> Chat
                    </button>
                    <button class="scitex-ai-mode-btn" data-mode="console" title="Terminal">
                        <i class="fas fa-terminal"></i> Console
                    </button>
                    <button class="scitex-ai-mode-btn" data-mode="jobs" title="SLURM Jobs">
                        <i class="fas fa-tasks"></i> Jobs
                        <span id="ai-jobs-badge" class="ai-mode-badge">0</span>
                    </button>
                    <button class="scitex-ai-mode-btn" data-mode="config" title="Settings">
                        <i class="fas fa-cog"></i> Config
                    </button>
                </div>
                <div class="scitex-ai-panel-actions">
                    <button class="scitex-ai-action-btn" id="scitex-ai-copy-chat" title="Copy chat">
                        <i class="fas fa-copy"></i>
                    </button>
                    <button class="scitex-ai-action-btn" id="scitex-ai-print-chat" title="Print chat">
                        <i class="fas fa-print"></i>
                    </button>
                    <button class="scitex-ai-action-btn" id="scitex-ai-clear-chat" title="Clear chat">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <button class="scitex-ai-action-btn"
                            title="Keyboard Shortcuts"
                            onclick="window.showShortcutsModal()">
                        <i class="fas fa-keyboard"></i>
                    </button>
                </div>
            </div>
            <div class="sidebar-content scitex-ai-body">
                <!-- Chat mode -->
                <div id="scitex-ai-chat-view" class="scitex-ai-view active">
                    <div class="scitex-ai-sessions-bar">
                        <button class="scitex-ai-new-chat" title="New chat">
                            <i class="fas fa-plus"></i>
                        </button>
                        <div id="scitex-ai-sessions-list" class="scitex-ai-sessions-list"></div>
                    </div>
                    <div id="scitex-ai-messages" class="scitex-ai-messages">
                        <div class="scitex-ai-empty">
                            <i class="fas fa-robot"></i>
                            <span>Ask anything about SciTeX.</span>
                            <span>I can take actions: stats, plots, literature, and your current work.</span>
                        </div>
                    </div>
                    <div class="scitex-ai-input-area">
                        <span id="scitex-ai-model-badge" class="scitex-ai-model-badge"></span>
                        <div id="scitex-ai-image-previews" class="scitex-ai-image-previews"></div>
                        <div class="scitex-ai-input-wrap">
                            <textarea id="scitex-ai-input"
                                      class="scitex-ai-input"
                                      rows="1"
                                      placeholder="Ask anything"
                                      autocomplete="off"></textarea>
                            <button id="scitex-ai-camera" class="scitex-ai-input-btn" title="Attach image">
                                <i class="fas fa-camera"></i>
                            </button>
                            <button id="scitex-ai-sketch" class="scitex-ai-input-btn" title="Draw sketch">
                                <i class="fas fa-pen"></i>
                            </button>
                            <input type="file" id="scitex-ai-image-file" accept="image/*" multiple hidden />
                            <button id="scitex-ai-mic" class="scitex-ai-mic" title="Voice input">
                                <i class="fas fa-microphone"></i>
                            </button>
                        </div>
                        <button id="scitex-ai-send" class="scitex-ai-send" hidden></button>
                    </div>
                </div>
                <!-- Console/Terminal mode -->
                <div id="scitex-ai-console-view" class="scitex-ai-view">
                    <div id="scitex-ai-console-terminal" class="scitex-ai-console-terminal"></div>
                    <div class="scitex-ai-console-toolbar">
                        <span id="scitex-ai-console-status" class="scitex-ai-console-status"></span>
                        <div class="scitex-ai-console-toolbar-btns">
                            <button id="scitex-ai-console-camera"
                                    class="scitex-ai-input-btn"
                                    title="Webcam capture">
                                <i class="fas fa-camera"></i>
                            </button>
                            <button id="scitex-ai-console-sketch" class="scitex-ai-input-btn" title="Draw sketch">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button id="scitex-ai-console-mic" class="scitex-ai-input-btn" title="Voice input">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <input type="file" id="scitex-ai-console-image-file" accept="image/*" multiple hidden />
                        </div>
                    </div>
                </div>
                <!-- Jobs mode -->
                <div id="scitex-ai-jobs-view" class="scitex-ai-view">
                    <div class="scitex-ai-jobs-header">
                        <span id="scitex-ai-jobs-summary" class="scitex-ai-jobs-summary">Loading...</span>
                        <button class="scitex-ai-action-btn" id="scitex-ai-jobs-refresh" title="Refresh">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div id="scitex-ai-jobs-list" class="scitex-ai-jobs-list"></div>
                </div>
                <!-- Config mode -->
                <div id="scitex-ai-config-view" class="scitex-ai-view">
                    <div class="scitex-ai-config-content" style="position:relative">
                        <span id="ai-config-toast" class="ai-config-toast"><i class="fas fa-check"></i> Saved</span>
                        <div class="ai-settings-row">
                            <label class="scitex-ai-settings-label">
                                <i class="fas fa-brain"></i> LLM Model
                                <span id="scitex-ai-config-model-badge" class="scitex-ai-model-badge"></span>
                            </label>
                            <select id="scitex-ai-llm-model" class="ai-settings-select" title="LLM model for chat"></select>
                        </div>
                        <div class="ai-settings-row">
                            <label class="scitex-ai-settings-label">
                                <i class="fas fa-microphone"></i> STT Model
                            </label>
                            <select id="scitex-ai-stt-model"
                                    class="ai-settings-select scitex-ai-stt-model"
                                    title="STT model"
                                    style="display:none"></select>
                        </div>
                        <div class="ai-settings-row ai-settings-mcp">
                            <label class="scitex-ai-settings-label">
                                <i class="fas fa-plug"></i> MCP Tools
                            </label>
                            <span id="scitex-ai-mcp-badge" class="ai-mcp-badge" title="MCP tools status">
                                <i class="fas fa-circle ai-mcp-dot"></i>
                                <span class="ai-mcp-count">--</span>
                            </span>
                        </div>
                        <div id="ai-agent-sources-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endif %}
