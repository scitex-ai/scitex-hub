{% load static %}

{% if user.is_authenticated %}
    <div class="ws-ai-pane" id="ws-ai-pane">
        <div id="scitex-ai-panel"
             class="scitex-ai-panel workspace-sidebar collapsed"
             aria-hidden="true">
            <!-- WorkspacePanelResizer: handles collapse state restore and drag resize -->
            <div id="scitex-ai-resizer"
                 class="panel-resizer"
                 data-panel-resizer
                 data-target="#scitex-ai-panel"
                 data-direction="left"
                 data-min-width="40"
                 data-default-width="300"
                 data-storage-key="ws-ai-panel-width"
                 data-collapse-key="scitex-ai-panel-collapsed"
                 data-toggle-btn="scitex-ai-toggle"
                 style="position:absolute;
                        right:0;
                        top:0;
                        bottom:0;
                        z-index:1"></div>
            <div class="sidebar-header scitex-ai-panel-header" id="scitex-ai-panel-header">
                <button class="panel-toggle-btn" id="scitex-ai-toggle" title="AI Agent (Alt+A)">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <span class="sidebar-title">AI Agent</span>
                <span class="scitex-ai-panel-title">
                    <i class="fas fa-robot"></i> AI Agent
                </span>
                <div class="scitex-ai-mode-toggle">
                    <button class="scitex-ai-mode-btn active" data-mode="chat" title="AI Chat">
                        <i class="fas fa-comments"></i>
                    </button>
                    <button class="scitex-ai-mode-btn" data-mode="console" title="Terminal">
                        <i class="fas fa-terminal"></i>
                    </button>
                    <button class="scitex-ai-mode-btn" data-mode="jobs" title="SLURM Jobs">
                        <i class="fas fa-tasks"></i>
                        <span id="ai-jobs-badge" class="ai-mode-badge" style="display: none;">0</span>
                    </button>
                </div>
                <div class="scitex-ai-panel-actions">
                    <button class="scitex-ai-action-btn"
                            title="Keyboard Shortcuts"
                            onclick="window.showShortcutsModal()">
                        <i class="fas fa-keyboard"></i>
                    </button>
                    <button id="scitex-ai-settings-btn" class="scitex-ai-action-btn" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
            <div id="scitex-ai-settings-panel"
                 class="scitex-ai-settings-panel"
                 style="display:none">
                <!-- LLM Model -->
                <div class="ai-settings-row">
                    <label class="scitex-ai-settings-label">
                        <i class="fas fa-brain"></i> LLM Model
                        <span id="scitex-ai-model-badge" class="scitex-ai-model-badge"></span>
                    </label>
                    <select id="scitex-ai-llm-model" class="ai-settings-select" title="LLM model for chat"></select>
                </div>
                <!-- STT Model -->
                <div class="ai-settings-row">
                    <label class="scitex-ai-settings-label">
                        <i class="fas fa-microphone"></i> STT Model
                    </label>
                    <select id="scitex-ai-stt-model"
                            class="ai-settings-select scitex-ai-stt-model"
                            title="STT model"
                            style="display:none"></select>
                </div>
                <!-- MCP Status -->
                <div class="ai-settings-row ai-settings-mcp">
                    <label class="scitex-ai-settings-label">
                        <i class="fas fa-plug"></i> MCP Tools
                    </label>
                    <span id="scitex-ai-mcp-badge" class="ai-mcp-badge" title="MCP tools status">
                        <i class="fas fa-circle ai-mcp-dot"></i>
                        <span class="ai-mcp-count">--</span>
                    </span>
                </div>
                <!-- Quick Links -->
                <div class="ai-settings-links">
                    <a href="/auth/settings/mcp-tools/" title="MCP tool preferences">
                        <i class="fas fa-puzzle-piece"></i> MCP Settings
                    </a>
                    <a href="/auth/settings/ai-providers/" title="AI provider keys">
                        <i class="fas fa-key"></i> AI Providers
                    </a>
                </div>
            </div>
            <div class="sidebar-content scitex-ai-body">
                <!-- Chat mode -->
                <div id="scitex-ai-chat-view" class="scitex-ai-view active">
                    <div id="scitex-ai-messages" class="scitex-ai-messages">
                        <div class="scitex-ai-empty">
                            <i class="fas fa-robot"></i>
                            <span>Ask anything about SciTeX.</span>
                            <span>I can take actions: stats, plots, literature, and your current work.</span>
                        </div>
                    </div>
                    <div class="scitex-ai-input-area">
                        <textarea id="scitex-ai-input"
                                  class="scitex-ai-input"
                                  rows="3"
                                  placeholder="Ask AI agent... (Enter to send)"
                                  autocomplete="off"></textarea>
                        <button id="scitex-ai-mic" class="scitex-ai-mic" title="Voice input">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button id="scitex-ai-send" class="scitex-ai-send" title="Send (Enter)">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
                <!-- Console/Terminal mode -->
                <div id="scitex-ai-console-view" class="scitex-ai-view">
                    <div id="scitex-ai-console-terminal" class="scitex-ai-console-terminal"></div>
                    <span id="scitex-ai-console-status" class="scitex-ai-console-status"></span>
                </div>
                <!-- Jobs mode -->
                <div id="scitex-ai-jobs-view" class="scitex-ai-view">
                    <div class="scitex-ai-jobs-header">
                        <span id="scitex-ai-jobs-summary" class="scitex-ai-jobs-summary">Loading...</span>
                        <button class="scitex-ai-action-btn" id="scitex-ai-jobs-refresh" title="Refresh">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div id="scitex-ai-jobs-list" class="scitex-ai-jobs-list"></div>
                </div>
            </div>
        </div>
    </div>
{% endif %}
