{% load static %}

{% if user.is_authenticated %}
    <div class="ws-ai-pane"
         id="ws-ai-pane"
         data-ai-hint="AI chat renders Markdown (code blocks, tables, lists). MCP tool outputs (images, CSV, plots) display inline. Use stx-show <file> in terminal to display media.">
        <div id="stx-shell-ai-panel"
             class="stx-shell-ai-panel stx-shell-sidebar"
             aria-hidden="false">
            <!-- WorkspacePanelResizer: handles collapse state restore and drag resize -->
            <div id="stx-shell-ai-resizer"
                 class="panel-resizer"
                 data-panel-resizer
                 data-target="#stx-shell-ai-panel"
                 data-direction="left"
                 data-min-width="48"
                 data-default-width="300"
                 data-storage-key="ws-ai-panel-width"
                 data-collapse-key="stx-shell-ai-panel-collapsed"
                 data-toggle-btn="stx-shell-ai-toggle"
                 style="position:absolute;
                        right:0;
                        top:0;
                        bottom:0;
                        z-index:1"></div>
            <div class="stx-shell-sidebar__header stx-shell-ai-panel-header"
                 id="stx-shell-ai-panel-header">
                <button class="panel-toggle-btn" id="stx-shell-ai-toggle" title="AI Chat (Alt+A)">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <span class="stx-shell-sidebar__title"
                      id="stx-shell-ai-collapsed-title"
                      title="Console"><i class="fas fa-terminal"></i> Console</span>
                <div class="stx-shell-ai-mode-toggle">
                    <button class="stx-shell-ai-mode-btn active"
                            data-mode="console"
                            title="Terminal & Jobs">
                        <i class="fas fa-terminal"></i> Console
                    </button>
                    <button class="stx-shell-ai-mode-btn" data-mode="chat" title="AI Chat">
                        <i class="fas fa-robot"></i> Chat
                    </button>
                </div>
                <div class="stx-shell-ai-panel-actions">
                    <button class="stx-shell-ai-action-btn"
                            title="Keyboard Shortcuts"
                            onclick="window.showShortcutsModal()">
                        <i class="fas fa-keyboard"></i>
                    </button>
                </div>
            </div>
            <div class="stx-shell-sidebar__content stx-shell-ai-body">
                <!-- Chat mode -->
                <div id="stx-shell-ai-chat-view" class="stx-shell-ai-view">
                    <div class="stx-shell-ai-sessions-bar">
                        <button class="stx-shell-ai-new-chat" title="New chat">
                            <i class="fas fa-plus"></i>
                        </button>
                        <div id="stx-shell-ai-sessions-list" class="stx-shell-ai-sessions-list"></div>
                        <div class="stx-shell-ai-panel-actions">
                            <button class="stx-shell-ai-action-btn" id="stx-shell-ai-copy-chat" title="Copy chat">
                                <i class="fas fa-copy"></i>
                            </button>
                            <button class="stx-shell-ai-action-btn" id="stx-shell-ai-print-chat" title="Print chat">
                                <i class="fas fa-print"></i>
                            </button>
                            <button class="stx-shell-ai-action-btn" id="stx-shell-ai-clear-chat" title="Clear chat">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                        <button class="stx-shell-ai-share-btn" title="Share conversation">
                            <i class="fas fa-share-alt"></i>
                        </button>
                    </div>
                    <div id="stx-shell-ai-messages" class="stx-shell-ai-messages">
                        <div class="stx-shell-ai-empty">
                            <i class="fas fa-robot"></i>
                            <span>Ask anything about SciTeX.</span>
                            <span>I can take actions: stats, plots, literature, and your current work.</span>
                        </div>
                    </div>
                    <div class="stx-shell-ai-input-area" style="position:relative">
                        <span id="stx-shell-ai-model-badge" class="stx-shell-ai-model-badge"></span>
                        <div id="stx-shell-ai-image-previews" class="stx-shell-ai-image-previews"></div>
                        <div class="stx-shell-ai-input-wrap">
                            <textarea id="stx-shell-ai-input"
                                      class="stx-shell-ai-input"
                                      rows="1"
                                      placeholder="Ask anything"
                                      autocomplete="off"></textarea>
                            <button id="stx-shell-ai-camera" class="stx-shell-ai-input-btn" title="Attach image">
                                <i class="fas fa-camera"></i>
                            </button>
                            <button id="stx-shell-ai-sketch" class="stx-shell-ai-input-btn" title="Draw sketch">
                                <i class="fas fa-pen"></i>
                            </button>
                            <input type="file" id="stx-shell-ai-image-file" accept="image/*" multiple hidden />
                            <button id="stx-shell-ai-mic" class="stx-shell-ai-mic" title="Voice input">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <!-- Chat config gear -->
                            <button id="stx-shell-ai-chat-gear"
                                    class="stx-shell-ai-input-btn stx-shell-ai-gear-btn"
                                    title="Chat settings">
                                <i class="fas fa-cog"></i>
                            </button>
                        </div>
                        <!-- Volume visualizer (hidden until recording) -->
                        <div class="stx-shell-ai-vol">
                            <span class="stx-shell-ai-vol-bar" hidden></span>
                            <span class="stx-shell-ai-vol-bar" hidden></span>
                            <span class="stx-shell-ai-vol-bar" hidden></span>
                            <span class="stx-shell-ai-vol-bar" hidden></span>
                            <span class="stx-shell-ai-vol-bar" hidden></span>
                        </div>
                        <select id="stx-shell-ai-stt-model"
                                class="stx-shell-ai-stt-model"
                                title="STT model"
                                style="display:none"></select>
                        <button id="stx-shell-ai-send" class="stx-shell-ai-send" hidden></button>
                        <!-- Chat config popover (inside input-area for positioning) -->
                        <div id="stx-shell-ai-chat-config"
                             class="stx-shell-ai-config-popover"
                             style="display:none">
                            <div class="ai-settings-row">
                                <label class="stx-shell-ai-settings-label">
                                    <i class="fas fa-brain"></i> LLM Model
                                    <span id="stx-shell-ai-config-model-badge" class="stx-shell-ai-model-badge"></span>
                                </label>
                                <select id="stx-shell-ai-llm-model"
                                        class="ai-settings-select"
                                        title="LLM model for chat"></select>
                            </div>
                            <div class="ai-settings-row">
                                <label class="stx-shell-ai-settings-label">
                                    <i class="fas fa-microphone"></i> STT Model
                                </label>
                                <select id="stx-shell-ai-stt-model-config"
                                        class="ai-settings-select stx-shell-ai-stt-model"
                                        title="STT model"></select>
                            </div>
                            <div class="ai-settings-row ai-settings-mcp">
                                <label class="stx-shell-ai-settings-label">
                                    <i class="fas fa-plug"></i> MCP Tools
                                </label>
                                <span id="stx-shell-ai-mcp-badge" class="ai-mcp-badge" title="MCP tools status">
                                    <i class="fas fa-circle ai-mcp-dot"></i>
                                    <span class="ai-mcp-count">--</span>
                                </span>
                            </div>
                            <div class="ai-settings-section" id="ai-chat-agent-sources">
                                <div id="ai-chat-agent-sources-content" class="ai-agent-sources">
                                    <div class="ai-source-loading">Loading...</div>
                                </div>
                            </div>
                            <div id="ai-chat-limits-content" class="ai-chat-limits-content"></div>
                            <div class="ai-settings-links">
                                <a href="/auth/settings/mcp-tools/" title="MCP tool preferences">
                                    <i class="fas fa-puzzle-piece"></i> MCP Settings
                                </a>
                                <a href="/auth/settings/ai-providers/" title="AI provider keys">
                                    <i class="fas fa-key"></i> AI Providers
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Console/Terminal mode -->
                <div id="stx-shell-ai-console-view" class="stx-shell-ai-view active">
                    <div class="stx-shell-ai-console-tabs-bar">
                        <button class="stx-shell-ai-console-new-tab" title="New terminal">
                            <i class="fas fa-plus"></i>
                        </button>
                        <div id="stx-shell-ai-console-tabs-list" class="stx-shell-ai-console-tabs-list"></div>
                    </div>
                    <div id="stx-shell-ai-console-terminal" class="stx-shell-ai-console-terminal"></div>
                    <div class="stx-shell-ai-console-toolbar" style="position:relative">
                        <span id="stx-shell-ai-console-status" class="stx-shell-ai-console-status"></span>
                        <div class="stx-shell-ai-console-toolbar-btns">
                            <!-- Auto-accept toggle -->
                            <button id="stx-shell-ai-auto-accept"
                                    class="stx-shell-ai-input-btn stx-shell-ai-auto-accept-btn"
                                    title="Claude Code Auto-Accept: automatically accepts permission prompts at the configured interval and safety level">
                                <i class="fas fa-robot"></i>
                                <span id="stx-shell-ai-auto-accept-state" class="stx-shell-ai-auto-accept-state"></span>
                            </button>
                            <button id="stx-shell-ai-console-camera"
                                    class="stx-shell-ai-input-btn"
                                    title="Webcam capture">
                                <i class="fas fa-camera"></i>
                            </button>
                            <button id="stx-shell-ai-console-sketch"
                                    class="stx-shell-ai-input-btn"
                                    title="Draw sketch">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button id="stx-shell-ai-console-mic"
                                    class="stx-shell-ai-input-btn"
                                    title="Voice input">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <input type="file"
                                   id="stx-shell-ai-console-image-file"
                                   accept="image/*"
                                   multiple
                                   hidden />
                            <!-- Console config gear -->
                            <button id="stx-shell-ai-console-gear"
                                    class="stx-shell-ai-input-btn stx-shell-ai-gear-btn"
                                    title="Console settings">
                                <i class="fas fa-cog"></i>
                            </button>
                        </div>
                        <!-- Console config popover (inside toolbar for positioning) -->
                        <div id="stx-shell-ai-console-config"
                             class="stx-shell-ai-config-popover"
                             style="display:none">
                            <div class="ai-settings-section" id="ai-auto-accept-config">
                                <label class="stx-shell-ai-settings-label"
                                       title="When enabled, automatically accepts Claude Code permission prompts at the configured interval. Conservative: safe commands only. Normal: most commands. Aggressive: all commands.">
                                    <i class="fas fa-robot"></i> Claude Code Auto-Accept Mode
                                </label>
                                <div class="ai-settings-row">
                                    <label class="stx-shell-ai-settings-label"
                                           title="How often to check for and accept permission prompts">
                                        Interval
                                    </label>
                                    <select id="ai-auto-accept-interval"
                                            class="ai-settings-select"
                                            title="How often to check for and accept permission prompts">
                                        <option value="1000">1s (fast)</option>
                                        <option value="1500" selected>1.5s</option>
                                        <option value="2000">2s</option>
                                        <option value="3000">3s (slow)</option>
                                    </select>
                                </div>
                                <div class="ai-settings-row">
                                    <label class="stx-shell-ai-settings-label"
                                           title="Controls which commands are auto-accepted">Safety</label>
                                    <select id="ai-auto-accept-safety"
                                            class="ai-settings-select"
                                            title="Controls which commands are auto-accepted">
                                        <option value="conservative"
                                                title="Only accept safe, read-only commands (ls, cat, grep, git status)">
                                            Conservative (read-only)
                                        </option>
                                        <option value="normal"
                                                selected
                                                title="Accept most commands except destructive ones (rm -rf, git push --force)">
                                            Normal (most commands)
                                        </option>
                                        <option value="aggressive"
                                                title="Accept all commands including destructive ones — use with caution">
                                            Aggressive (all commands)
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="ai-settings-section" id="ai-auto-response-config">
                                <label class="stx-shell-ai-settings-label"
                                       title="Commands sent automatically for each Claude state">
                                    <i class="fas fa-reply"></i> Auto-Response Commands
                                </label>
                                <div class="ai-settings-row">
                                    <label class="stx-shell-ai-settings-label"
                                           title="Command sent when Claude is thinking or idle">Waiting</label>
                                    <input id="ai-auto-response-waiting"
                                           class="ai-settings-input"
                                           type="text"
                                           placeholder="/speak-signature"
                                           title="Command sent when Claude is thinking or idle" />
                                </div>
                                <div class="ai-settings-row">
                                    <label class="stx-shell-ai-settings-label" title="Response for Y/N permission prompts">Y/N</label>
                                    <select id="ai-auto-response-yn"
                                            class="ai-settings-select"
                                            title="Response for Y/N permission prompts">
                                        <option value="1">1 (Allow)</option>
                                        <option value="2">2 (Deny)</option>
                                    </select>
                                </div>
                                <div class="ai-settings-row">
                                    <label class="stx-shell-ai-settings-label"
                                           title="Response for Y/Y/N permission prompts">Y/Y/N</label>
                                    <select id="ai-auto-response-yyn"
                                            class="ai-settings-select"
                                            title="Response for Y/Y/N permission prompts">
                                        <option value="1">1 (Allow once)</option>
                                        <option value="2" selected>2 (Allow always)</option>
                                        <option value="3">3 (Deny)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="ai-settings-section" id="ai-agent-sources">
                                <label class="stx-shell-ai-settings-label">
                                    <i class="fas fa-sitemap"></i> Agent Sources
                                </label>
                                <div id="ai-agent-sources-content" class="ai-agent-sources">
                                    <div class="ai-source-loading">Loading...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Jobs section (collapsible, inside console view) -->
                    <details id="stx-shell-ai-jobs-section" class="stx-shell-ai-jobs-section">
                        <summary class="stx-shell-ai-jobs-section-summary">
                            <i class="fas fa-tasks"></i>
                            <span id="stx-shell-ai-jobs-summary" class="stx-shell-ai-jobs-summary">No jobs</span>
                            <button class="stx-shell-ai-action-btn" id="stx-shell-ai-jobs-refresh" title="Refresh">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </summary>
                        <div id="stx-shell-ai-jobs-list" class="stx-shell-ai-jobs-list"></div>
                    </details>
                </div>
            </div>
        </div>
    </div>
{% endif %}
