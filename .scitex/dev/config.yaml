# scitex-dev project-type config
# scitex-hub is a Django app: `apps/`, `config/`, `static/`,
# `media/`, `staticfiles/`, `templates/` are framework-canonical at
# repo root. `deferred` triggers the auditor's [defer] reminder
# listing the entries that aren't Django-canonical and need future
# review (slurm_logs/, ssh_keys/, releases/, deployment/,
# singularity/, lib/, docs_api/, …).

project-type:
  - pip
  - django
  - deferred

# PS-224 (runner-destination-unregistered) exemptions.
#
# Four entries. Everything else that used to target ubuntu-latest was
# MIGRATED rather than exempted — an exemption I cannot justify by
# measurement is just a skip_rules entry with better manners.
#
# The first entry is measured. The other three are the tag-only release
# jobs, and they are exempted on a DIFFERENT and weaker ground, stated
# plainly rather than dressed up as measurement: a pull-request run can
# never execute them, so migrating them would be a change whose only
# feedback arrives at the next tag — i.e. a release break discovered by
# releasing. `test` and `build` in that same workflow WERE migrated,
# because those two are plain Python and the pytest matrix already proves
# that shape on this pool. These three are held back deliberately and are
# tracked for a measured migration behind a canary release, not left to
# rot: see card hub-audit-gate-cannot-fail-20260725.
#
# The key is <workflow-path>::<job-id> and is copied from what the audit
# PRINTS, not constructed from the filename. Job-qualified is deliberate:
# a wrong job id fails OPEN (still flagged, loud), whereas a bare path
# would silently exempt every job in the file — including the eight this
# repo migrated honestly.
audit:
  exemptions:
    # Shape is {rule_code: [{path, line, reason}, ...]} — a mapping KEYED BY
    # RULE whose value is a list. Verified against the parser
    # (_cli/audit/_config/_loader.py:113-141), not from prose: a flat list of
    # entries each carrying `rule:` is silently ignored, because
    # _parse_exemptions returns ((), ()) for any non-dict block.
    PS-224:
      - path: ".github/workflows/e2e-mobile.yml::playwright-mobile"
        line: 0
        reason: >-
          playwright install --with-deps chromium is an apt-get invocation
          requiring root. Measured on the Spartan pool 2026-07-28: uid 17107,
          `sudo -n true` -> "sudo: refused — Spartan HPC is user-space only",
          `command -v apt-get` -> absent. Structurally unrunnable there, not a
          configuration gap. Revisit if a browser-capable runner joins the pool.
      - path: ".github/workflows/pypi-publish-and-github-release-on-tag.yml::publish"
        line: 0
        reason: >-
          Tag-only job, so no PR run can exercise a migration of it. It is also
          the one job here with a second, structural doubt: it runs
          pypa/gh-action-pypi-publish, a Docker container action, and the
          Spartan pool is unprivileged with no Docker daemon. NOT re-measured
          in this change — stated as the open question it is. Migrate behind a
          canary release once the pool's container support is settled.
      - path: ".github/workflows/pypi-publish-and-github-release-on-tag.yml::release"
        line: 0
        reason: >-
          Tag-only job; a PR run cannot exercise it. Shells `gh release create`,
          and `gh` is not known to be present on the unprivileged pooled runner
          image. Verify `command -v gh` on the pool, then migrate with the
          canary release rather than blind.
      - path: ".github/workflows/pypi-publish-and-github-release-on-tag.yml::sync-main"
        line: 0
        reason: >-
          Tag-only job; a PR run cannot exercise it. Same `gh` dependency as
          `release` above, plus it pushes branches, so a wrong runner turns a
          release into a half-synced main. Migrate with `release`, together,
          behind the same canary.
