# Coverage reporting configuration for scitex-cloud.
#
# The project still has substantial Django app surface and CLI code not
# fully exercised by the unit suite — keep the target on "auto" while
# the per-module coverage push (subprocess wiring landed 2026-05) drives
# the absolute number up. Switch to a hard floor once the baseline
# settles above 80%.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
