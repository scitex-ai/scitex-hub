# Pre-commit hooks for security and code quality
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: migrations/
      - id: check-yaml
        # mkdocs.yml uses MkDocs' custom !ENV tag — without --unsafe the
        # check fails to construct the tag (ConstructorError). The flag
        # only allows custom tags; it does NOT execute them.
        args: ['--unsafe']
      - id: check-json

  # Python security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ['-r', 'apps/', 'config/', '-lll', '--exit-zero']
        pass_filenames: false
        files: \.py$
        exclude: migrations/

  # Python formatting (optional)
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3.11
        exclude: migrations/

  # Block tracked symlinks with ABSOLUTE targets. A host-specific absolute
  # symlink target breaks `git pull` / checkout on every other host (NAS, CI,
  # other agent containers). See PR #409 (node_modules) and the dotfiles P0
  # of 2026-07-12 (src/.scitex). Root-cause guard, not a per-incident cleanup.
  - repo: local
    hooks:
      - id: check-absolute-symlinks
        name: no absolute-target tracked symlinks
        entry: scripts/maintenance/check_absolute_symlinks.sh
        language: script
        pass_filenames: false
        always_run: true

  # Incremental testing (disabled: requires Docker for DB access)
  # Run inside Docker instead: make test-testmon
