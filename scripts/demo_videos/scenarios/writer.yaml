# Draft in Writer: edit the abstract of the current project and compile a PDF preview.
# Desktop only: the editor is not reachable at 390x844.
app: writer
title:
  en: Draft in Writer
  ja: Writer で原稿を書く
languages:
  en: {locale: en}
  ja: {locale: ja}
# Known limit (docs/ops/demo-videos.md): the Writer page itself is not translated,
# so the Japanese-narrated recording necessarily shows English Writer labels. The
# spec (private-beta section 8) asks for a matching UI+audio rendition in that
# case, recorded from the same action timeline, so Japanese viewers get a video
# that agrees with the screen they will actually see.
alternates:
  - language: ja
    ui_locale: en
    reason: The Writer editor and details panel are not translated yet; the Japanese narration is offered over the English UI it describes.
viewports: [desktop]
sign_in: true
steps:
  - action: goto
    value: /apps/writer/
    narration:
      en: Writer opens your manuscript, with the editor, the PDF preview and the details panel.
      ja: Writer を開くと原稿が表示されます。エディタ、PDF プレビュー、詳細パネルが並んでいます。
    hold: 6
  - action: click
    selector: "#section-selector-toggle"
    narration:
      en: Use the section menu to pick a section, such as the abstract.
      ja: セクションメニューで、アブストラクトなどのセクションを選びます。
  - action: click
    selector: "#section-selector-toggle"
    hold: 0.3
  - action: click
    selector: ".monaco-editor .view-lines"
    hold: 0.3
  - action: press
    value: Control+a
    hold: 0.2
  - action: type
    selector: ".monaco-editor textarea"
    value: "\\begin{abstract}\nWe tested whether a night of sleep improves word-pair memory in 20 volunteers.\n\\end{abstract}\n"
    narration:
      en: Write your abstract. Your changes are saved as you type.
      ja: アブストラクトを書きます。入力した内容は保存されます。
  - action: click
    selector: "[data-section=preview-log] .details-section__header"
    narration:
      en: In the details panel, open Compilation Preview.
      ja: 詳細パネルで Compilation - Preview を開きます。
  - action: click
    selector: "#details-preview-compile-btn"
    narration:
      en: Click Compile Preview, and wait a moment.
      ja: Compile Preview をクリックして、少し待ちます。
    hold: 18
  - action: hover
    selector: "#download-btn-toolbar"
    narration:
      en: The PDF of your section appears. Use the download button to save it.
      ja: セクションの PDF が表示されました。ダウンロードボタンで保存できます。
    hold: 1.5
