# Find and save literature in Scholar (queue item 3 of the private-library short tours).
#
# English only on purpose: the public-demo policy is English, and a Japanese rendition
# is a separate authoring decision rather than a free side effect. Selectors are ids or
# data attributes — never a translated label.
#
# One hook is class-based and is recorded as a known gap: the per-result save control is
# generated by search/_result-card.ts as `.save-btn` with no id and no data attribute.
# scitex-scholar should give it a stable hook (`data-save-paper` or an id); until then
# the selector is anchored on the results container's id, and the coverage test pins it.
app: scholar
title:
  en: Find and save literature in Scholar
languages:
  en: {locale: en}
viewports: [desktop]
sign_in: true
steps:
  - action: goto
    value: /apps/scholar/
    chapter:
      en: Scholar
    narration:
      en: Scholar is where literature lives. It searches a local index of published work.
    hold: 2
  - action: type
    selector: "#literatureSearchForm textarea[name=q]"
    value: hippocampus memory sleep
    chapter:
      en: Search
    narration:
      en: Type the topic you are looking for, then press the search button.
    hold: 1.5
  - action: click
    selector: "#searchButton"
    chapter:
      en: Results
    narration:
      en: Results come from the local index, so nothing leaves the instance.
    hold: 8
  - action: click
    selector: "#scitex-results-container .save-btn"
    chapter:
      en: Save to library
    narration:
      en: Save a result to your library, and it becomes a reference for this project.
    hold: 2.5
  - action: click
    selector: "#tab-library"
    chapter:
      en: Library
    narration:
      en: The library lists what you saved, with the metadata the search returned.
    hold: 3
  - action: click
    selector: "#library-papers-list .library-paper-card[data-paper-id]"
    chapter:
      en: Saved paper
    narration:
      en: Open a saved paper to see its details and where it can be cited from.
    hold: 2.5
