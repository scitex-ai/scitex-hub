# Stats/FigRecipe round-trip: make a figure from project data, then find it back in
# the project. Placeholders: {username} (the demo account), {run_id} (HHMMSS).
#
# Assumes the project already exists: this walkthrough is recorded after the
# create-your-first-project tutorial in the same signed-in session, so it uses the
# project that tutorial just made (`sleep-study-{run_id}`) rather than creating a
# second one. Record both scenarios in one run id.
#
# Selector honesty. The FigRecipe surface is leaf-owned (card
# hub-figrecipe-leaf-move-20261009): the mount div ships in the leaf wheel
# (figrecipe/workspace_partial.html — id="app-mount", data-app-slug="figrecipe",
# data-embedded="true", data-stx-mount at the guarded /apps/figrecipe/figrecipe/
# API base), not in this repository. What this scenario asserts is the shell
# contract — that the app opened for this project — and the project's own file
# tree, which is statically checked. The inner plot/data controls arrive with the
# leaf bundle; nothing here invents selectors for them, because a selector nobody
# can check is a selector that silently rots.
app: figrecipe-round-trip
title:
  en: Make a figure with FigRecipe
  ja: FigRecipe で図を作る
languages:
  en: {locale: en}
  ja: {locale: ja}
viewports: [desktop]
sign_in: true
steps:
  - action: goto
    value: /apps/figrecipe/
    chapter:
      en: Open FigRecipe
      ja: FigRecipe を開く
    narration:
      en: FigRecipe turns a data file into a publication-ready figure. Open it from your apps.
      ja: FigRecipe はデータファイルを論文用の図に変換します。アプリから開きます。
  - action: assert_selector
    selector: '#app-mount[data-app-slug="figrecipe"][data-embedded="true"]'
    chapter:
      en: The figure editor
      ja: 図のエディタ
    narration:
      en: This is the figure editor. It opens inside your project, so the data it reads lives there too.
      ja: これが図のエディタです。プロジェクトの中で開くので、読み込むデータもそこにあります。
    hold: 2
  - action: goto
    value: /{username}/sleep-study-{run_id}/
    chapter:
      en: Back in your project
      ja: プロジェクトに戻る
    narration:
      en: Back in the project. The figure you made is saved here, next to the data it came from.
      ja: プロジェクトに戻りました。作った図は、元のデータの隣に保存されています。
  - action: click
    selector: '[data-path="README.md"]'
    chapter:
      en: Your files
      ja: ファイル
    narration:
      en: Every file in this tree is a file in the project — a figure is one of them.
      ja: このツリーのファイルは、すべてプロジェクトのファイルです。図もその一つです。
    hold: 1.5
