# Teach CodeQL that the project's component-wise path-containment validators are
# sanitizer barriers for py/path-injection.
#
# validate_path_in_project / validate_path_in_user_jail
# (apps/infra/project_app/services/filesystem/permissions.py) both enforce
# `target.resolve().relative_to(root.resolve())` and return a bool; every caller
# gates the filesystem sink on them via `if not validate(...): return <error>`.
#
# CodeQL already models the inline `str(target.resolve()).startswith(str(root.resolve()))`
# form as a path-injection barrier, but NOT these helper functions. So replacing a
# buggy prefix check with the CORRECT component-wise check removes the modelled
# barrier and re-reports a FALSE positive (the "penalized for the correct fix"
# regression on the path-containment sweep). This encodes the TRUE containment
# fact, scoped to the exact function + guarded argument — it is NOT a rule-wide or
# path-wide suppression, and it does not weaken the check anywhere else.
#
# NOTE: validate_remote_path_in_root is INTENTIONALLY NOT modelled — its docstring
# records an accepted residual symlink-escape risk (an operator decision), so
# modelling it as a full barrier would permanently hide that channel from CodeQL.
# The SSH validators (ssh_destination / ssh_remote_target) use a raise-and-return
# shape and belong in a barrierModel(ReturnValue, ...) — deferred until those
# functions land on develop.
extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: barrierGuardModel
    data:
      # ACCESS PATH: the first column is a TYPE, and the path is resolved from it.
      # The previous form used ["apps", "Member[infra].Member[project_app]..."],
      # which asks CodeQL to resolve a type literally named "apps" and walk members
      # from it. No such type exists, the entry does not bind, and MaD silently
      # IGNORES entries that do not resolve — so it looked installed and did nothing.
      #
      # A first-party MODULE is addressed with an empty type column and an explicit
      # Module[<absolute.dotted.path>] head. The dotted path is authoritative here:
      # every level (apps, infra, project_app, services, filesystem) carries an
      # __init__.py, so this module IS importable as written. Callers reach it by
      # RELATIVE import (`from ...services.filesystem.permissions import ...`), which
      # resolves to the same absolute module.
      #
      # validate_path_in_project(project_path, target_path) -> bool
      # target_path (Argument[1]) is contained in project_path when this returns True.
      - ["", "Module[apps.infra.project_app.services.filesystem.permissions].Member[validate_path_in_project].Argument[1,target_path:]", "true", "path-injection"]
      # validate_path_in_user_jail(user, target_path) -> bool  (delegates to the above)
      - ["", "Module[apps.infra.project_app.services.filesystem.permissions].Member[validate_path_in_user_jail].Argument[1,target_path:]", "true", "path-injection"]
      # is_within(root, target) -> bool
      # (apps/infra/platform_app/services/paths.py) — the SAME component-wise
      # `target.resolve().relative_to(root.resolve())` fact as the two above,
      # factored into a Django-free module so a2a_app and repo_app can gate on
      # it without pulling in the app registry (permissions.py imports
      # django.contrib.auth models and ...models.Project at module level, so a
      # low-level path utility cannot depend on it).
      #
      # resolve_within() is built on this and is the form callers should use:
      # it hands back the VALIDATED path, which removes the ordering bug this
      # sweep was opened for — the old code called .exists()/.is_file() on the
      # unvalidated join and checked containment only afterwards.
      #
      # Modelled on the ARGUMENT (bool-guard shape), NOT on resolve_within's
      # return value, for the reason the header already records: a
      # returns-the-sanitised-value function needs barrierModel(ReturnValue,...),
      # which is still deferred. Keeping the containment fact in a bool
      # predicate is what makes it expressible today.
      #
      # FOLLOW-UP, deliberately not in this change: validate_path_in_project
      # should delegate to is_within so there is ONE containment implementation
      # rather than two that agree today. Not done here because that module
      # carries the barrier entries above and this change should not risk them.
      - ["", "Module[apps.infra.platform_app.services.paths].Member[is_within].Argument[1,target:]", "true", "path-injection"]
