name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'requirements/*.txt'

jobs:
  safety-check:
    name: Python Dependency Security Check
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # uv venv, not setup-python + bare pip: the runner's toolcache Python
      # is uv-managed and refuses pip under PEP 668, and these runners are
      # org-pooled so the shared interpreter must not be mutated.
      - uses: astral-sh/setup-uv@v7

      - name: Install safety
        run: |
          set -euo pipefail
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python safety
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run safety check
        run: |
          if [ -f requirements.txt ]; then
            safety check --file requirements.txt --json || true
          fi

  bandit:
    name: Python Security Linting
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Install bandit
        run: |
          set -euo pipefail
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python bandit
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run bandit
        run: |
          bandit -r apps/ config/ -f json -o bandit-report.json || true
          cat bandit-report.json

      - name: Upload bandit results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  django-check:
    name: Django Security Check
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt || true
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Django security checks
        env:
          SCITEX_HUB_DJANGO_SECRET_KEY: 'test-secret-key-for-ci'
          SCITEX_HUB_DJANGO_SETTINGS_MODULE: 'config.settings.settings_dev'
        run: |
          python manage.py check --deploy || true
