name: Security Audit

# Repo-specific workflow, kept — but on the self-hosted pool (PS-169:
# GitHub-hosted runners are forbidden fleet-wide) and PEP-668-safe
# (uv venv instead of bare `pip install` into the runner's Python).
# The old jobs referenced requirements.txt, which no longer exists in
# this repo (deps live in pyproject.toml) — those steps were silently
# no-ops; they now scan the actually-installed environment. All three
# jobs remain ADVISORY (non-blocking), as before.

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pyproject.toml'

jobs:
  safety-check:
    name: Python Dependency Security Check
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install package + safety
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e . safety

      - name: Run safety check (advisory)
        run: .venv/bin/safety check --json || true

  bandit:
    name: Python Security Linting
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Install bandit
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python bandit

      - name: Run bandit (advisory)
        run: |
          .venv/bin/bandit -r apps/ config/ -f json -o bandit-report.json || true
          cat bandit-report.json

      - name: Upload bandit results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  django-check:
    name: Django Security Check
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[all]" \
            || uv pip install --python .venv/bin/python -e .

      - name: Run Django security checks (advisory)
        env:
          SCITEX_HUB_DJANGO_SECRET_KEY: 'test-secret-key-for-ci'
          SCITEX_HUB_DJANGO_SETTINGS_MODULE: 'config.settings.settings_dev'
        run: .venv/bin/python manage.py check --deploy || true
