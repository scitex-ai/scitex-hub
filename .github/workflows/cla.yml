name: CLA Assistant

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable workflow defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) already match
# this repo's prior hardcoded values, so no `with:` overrides are needed.
# NOTE (judgment call): the prior local file read
# secrets.CLA_PERSONAL_ACCESS_TOKEN, which does not appear in this repo's
# secret list (`gh secret list --repo ywatanabe1989/scitex-hub`) — already
# stale/broken before this migration. The reusable workflow instead reads
# secrets.GH_PERSONAL_ACCESS_TOKEN (confirmed present on this repo), so
# `secrets: inherit` should fix CLA-signature posting rather than change
# intended behavior.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    secrets: inherit
