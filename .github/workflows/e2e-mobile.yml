name: E2E Mobile Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Supersede a pull request's own earlier runs, which nobody will read once a
# newer commit exists. Keyed per workflow per ref, so different PRs never
# cancel each other.
#
# cancel-in-progress is TRUE ONLY FOR pull_request. A push to main or develop
# is never cancelled: back-to-back merges would otherwise kill the earlier
# merge's run, and anything treating a develop run as a gate would lose it
# silently. Superseding an in-flight PR run is free; superseding a branch run
# is a decision nobody made.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright-mobile:
    name: Playwright Mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scitex_test
          POSTGRES_USER: scitex
          POSTGRES_PASSWORD: scitex_test_pass  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -e ".[all,dev]" || pip install -e ".[dev]" || pip install -e .

      - name: Install sibling workspace apps (scitex-ui, figrecipe)
        # package.json declares file:../scitex-ui and
        # file:../figrecipe/src/figrecipe/_django/frontend — both must exist
        # as siblings before `npm install` so that vite.config.ts's bridge
        # auto-discovery can register the `figrecipe-editor` alias.
        # install_apps.sh is the canonical script (same one tests.yml's
        # typescript-check job uses) and handles every app declared in
        # .scitex-apps.json, so new apps added later pick this up for free.
        run: bash scripts/apps/install_apps.sh

      - name: Install Node dependencies & build
        run: |
          npm install
          npm run build

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Create test user & start server
        env:
          SCITEX_HUB_DJANGO_SECRET_KEY: ci-e2e-test-key  # pragma: allowlist secret
          # settings_dev.py reads the _DEV-suffixed variants, not the bare names
          SCITEX_HUB_DB_NAME_DEV: scitex_test
          SCITEX_HUB_DB_USER_DEV: scitex
          SCITEX_HUB_DB_PASSWORD_DEV: scitex_test_pass  # pragma: allowlist secret
          SCITEX_HUB_DB_HOST_DEV: localhost
          SCITEX_HUB_DB_PORT_DEV: "5432"
          SCITEX_HUB_REDIS_URL: redis://localhost:6379/0
          SCITEX_HUB_ENV: development
          SCITEX_HUB_GITEA_SSH_PORT_DEV: "2222"
          # THIS RUNNER HAS NO VITE DEV SERVER. Without this line the job serves
          # a product with NONE of its JavaScript loaded.
          #
          # `vite_script` (public_app/templatetags/vite.py) branches on
          # `settings.DEBUG and not VITE_USE_BUILD`: in that branch it emits a
          # <script> pointing at http://<host>:5173/<entry>.ts -- the HOST Vite
          # dev server. DEBUG is 1 below and nothing serves 5173 on a runner, so
          # every entry silently fails to load and the `npm run build` step
          # above produces a manifest nobody reads.
          #
          # screenshots.yml carries this same line and records what its absence
          # measured (2026-08-17, run 32054829708): "#app-mount rendered
          # 1910x1015 px with ZERO children", "#section-selector-text still
          # 'Loading...'", "Docs 'Loading documentation...' still on screen" --
          # three separate "broken page" reports, one cause, and no 500s to
          # point at it.
          #
          # OBSERVED HERE 2026-09-06, artifact 9986225976 from job
          # 101458943232: /apps/scholar/ photographed as a shell stuck on
          # "Loading...". Same signature, same missing flag.
          #
          # It also upgrades the failure mode: on a manifest miss
          # `_manifest_miss` RAISES under DEBUG, so a missing entry becomes a
          # loud 500 rather than a shell rendered over nothing.
          SCITEX_HUB_VITE_USE_BUILD: "1"
          DEBUG: "1"
        run: |
          python manage.py migrate --run-syncdb
          python manage.py shell -c "
          from django.contrib.auth.models import User
          u, created = User.objects.get_or_create(
              username='test-user',
              defaults={'email': 'test@example.com'}
          )
          u.set_password('Password123!')
          u.save()
          print(f'Test user ready (created={created})')
          "
          # `from_docker` is manage.py's own escape hatch, not a trick to get
          # around it: the guard at manage.py:19-23 fires on a bare
          # `runserver`, and manage.py:70-73 strips this token before Django
          # sees argv. Without it the server NEVER STARTS in CI, which is what
          # this workflow had been doing since it was created on 2026-03-30 —
          # the guard predates the workflow by five months, so this job has
          # never run a test. --noreload because the autoreloader forks a
          # child, making a backgrounded server unkillable by its own PID.
          # Same form screenshots.yml and docker-compose.preview.yml use.
          python manage.py runserver 127.0.0.1:8000 --noreload from_docker \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"

          # The old wait loop had nothing after it: 30 failed curls still
          # exited 0, so a server that never started reached the test step and
          # every test SKIPPED — reported as a green job. `served` is the whole
          # point: the loop RECORDS whether it succeeded and the step fails on
          # that record rather than on nothing.
          #
          # THE TRACING BELOW IS NOT DEBUG LEFTOVER, AND THE REASON IS A
          # CORRECTION TO MY OWN EARLIER READING OF THIS STEP.
          #
          # After the first live run (job 101431112671) I recorded here that
          # "the server did not start, the loop stopped after 3 of 60
          # iterations, neither ::error:: branch printed, and the step still
          # reported SUCCESS". EVERY PART OF THAT WAS WRONG, and the next run
          # with these diagnostics proved it:
          #
          #     RUNNER_TEMP=[/home/runner/work/_temp]   not empty
          #     pidfile=[5783]                          written fine
          #     wait loop finished: served=1 after attempt=4
          #
          # `curl -fsS` IS SILENT ON SUCCESS. Three failing attempts printed
          # `curl: (7)`; the fourth succeeded and printed NOTHING. I read that
          # silence as the loop stopping. The step's success was correct and the
          # guard had nothing to fire on.
          #
          # So the tracing stays for the opposite reason to the one I first
          # gave: not because the step lies about its outcome, but because I
          # cannot read this step's outcome from its default output. Every
          # silencing flag (-s, -q, 2>/dev/null) turns a successful run into
          # evidence of nothing, so the state is printed UNCONDITIONALLY.
          #
          # AND THE SKIPS ARE NOT CAUSED BY THE SERVER. With served=1 all 11
          # tests still skipped, so the cause is a fixture precondition,
          # undiagnosed as of this commit. Do not re-derive "server down" from
          # a skip count.
          echo "RUNNER_TEMP=[$RUNNER_TEMP]"
          echo "pidfile=[$(cat "$RUNNER_TEMP/server.pid" 2>&1)]"
          echo "server.log exists: $(test -f "$RUNNER_TEMP/server.log" && echo yes || echo NO)"

          set -x
          served=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/auth/login/ -o /dev/null; then
              served=1
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null; then
              echo "::error::server process exited before answering (attempt $attempt)"
              break
            fi
            sleep 2
          done
          set +x
          echo "wait loop finished: served=$served after attempt=${attempt:-none}"

          echo "=== server.log, printed unconditionally ==="
          cat "$RUNNER_TEMP/server.log" 2>&1 || echo "(no server.log to read)"
          echo "=== end server.log ==="

          if [ "$served" -ne 1 ]; then
            echo "::error::server never answered /auth/login/"
            exit 1
          fi

      - name: Run Playwright mobile tests
        env:
          SCITEX_HUB_DJANGO_SECRET_KEY: ci-e2e-test-key  # pragma: allowlist secret
          SCITEX_HUB_DB_NAME_DEV: scitex_test
          SCITEX_HUB_DB_USER_DEV: scitex
          SCITEX_HUB_DB_PASSWORD_DEV: scitex_test_pass  # pragma: allowlist secret
          SCITEX_HUB_DB_HOST_DEV: localhost
          SCITEX_HUB_DB_PORT_DEV: "5432"
          SCITEX_HUB_REDIS_URL: redis://localhost:6379/0
          SCITEX_HUB_ENV: development
          SCITEX_HUB_GITEA_SSH_PORT_DEV: "2222"
          SCITEX_BASE_URL: http://127.0.0.1:8000
          SCITEX_E2E_TEST_USER: test-user
          SCITEX_E2E_TEST_PASS: "Password123!"
          DEBUG: "1"
        run: |
          # `--browser chromium` IS THE WHOLE REASON THIS JOB RAN ZERO TESTS.
          # Not the server, not a fixture. tests/conftest.py:276 installs a
          # collection hook that skip-marks EVERY item under tests/e2e/, every
          # item marked `e2e`, and every item requesting a Playwright fixture —
          # unless `--browser` was supplied:
          #
          #     browser_requested = bool(config.getoption("--browser"))
          #     if browser_requested:
          #         return                      # e2e tests run untouched
          #     ...
          #     item.add_marker(skip_e2e)       # otherwise ALL of them skip
          #
          # That hook exists for a good reason: a plain `pytest tests/` in the
          # headless release gate would otherwise launch a real browser and
          # crash. The opt-out is deliberate. THIS workflow is the one caller
          # that is supposed to opt IN, and it stopped passing the flag.
          #
          # The conftest even documents the contract from its side — "The 'E2E
          # Mobile Tests' workflow drives the browser tests explicitly: it
          # clears addopts with -o addopts= and passes --browser (plus
          # --headed=false ...)". This file clears addopts, so half the
          # contract was honoured; `--headed=false` was removed as an argparse
          # error (correctly — it is a store_true flag), and `--browser` was
          # not here either. A contract written down on one side and dropped on
          # the other FAILS SILENTLY, because the penalty for missing it is a
          # skip, and a skip is not a failure.
          #
          # So this single flag is the fix, and the MIN_EXECUTED guard below is
          # what turns a future regression of it back into a red job instead of
          # a green one. Keep both: the flag makes the tests run, the guard
          # proves they ran.
          #
          # `-rs` prints the REASON for every skip in the summary. Without it
          # `-v` prints a bare "SKIPPED" and the log cannot tell you which
          # precondition fired — which is exactly why this took a diagnosis
          # instead of a read. If tests skip again, the log will now say why.
          #
          # `--headed` is a store_true flag; `--headed=false` is an argparse
          # error ("ignored explicit argument 'false'", exit=4). Headless is
          # the default, so the flag is simply omitted.
          python -m pytest \
            tests/e2e/playwright/test_mobile_workspace.py \
            tests/e2e/playwright/test_mobile_scholar.py \
            tests/e2e/playwright/test_mobile_writer.py \
            tests/e2e/playwright/test_mobile_app_store_controls_are_reachable.py \
            --browser chromium \
            -v -rs --tb=short \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            -o "addopts=" \
            --junit-xml="$RUNNER_TEMP/e2e-mobile.xml" \
            --timeout=120

          # A SKIP IS NOT A FAILURE, so pytest exits 0 when every test skips
          # and the job goes green having verified nothing. That is exactly
          # what this workflow did from 2026-03-30 until this commit: 14
          # collected, 14 skipped, 0 executed, 0.06s, PASS.
          #
          # Asserting on COLLECTED would not have caught it — all 14 were
          # collected. Only EXECUTED distinguishes the two, so that is what is
          # asserted here.
          #
          # Reading the junit XML rather than grepping pytest's summary line:
          # the summary is human-readable text whose wording changes between
          # pytest versions, and a guard that silently stops matching is the
          # same defect one layer up.
          python - "$RUNNER_TEMP/e2e-mobile.xml" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET

          # Floor, not an exact count: new tests get added and this must not
          # become a chore that the next author lowers. It exists to separate
          # "the suite ran" from "the suite was skipped", nothing finer.
          MIN_EXECUTED = 5

          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          executed = total - skipped

          print(f"collected={total} skipped={skipped} executed={executed}")
          if executed < MIN_EXECUTED:
              print(
                  f"::error::only {executed} mobile E2E test(s) actually ran "
                  f"({skipped} of {total} skipped), so the suite verified "
                  "nothing. The tests were COLLECTED and then SKIPPED, which "
                  "is a precondition firing, not a test failure. FIRST look at "
                  "the '-rs' short summary printed just above: it names the "
                  "reason for every skip, so this should not need diagnosis. "
                  "THE KNOWN CAUSE, seen 2026-09-06: the pytest invocation "
                  "lost '--browser chromium', and tests/conftest.py's "
                  "pytest_collection_modifyitems skip-marks everything under "
                  "tests/e2e/ unless --browser is supplied. If the summary "
                  "says 'skipped in headless gate', that flag is missing again "
                  "— restore it rather than touching anything else. "
                  "DO NOT lower MIN_EXECUTED to get a green; that restores the "
                  "exact defect this check exists to catch."
              )
              sys.exit(1)
          PYEOF

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-mobile-results
          path: |
            GITIGNORED/e2e_screenshots/
            test-results/
          retention-days: 7
