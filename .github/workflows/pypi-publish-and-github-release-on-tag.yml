name: release

# Tag-driven release pipeline. The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest. Must pass or the pipeline halts;
#                      nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist, uploaded as workflow artifact.
#   3. publish       — PyPI via OIDC trusted publisher.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#   5. sync-main     — open a develop→main PR (admin-merge) so main
#                      always equals the latest released commit. Skipped
#                      if main already matches.
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  test:
    # Plain Python, no privileged step — the same shape the push/PR pytest
    # matrix already runs green on this pool, so this one is migrated rather
    # than exempted.
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install (best-effort fallback chain)
        # uv venv, not bare pip: the pool's toolcache Python is uv-managed and
        # refuses pip under PEP 668, and these runners are org-pooled so the
        # shared interpreter must not be mutated. --seed so the venv carries a
        # real pip for anything downstream that shells it.
        run: |
          uv venv --seed --python ${{ matrix.python-version }} .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          P=.venv/bin/python
          uv pip install --python $P -e ".[all,dev]" \
            || uv pip install --python $P -e ".[dev]" \
            || uv pip install --python $P -e .
      - name: Run pytest
        # Django settings hard-fail (ValueError, per "no silent fallback")
        # if SCITEX_HUB_DJANGO_SECRET_KEY is unset. CI doesn't need a real
        # secret, so we set an obviously-fake one for the test process only.
        env:
          SCITEX_HUB_DJANGO_SECRET_KEY: ci-test-secret-do-not-use-in-prod  # pragma: allowlist secret
          # settings_dev.py L233: require_env("SCITEX_HUB_GITEA_SSH_PORT_DEV")
          # (already set in tests.yml; mirror it here so the release-tag
          # pipeline matches the push/PR matrix).
          SCITEX_HUB_GITEA_SSH_PORT_DEV: "2222"
          # settings_dev.py L189-194: when SCITEX_HUB_USE_SQLITE_DEV is set,
          # Django uses a local sqlite file instead of the postgres service
          # we don't run in this CI job (no `services: postgres:14` block).
          # Tests that need postgres behaviour will skip/xfail naturally;
          # the goal of this gate is to confirm the wheel + import chain.
          SCITEX_HUB_USE_SQLITE_DEV: "1"
        run: |
          if [ -d tests ]; then
            pytest tests/ -x
          else
            echo "no tests/ directory — skipping pytest"
          fi

  build:
    needs: test
    # Same reasoning as `test`: a pure `python -m build`, nothing privileged.
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install build tools
        # See `test` above for why this is uv-in-a-venv and not bare pip.
        run: |
          uv venv --seed --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python build
      - name: Build distribution
        run: .venv/bin/python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-hub
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*

  sync-main:
    # Open develop→main PR so main always equals the latest released
    # commit. Branch-protected mains require PR review; this job tries
    # admin-merge but leaves the PR open if that isn't allowed.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
      - name: Open develop→main PR if diverged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "main already up-to-date with develop."
            exit 0
          fi
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            PR_URL=$(gh pr create --base main --head develop \
              --title "release: sync main with develop" \
              --body "Auto-opened by the release pipeline so main equals the latest released commit.")
            EXISTING=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #${EXISTING}"
          else
            echo "Reusing existing PR #${EXISTING}"
          fi
          gh pr merge "$EXISTING" --merge --admin \
            || echo "Admin merge unavailable; PR left open for manual merge."
