name: release

# Tag-driven release pipeline. The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest. Must pass or the pipeline halts;
#                      nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist, uploaded as workflow artifact.
#   3. publish       — PyPI via OIDC trusted publisher.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#   5. sync-main     — open a develop→main PR for ordinary review so main
#                      always equals the latest released commit. Skipped
#                      if main already matches.
#
# An explicit workflow_dispatch can select an existing immutable tag; it does
# not move tags or bypass tests, protected environments or ordinary review.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  test:
    # Reuse the complete admitted PostgreSQL/frontend/Python matrix. Publication
    # must not run a cheaper second suite with a different dependency profile.
    uses: ./.github/workflows/pytest-matrix-on-ubuntu-py3-11-3-12-3-13.yml
    with:
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    secrets: inherit

  build:
    needs: test
    # Same reasoning as `test`: a pure `python -m build`, nothing privileged.
    runs-on: [self-hosted, Linux, X64, scitex-docker]
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - name: Verify tag and package version
        id: release_metadata
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.version }}
        run: python3 .github/ci/check_release_version.py --tag "$RELEASE_TAG"
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install build tools
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/hub-managed-python-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-3.12
        # See `test` above for why this is uv-in-a-venv and not bare pip.
        run: |
          uv venv --seed --managed-python --python 3.12 .venv
          .venv/bin/python -c "import sysconfig; sysconfig.get_config_vars(); print('managed Python sysconfig OK')"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python build
      - name: Build distribution
        run: .venv/bin/python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64, scitex-docker]
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-hub
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: [self-hosted, Linux, X64, scitex-docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$RELEASE_PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ needs.build.outputs.version }}" "${flags[@]}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*

  sync-main:
    # Open develop→main PR so main always equals the latest released
    # commit. Branch protection and ordinary review remain authoritative;
    # publication never grants permission to merge a branch.
    needs: publish
    runs-on: [self-hosted, Linux, X64, scitex-docker]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
      - name: Open develop→main PR if diverged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "main already up-to-date with develop."
            exit 0
          fi
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            PR_URL=$(gh pr create --base main --head develop \
              --title "release: sync main with develop" \
              --body "Auto-opened by the release pipeline so main equals the latest released commit.")
            EXISTING=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #${EXISTING}"
          else
            echo "Reusing existing PR #${EXISTING}"
          fi
          echo "PR #${EXISTING} remains open for normal review and CI."
