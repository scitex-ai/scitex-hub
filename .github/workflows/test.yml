name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps + test plugins
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          # [django] is required at runtime — settings.INSTALLED_APPS
          # references daphne which lives in that extra. [dev] alone is
          # insufficient. Fallback chain: [django,dev] → [django] → bare.
          pip install -e ".[django,dev]" || pip install -e ".[django]" || pip install -e .
      - name: Detect import name
        id: pkg
        run: |
          IMPORT_NAME=$(find src -maxdepth 2 -name __init__.py -printf '%h\n' | head -1 | xargs -n1 basename)
          echo "import_name=${IMPORT_NAME}" >> "$GITHUB_OUTPUT"
      - name: Run tests with coverage
        env:
          SCITEX_CLOUD_DJANGO_SECRET_KEY: "ci-test-secret-not-for-production-use-only"  # pragma: allowlist secret
          DJANGO_SETTINGS_MODULE: config.settings.settings_dev
          SCITEX_CLOUD_USE_SQLITE_DEV: "1"
          SCITEX_CLOUD_GITEA_SSH_PORT_DEV: "2222"
          SCITEX_CLOUD_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: |
          # Skip e2e + UI tests — they require a live Django server on
          # 127.0.0.1:8000 and a Playwright Chromium runtime, neither of
          # which the standard CI matrix sets up. Those tests run in the
          # E2E Mobile Tests workflow with proper service orchestration.
          python -m pytest "$GITHUB_WORKSPACE/tests/" -v --tb=short --timeout=120 \
            --ignore="$GITHUB_WORKSPACE/tests/e2e" \
            --ignore="$GITHUB_WORKSPACE/tests/ui" \
            --cov=src/${{ steps.pkg.outputs.import_name }} \
            --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  install-check:
    # Catches undeclared runtime deps that the package's own test suite
    # misses — a package can pass its own tests with the wrong
    # pyproject.toml; the bug only shows up when a fresh user runs
    # `pip install <pkg>` in a clean venv. Reproduces that path.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install + import in a fresh venv
        run: |
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install --upgrade pip
          /tmp/clean-venv/bin/pip install dist/*.whl
          IMPORT_NAME=$(find src -maxdepth 2 -name __init__.py -printf '%h\n' \
                          | head -1 | xargs -n1 basename)
          if [ -z "$IMPORT_NAME" ]; then
              echo "Could not detect import name under src/" >&2
              exit 1
          fi
          echo "Importing $IMPORT_NAME ..."
          /tmp/clean-venv/bin/python -c "import ${IMPORT_NAME}; print(f'OK: {${IMPORT_NAME}.__name__}')"
      - name: Audit declared deps vs actual imports (best-effort)
        continue-on-error: true
        run: |
          /tmp/clean-venv/bin/pip install scitex-dev 2>/dev/null || (
              echo "scitex-dev not installable on this Python; skipping"
              exit 0
          )
          /tmp/clean-venv/bin/python -c "
          try:
              from scitex_dev import audit_dependencies
          except ImportError:
              import sys; sys.exit(0)
          rep = audit_dependencies('.')
          print(rep)
          import sys
          sys.exit(0 if rep.is_clean else 1)
          "
