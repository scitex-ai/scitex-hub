name: CodeQL Security Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM

jobs:
  analyze:
    name: Analyze Code
    # VERIFICATION, not an assumption. I claimed earlier that codeql "needs
    # its toolcache" and had NOT measured it — this job is how that gets
    # settled. CodeQL for python/javascript is interpreted (autobuild is a
    # no-op for both), the action downloads its own bundle, and nothing here
    # needs root, so it SHOULD run on the unprivileged pool. If it does not,
    # revert this hunk and exempt with the measured reason.
    # This is currently a GREEN check, so the risk is real and accepted
    # deliberately: an exemption I cannot justify by measurement is just a
    # skip_rules entry with better manners.
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    permissions:
      actions: read
      contents: read
      security-events: write
      # Needed to PULL the barrier pack from ghcr. The package is PRIVATE
      # (measured: `gh api orgs/scitex-ai/packages/container/python-security-barriers`
      # -> visibility=private), so an unauthenticated pull cannot see it.
      packages: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CodeQL's JS/TS extractor SHELLS OUT to `node` and does not ship one.
      # On GitHub-hosted runners node is preinstalled, so nothing here ever
      # had to declare it. Measured on spartan (run 30335621068): the python
      # leg passed, the javascript leg died in
      #   TypeScriptParser.verifyNodeInstallation
      #   -> "Please install Node.js and ensure 'node' is on the PATH."
      # This is a FIX, not grounds for an exemption: the dependency was
      # always there, the old runner just supplied it invisibly. vitest
      # already proved setup-node works on this pool.
      - name: Set up Node.js (JS/TS extractor requires it)
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # THE BARRIER PACK IS LOADED HERE. It took three attempts to get this
      # far, each of which LOOKED like it had worked, so the history is kept:
      #
      #   1. `packs: scitex-hub/python-security-barriers` failed at `database
      #      init` with "not found in the registry 'https://ghcr.io/v2/'".
      #      Read at the time as "local packs cannot be loaded via packs:".
      #      True, but not the whole story — `scitex-hub` is the REPOSITORY
      #      name; the org is `scitex-ai`, so that coordinate never existed.
      #   2. PR #558 repaired the access path INSIDE the pack. Correct fix,
      #      wrong layer: nothing loaded the pack, so it suppressed nothing.
      #   3. PR #561 published it to ghcr. The run went green and the package
      #      exists — but PRIVATE, which is why `registries:` below is not
      #      optional.
      #
      # `packs:` is python-only ON PURPOSE. codeql-pack.yml declares
      # `extensionTargets: {codeql/python-all: '*'}`, so handing this pack to
      # the javascript leg asks CodeQL to load a python extension into a JS
      # analysis. The matrix runs both languages, hence the conditional.
      #
      # HOW TO TELL IT ACTUALLY BOUND — do NOT trust a green run. MaD silently
      # ignores entries it cannot resolve, so "loaded but unbound" and
      # "working" are indistinguishable in the log. The real test is red->green
      # on alerts sitting on sites that call the modelled validators:
      #   project_app/views/repository/file_view.py:104
      #   project_app/views/repository/file_edit.py:69
      #   project_app/views/directory_views/file_view_utils.py:61
      #   project_app/views/api/directory_concatenation.py:76
      #   llm_app/views/upload.py:125
      #   figrecipe_app/urls/figrecipe.py:175, :190
      # A survivor is not automatically a failure: the model guards
      # `Argument[1,target_path:]`, so a site validating a DIFFERENT variable
      # than the one reaching the sink stays flagged legitimately. Inspect the
      # call before calling it a regression.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          packs: ${{ matrix.language == 'python' && 'scitex-ai/python-security-barriers' || '' }}
          registries: |
            - url: https://ghcr.io
              packages: scitex-ai/*
              token: ${{ secrets.GITHUB_TOKEN }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
