name: CodeQL Security Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM

jobs:
  analyze:
    name: Analyze Code
    # VERIFICATION, not an assumption. I claimed earlier that codeql "needs
    # its toolcache" and had NOT measured it — this job is how that gets
    # settled. CodeQL for python/javascript is interpreted (autobuild is a
    # no-op for both), the action downloads its own bundle, and nothing here
    # needs root, so it SHOULD run on the unprivileged pool. If it does not,
    # revert this hunk and exempt with the measured reason.
    # This is currently a GREEN check, so the risk is real and accepted
    # deliberately: an exemption I cannot justify by measurement is just a
    # skip_rules entry with better manners.
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CodeQL's JS/TS extractor SHELLS OUT to `node` and does not ship one.
      # On GitHub-hosted runners node is preinstalled, so nothing here ever
      # had to declare it. Measured on spartan (run 30335621068): the python
      # leg passed, the javascript leg died in
      #   TypeScriptParser.verifyNodeInstallation
      #   -> "Please install Node.js and ensure 'node' is on the PATH."
      # This is a FIX, not grounds for an exemption: the dependency was
      # always there, the old runner just supplied it invisibly. vitest
      # already proved setup-node works on this pool.
      - name: Set up Node.js (JS/TS extractor requires it)
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The MaD barrier pack under .github/codeql/extensions/ is NOT auto-detected.
      # It shipped in #461 and did nothing for two weeks because nothing referenced
      # it: this step had no `packs:` and no `config-file:`, and the Python analysis
      # log never mentioned the pack. (The only log hits were the JAVASCRIPT
      # extractor reading the YAML as source, which reads like the pack loading and
      # is the opposite.) `packs:` is what loads it; codeql-workspace.yml at the
      # repo root is what lets a LOCAL, unpublished pack resolve by scope/name
      # instead of by path.
      #
      # Scoped to python only: the pack's extensionTargets is codeql/python-all, so
      # handing it to the javascript analysis would fail to resolve.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          packs: ${{ matrix.language == 'python' && 'scitex-hub/python-security-barriers' || '' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
