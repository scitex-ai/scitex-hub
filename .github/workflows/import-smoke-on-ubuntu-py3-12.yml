name: import-smoke

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers preserved verbatim from the prior local file. Body replaced with
# a thin call into scitex-ai/.github's import-smoke.yml reusable workflow
# (same purpose: bare `pip install -e .` + `import scitex_hub` smoke check
# — confirmed scitex_hub/__init__.py only reads package metadata for
# __version__, no Django settings dependency, so this converts cleanly
# unlike the pytest-matrix job — see PR description).
# New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
# (not currently in this repo's required-checks list — see PR description).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit
