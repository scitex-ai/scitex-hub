name: Tests

on:
  push:
    branches: [ main, develop, refactor/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  typescript-check:
    name: TypeScript Compilation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workspace apps
        run: pip install "scitex-ui>=0.2.0" && bash scripts/apps/install_apps.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build with Vite
        run: npm run build

  vitest:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:run

  terminal-tests:
    name: "Terminal Broker & Session Tests (Python)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[django,dev,test]"

      - name: Run terminal tests
        env:
          SCITEX_HUB_DJANGO_SECRET_KEY: ci-test-key  # pragma: allowlist secret
          SCITEX_HUB_GITEA_SSH_PORT_DEV: "2222"
        run: |
          python -m pytest \
            tests/apps/console_app/views/terminal/ \
            tests/apps/console_app/services/terminal_broker/ \
            -v --tb=short -p no:playwright -o "addopts="

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [typescript-check, vitest, terminal-tests]
    if: always()

    steps:
      - name: Check results
        run: |
          TS_RESULT="${{ needs.typescript-check.result }}"
          TEST_RESULT="${{ needs.vitest.result }}"
          TERMINAL_RESULT="${{ needs.terminal-tests.result }}"

          echo "TypeScript: $TS_RESULT"
          echo "Vitest: $TEST_RESULT"
          echo "Terminal Tests: $TERMINAL_RESULT"

          if [ "$TS_RESULT" == "failure" ]; then
            echo "TypeScript checks failed"
            exit 1
          fi

          if [ "$TEST_RESULT" == "failure" ]; then
            echo "Vitest tests failed"
            exit 1
          fi

          if [ "$TERMINAL_RESULT" == "failure" ]; then
            echo "Terminal tests failed"
            exit 1
          fi

          echo "CI checks completed"
