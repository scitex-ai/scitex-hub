name: Tests

on:
  push:
    branches: [ main, develop, refactor/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  typescript-check:
    name: TypeScript Compilation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workspace apps
        run: pip install "scitex-ui>=0.2.0" && bash scripts/apps/install_apps.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build with Vite
        run: npm run build

  vitest:
    name: Vitest Unit Tests
    # NODE CANARY for the spartan migration. The Python path is proven on
    # this pool (audit + the three pytest legs), but nothing here has run
    # actions/setup-node on a self-hosted runner yet — it has to populate
    # the runner's toolcache rather than use a preinstalled one. This job
    # is the cheapest node-only probe in the repo (npm install + vitest, no
    # Python, no browsers), so it answers "does node work here" without
    # risking the four other tests.yml jobs at the same time.
    # If this goes green, typescript-check can follow; if it fails, we learn
    # what the runner image lacks from one job instead of five.
    runs-on: [self-hosted, Linux, X64, spartan-cpu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:run

  terminal-tests:
    name: "Terminal Broker & Session Tests (Python)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # No silent degradation: these tests need the FULL dependency set
        # (config/__init__ imports celery; pytest-django provides
        # django.setup() at collection). The old `|| .[dev] || .` fallback
        # meant a transient PyPI error (e.g. IncompleteRead in run
        # 28838625586) silently produced an env that cannot run the suite,
        # failing collection with confusing ModuleNotFoundError /
        # AppRegistryNotReady errors. Retry the full install instead and
        # fail loudly if it never succeeds.
        run: |
          for attempt in 1 2 3; do
            if pip install -e ".[all,dev]"; then
              exit 0
            fi
            echo "::warning::pip install -e .[all,dev] attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::pip install -e .[all,dev] failed after 3 attempts"
          exit 1

      - name: Verify test environment is complete
        run: python -c "import celery, pytest_django; print('terminal-test env OK')"

      - name: Run terminal tests
        env:
          SCITEX_HUB_DJANGO_SECRET_KEY: ci-test-key  # pragma: allowlist secret
          SCITEX_HUB_GITEA_SSH_PORT_DEV: "2222"
        run: |
          python -m pytest \
            tests/apps/console_app/views/terminal/ \
            tests/apps/console_app/services/terminal_broker/ \
            -v --tb=short -p no:playwright -o "addopts="

  security-regression:
    name: "Security Regression Gates (tests/security/)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Same no-silent-degradation policy as terminal-tests: retry the
        # FULL install and fail loudly rather than run a security gate
        # against a half-installed environment.
        run: |
          for attempt in 1 2 3; do
            if pip install -e ".[all,dev]"; then
              exit 0
            fi
            echo "::warning::pip install -e .[all,dev] attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::pip install -e .[all,dev] failed after 3 attempts"
          exit 1

      - name: Verify test environment is complete
        run: python -c "import celery, pytest_django; print('security-test env OK')"

      - name: Run security regression suite
        # Each test here reproduces a CONFIRMED exploit and asserts it is
        # blocked. Operator directive (2026-07-22): "a gate that cannot
        # fail is not a gate" — this job is PR-blocking via test-summary.
        env:
          SCITEX_HUB_DJANGO_SECRET_KEY: ci-test-key  # pragma: allowlist secret
          SCITEX_HUB_GITEA_SSH_PORT_DEV: "2222"
          # Some regression tests are now BEHAVIOURAL (they build real
          # tenants and execute the view against the DB — e.g.
          # test_comms_participant_tenant_scope.py) rather than source-text
          # gates. No Postgres runs in this job, so switch Django to an
          # in-memory sqlite test DB, same as the pytest-matrix job. The
          # DB-free tests here are unaffected (they never open a connection).
          SCITEX_HUB_USE_SQLITE_DEV: "1"
        run: |
          python -m pytest \
            tests/security/ \
            -v --tb=short -p no:playwright -o "addopts=" \
            -m security --strict-markers

      - name: Fail if the security suite collected nothing
        # A suite that silently collects 0 tests is a gate that cannot
        # fail. Assert it is non-empty, independently of the run above.
        env:
          SCITEX_HUB_DJANGO_SECRET_KEY: ci-test-key  # pragma: allowlist secret
          SCITEX_HUB_GITEA_SSH_PORT_DEV: "2222"
          SCITEX_HUB_USE_SQLITE_DEV: "1"
        run: |
          COUNT=$(python -m pytest tests/security/ -m security \
            -p no:playwright -o "addopts=" --collect-only -q 2>/dev/null \
            | grep -c '::' || true)
          echo "collected security tests: ${COUNT}"
          if [ "${COUNT}" -lt 1 ]; then
            echo "::error::tests/security/ collected 0 tests — the security gate cannot fail"
            exit 1
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [typescript-check, vitest, terminal-tests, security-regression]
    if: always()

    steps:
      - name: Check results
        run: |
          TS_RESULT="${{ needs.typescript-check.result }}"
          TEST_RESULT="${{ needs.vitest.result }}"
          TERMINAL_RESULT="${{ needs.terminal-tests.result }}"
          SECURITY_RESULT="${{ needs.security-regression.result }}"

          echo "TypeScript: $TS_RESULT"
          echo "Vitest: $TEST_RESULT"
          echo "Terminal Tests: $TERMINAL_RESULT"
          echo "Security Regression: $SECURITY_RESULT"

          # Every leg below uses `!= "success"`, never `== "failure"`.
          # A job result is one of success / failure / cancelled /
          # skipped, so `== "failure"` lets a cancelled or skipped job
          # pass the summary — a gate that cannot fail. None of these
          # three jobs carries an `if:` condition or a paths filter, so
          # there is no legitimate skip to tolerate: anything other than
          # success means the check did not actually run green.
          if [ "$TS_RESULT" != "success" ]; then
            echo "TypeScript checks did not pass (result: $TS_RESULT)"
            exit 1
          fi

          if [ "$TEST_RESULT" != "success" ]; then
            echo "Vitest tests did not pass (result: $TEST_RESULT)"
            exit 1
          fi

          if [ "$TERMINAL_RESULT" != "success" ]; then
            echo "Terminal tests did not pass (result: $TERMINAL_RESULT)"
            exit 1
          fi

          # A security regression gate that is skipped or cancelled is
          # not a gate — only "success" is acceptable here.
          if [ "$SECURITY_RESULT" != "success" ]; then
            echo "Security regression gates did not pass (result: $SECURITY_RESULT)"
            exit 1
          fi

          echo "CI checks completed"
