name: quality

# Audit this package with the native pytest wrapper and its declared deferrals.
# The full source tree triggers the gate on each develop push and pull request.

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC (~03:00 JST), after Test
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

# Replace superseded PR runs; preserve every branch-push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    # Trusted runs use the local pool. Fork code uses ephemeral hosted runners.
    runs-on: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted","Linux","X64","scitex-local-cpu"]') }}
    timeout-minutes: 20
    steps:
      # Backstop for the runs-on predicate: never check out fork code on our hardware.
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          runner.environment == 'self-hosted'
        run: |
          echo "::error::Fork-authored code is not run on self-hosted runners."
          exit 1

      - uses: actions/checkout@v4

      # Install into an isolated venv; never mutate the shared runner interpreter.
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install package + audit tooling
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          # Keep the audit corpus reviewable and consistent with the current
          # package floor. Existing deferrals remain in .scitex/dev/config.yaml.
          uv pip install --python .venv/bin/python "scitex-dev[cli-audit]==0.62.2"
          uv pip check --python .venv/bin/python

      # Existing deferrals and their ratchet remain in the owning test/config.
      # Unknown violations must fail; changing the corpus does not add exemptions.
      - name: Run audit via pytest wrapper (honors skip_rules)
        run: |
          set -euo pipefail
          # .venv/bin on PATH so the `scitex-dev` subcommands that audit-all
          # spawns resolve to the pinned one, not to anything on the shared
          # runner's PATH.
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/python -m pytest tests/develop/test_audit.py -q --no-header
