name: quality

# Single-package quality gate — runs `scitex-dev ecosystem audit-all`
# against this package (audit-cli / audit-mcp-tools / audit-skills /
# audit-python-apis / audit-project). Mirrors the canonical audit that
# `tests/develop/test_audit.py` runs inside the test suite, but as a
# standalone gate so an audit regression is visible even when the matrix
# is skipped.
#
# The previous body of this workflow shallow-cloned the entire ecosystem
# and ran `scripts/quality/audit_ecosystem.py` — both of which live only
# in scitex-dev, not in leaf packages. That template was copied here
# verbatim and was always broken (FileNotFoundError on a non-existent
# ecosystem registry file). This version audits just this package.

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC (~03:00 JST), after Test
  workflow_dispatch:
  push:
    branches: [develop]
    # NO `paths:` filter, deliberately. This previously listed only
    # src/**, tests/**, pyproject.toml and this file — but scitex-hub is
    # a Django app whose code lives almost entirely in apps/**, config/**,
    # templates/** and scripts/**. None of those triggered the audit, so
    # the gate's "green on develop" record was measured over a filtered
    # sample that excluded nearly every real commit. A gate that does not
    # run on the code is not a gate. The audit takes ~2 min; running it on
    # every develop push is the correct trade.
    # The filter also referenced this workflow BY FILENAME, so any rename
    # would have silently stopped self-triggering — a second reason the
    # list is gone rather than merely extended.
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    # CANARY for the ubuntu-latest -> spartan migration (21 jobs across 10
    # files still to move; card ci-hub-runs-22-jobs-on-paid-github-runners).
    # This job goes FIRST deliberately because it is ALREADY RED — if the
    # self-hosted runner lacks the setup-python toolcache, or anything else
    # about the host differs, this job fails, which it is already doing, so
    # the canary cannot make CI worse than it is. Migrating a currently-GREEN
    # job first would risk turning a passing check red to learn the same fact.
    # Verify this runs green here BEFORE moving the other 14 safe jobs, and
    # especially before touching the tag-triggered release pipeline.
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # uv, not setup-python + bare pip. The spartan runner's toolcache
      # Python is uv-managed, so `pip install` into it dies with PEP 668
      # "error: externally-managed-environment ... managed by uv"
      # (measured on run 30329643093, runner spartan-cpu-org-02). The fix
      # is a venv, NOT --break-system-packages: these runners are ORG-POOLED,
      # so mutating the shared interpreter would corrupt Python for every
      # other repo's jobs on that host.
      # This install shape is the fleet convention — copied from the org
      # reusable workflows in scitex-ai/.github, which already run on these
      # runners (hub's import-smoke calls one and is consistently green).
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install package + audit tooling
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          # PINNED DELIBERATELY. Unpinned, this line makes the gate
          # non-reproducible: the rule corpus IS the definition of passing, so
          # a scitex-dev release silently redefines it with no diff in this
          # repo. Measured 2026-07-28 — develop @ fa16e8eb4 audited GREEN at
          # 15:32Z on 07-27 and the identical tree audited RED (170 errors)
          # at 04:17Z on 07-28, because 0.38.0 landed in between. You could
          # not tell a regression from a corpus bump.
          # Bump this pin as its own reviewable commit, so the new findings
          # arrive attributable and someone owns them.
          # NOTE: the org reusable quality-audit.yml installs scitex-dev
          # UNPINNED, so every other package in the fleet still has this
          # non-reproducibility. Worth fixing upstream.
          uv pip install --python .venv/bin/python "scitex-dev[cli-audit]==0.38.1"

      # Use the pytest wrapper so the documented `skip_rules` deferrals in
      # tests/develop/test_audit.py are honoured. Calling `scitex-dev
      # ecosystem audit-all` directly bypasses skip_rules and forces every
      # in-flight migration campaign (TQ-migration, CLI noun-verb, umbrella
      # thinning) to land in one commit, which is not how this repo
      # schedules them. Unknown rules still SURFACE as failures because
      # `audit_all_for_package` raises on any unrecognised violation.
      #
      # This is also why hub does NOT call the org reusable quality-audit.yml
      # even though one exists and targets these same runners: that workflow
      # runs `scitex-dev ecosystem audit-all` DIRECTLY, which bypasses
      # skip_rules entirely. Adopting it wholesale would fire every deferred
      # campaign at once. We take its runner + install shape, not its
      # invocation.
      - name: Run audit via pytest wrapper (honors skip_rules)
        run: |
          set -euo pipefail
          # .venv/bin on PATH so the `scitex-dev` subcommands that audit-all
          # spawns resolve to the pinned one, not to anything on the shared
          # runner's PATH.
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/python -m pytest tests/develop/test_audit.py -q --no-header
